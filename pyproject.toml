[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "fitness-agent"
version = "0.1.0"
description = "Fitness PWA runtime helpers (package fitness.* SOT = coach-dev)"
authors = [
    { name = "Alpha OS team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "loguru>=0.7.3",
    "watchdog>=7.0.0",
    "wasabi>=1.1.3",
    "typer>=0.27.3",
    "tqdm>=4.70.1",
    "halo>=0.0.31",
    "typing-extensions>=4.16.0",
    "firebase-admin>=7.7.0",
    "rapidfuzz>=3.14.6",
    "textual>=8.2.8",
    "pandas>=3.1.0",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "aiohttp>=3.14.5",
]

# CLI-Entry-Points für fitness.* / backend.* werden im Staging aus den
# gesyncten Bäumen erzeugt (coach-dev/fitness + backend/fitness/backend).
# Lokal: PYTHONPATH=~/dev/coach-dev:~/dev/backend/fitness

[project.scripts]
anatomy-agent = "anatomy_kb.cli:main"

[tool.poetry]
packages = [
    { include = "db" },
    { include = "anatomy_kb", from = "anatomy-kb" },
]
