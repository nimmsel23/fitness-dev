[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "fitness-agent"
version = "0.1.0"
description = "Local fitness agent foundation CLI"
authors = [
    { name = "Alpha OS team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "watchdog>=3.0.0",
    "wasabi>=1.1.2",
    "typer>=0.9.0",
    "tqdm>=4.66.0",
    "halo>=0.0.31",
    "typing-extensions>=4.0.0",
    "firebase-admin>=6.0.0",
    "rapidfuzz>=3.14.5",
    "textual>=0.58.0",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
fitness              = "fitness.cli:main"
fitness-log          = "fitness.commands.log:main"
fitness-tui          = "fitness.commands.tui:main"
fitness-activity     = "fitness.commands.activity:main"
fitness-mail         = "fitness.commands.mail:main"
fitness-sync         = "fitness.commands.sync:main"
firestore-sync       = "firestore.sync_cli:main"
fitness-catalog      = "fitness.catalog.cli:main"
fitness-catalog-api  = "fitness.catalog.api.api:main"
anatomy-agent        = "anatomy_kb.cli:main"

[tool.poetry]
packages = [
    { include = "firestore_kb" },
    { include = "firestore" },
    { include = "fitness" },
    { include = "db" },
    { include = "anatomy_kb", from = "anatomy-kb" },
]
