exercise_id: pull_up
name: Klimmzug (Overhand)
category: pull
movement_pattern: vertical_pull
equipment: bar

simple_explanation: >
  Der Klimmzug ist nicht einfach "Arm ziehen". Der Latissimus zieht den
  Oberarm nach unten und zur Körpermitte — das ist die Hauptarbeit.
  Bizeps beugt den Ellenbogen. Die Schulterblätter müssen aktiv deprimieren
  und retrahieren, sonst übernimmt die obere Schulter und der Lat
  kann keine Kraft entwickeln.

detailed_explanation: >
  Der Musculus latissimus dorsi ist der primäre Krafterzeuger: Er adduziert
  und extendiert den Oberarm (zieht ihn von oben-außen zu Rumpf-unten).
  Der Bizeps brachii beugt den Ellenbogen. Entscheidend ist die Scapula:
  Der untere Trapezius und die Rhomboiden müssen die Schulterblätter
  deprimieren und retrahieren — nur dann kann der Lat aus seiner optimalen
  Länge heraus Kraft entwickeln. Ohne Scapula-Setup dominiert der obere
  Trapezius, der Nacken verkürzt und die Schulter wandert nach oben.

joint_actions:
  shoulder:
    concentric:
      - adduction
      - extension
      - internal_rotation_partial
    eccentric:
      - abduction_control
      - flexion_control
  scapula:
    concentric:
      - depression
      - retraction
      - downward_rotation_initial
    eccentric:
      - elevation_control
      - protraction_control
  elbow:
    concentric:
      - flexion
    eccentric:
      - extension_control

muscle_roles:
  primary:
    - latissimus_dorsi
  secondary:
    - biceps_brachii
    - teres_major
    - posterior_deltoid
  stabilizers:
    - trapezius_lower_middle
    - rhomboids
    - rotator_cuff
    - core_anterior_posterior

grip_variation_effect:
  overhand_wide:
    note: "Standard. Mehr Lat-Adduktion, weniger Bizeps-Hebel."
    increases:
      - latissimus_dorsi_width
  underhand_supinated:
    increases:
      - biceps_brachii
      - lower_lat_fibers
    note: "Supinierter Griff verbessert Bizeps-Mechanik (optimale Längen-Spannungs-Kurve)."
  neutral_grip:
    note: "Schulterfreundlich, guter Kompromiss Lat/Bizeps."
    increases:
      - brachialis

feel_cues:
  - "Ellenbogen Richtung Hosentaschen/Hüfte ziehen (nicht Richtung Boden)."
  - "Brust zur Stange, nicht Kinn."
  - "Schulterblätter zuerst nach unten — dann erst Arme beugen."
  - "Lat spüren wie ein breiter Schild der sich zusammenzieht."

coaching_cues:
  setup:
    - "Schulterbreiter bis etwas breiterer Griff."
    - "Scapula-Depression aktivieren bevor der Pull beginnt (Schultern von den Ohren)."
    - "Leichte Körperspannung, Beine überkreuzt oder gestreckt."
  execution:
    - "Scapula deprimieren → Ellenbogen zur Hüfte → Brust zur Stange."
    - "Vollständige Extension in der unteren Position (Armstreckung kontrolliert)."
    - "Keine Schwungbewegung aus der Hüfte."

common_errors_explained:
  shrugging_into_pull:
    description: "Schultern wandern beim Einleiten des Zugs nach oben."
    anatomical_reason: >
      Oberer Trapezius übernimmt kompensatorisch, wenn unterer Trapezius
      und Serratus nicht aktiv deprimieren. Dadurch verliert der Lat
      seinen stabilen Schulterblatt-Anker — die Kraft bricht zusammen.
    correction: "Schulterblätter aktiv 'nach unten weg von den Ohren' vor dem Zug."
    teaches:
      - scapulohumeral_rhythm
      - lower_trapezius_function
      - lat_mechanics

  pulling_with_arms_only:
    description: "Nur der Bizeps arbeitet, kein Lat-Engagement spürbar."
    anatomical_reason: >
      Wenn Schulterblatt-Depression und Schulterextension fehlen, wird
      die Ellenbogenbeugung zur Hauptbewegung. Der Lat ist anatomisch
      jedoch ein Schultergelenk-Beweger, kein Ellenbogengelenk-Beweger.
    correction: "Bewegung mental mit 'Ellenbogen zur Hüfte' initiieren, nicht mit 'Hand zur Schulter'."
    teaches:
      - latissimus_dorsi_anatomy
      - proximal_to_distal_principle

  half_reps:
    description: "Kein vollständiges Strecken in der unteren Position."
    anatomical_reason: >
      Ohne volle Extension (Schulterflexion + Scapula-Elevation) wird
      der Lat nicht in der Länge trainiert. Das limitiert hypertrophes
      Potential und die Mobilität im Schultergelenk.
    correction: "Kontrolliertes Absenken bis zur vollen Streckung — dann neu einleiten."
    teaches:
      - full_range_of_motion_principle
      - stretch_mediated_hypertrophy

quiz_prompts:
  - question: "Warum spüren viele Anfänger Klimmzüge mehr im Bizeps als im Rücken?"
    answer: >
      Weil sie die Scapula nicht aktiv deprimieren und den Lat nicht
      über Schulterextension/-adduktion einleiten. Stattdessen dominiert
      die Ellenbogenbeugung — das ist klassische Bizeps-Arbeit ohne Lat-Beteiligung.

  - question: "Was ändert sich beim Untergriff anatomisch?"
    answer: >
      Supination des Unterarms bringt den Bizeps in seine mechanisch
      günstigste Position (optimale Längen-Spannungs-Kurve). Dadurch
      leistet der Bizeps mehr Beitrag zur Gesamtkraft. Der Lat bleibt
      primärer Mover, aber der Untergriff erlaubt oft mehr Wiederholungen.

  - question: "Warum ist Scapula-Depression so wichtig beim Klimmzug?"
    answer: >
      Der Latissimus hat seinen proximalen Ursprung am Beckenkamm, Wirbelsäule
      und unterem Rippenbogen — nicht an der Scapula. Aber er inseriert am
      Humerus. Für optimale Kraftentwicklung braucht er eine stabile,
      deprimierte Scapula als indirekten Anker. Ohne das übernimmt der
      obere Trapezius, der Nacken spannt, und die Lat-Kontraktion bleibt ineffizient.
