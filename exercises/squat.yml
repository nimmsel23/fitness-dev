exercise_id: squat
name: Kniebeuge
category: squat
movement_pattern: bilateral_squat
equipment: barbell

simple_explanation: >
  Die Kniebeuge ist das komplexeste Bewegungsmuster im Training.
  Quadrizeps streckt das Knie, Gluteus maximus streckt die Hüfte,
  Rückenstrecker halten den Rumpf aufrecht, und fast jeder Muskel
  der Beine stabilisiert gleichzeitig. Die Kniebeuge zeigt dir Hüft-,
  Knie- und Sprunggelenkmechanik in einer einzigen Bewegung.

detailed_explanation: >
  Exzentrisch (abwärts): Hüfte, Knie und Sprunggelenk flektieren
  kontrolliert gleichzeitig. Der Quadrizeps kontrolliert Kniebeugung,
  Gluteus maximus und Hamstrings kontrollieren die Hüftbeugung,
  die Wadenmuskulatur kontrolliert Dorsalflexion im Sprunggelenk.
  Konzentrisch (aufwärts): Gluteus maximus und Quadrizeps arbeiten
  simultan. Gluteus max ist der primäre Hüftstrecker, Quadrizeps der
  primäre Kniestrecker. Die Hamstrings wirken als Synergisten zur
  Hüftstreckung. Core und Rückenstrecker halten Rumpfstabilität
  unter axialer Last. Der Gluteus medius stabilisiert das Becken
  lateral gegen Einknicken.

joint_actions:
  hip:
    eccentric:
      - flexion_control
    concentric:
      - extension
  knee:
    eccentric:
      - flexion_control
    concentric:
      - extension
  ankle:
    eccentric:
      - dorsiflexion
    concentric:
      - plantar_flexion_partial
  lumbar_spine:
    static:
      - neutral_maintenance
      - extension_stabilization

muscle_roles:
  primary:
    - quadriceps_femoris
    - gluteus_maximus
  secondary:
    - hamstrings
    - adductor_magnus
  stabilizers:
    - gluteus_medius
    - gluteus_minimus
    - erector_spinae
    - core_anterior
    - gastrocnemius_soleus
    - tibialis_anterior
    - foot_intrinsics

stance_variation_effect:
  narrow_stance:
    increases:
      - quadriceps_femoris
      - vastus_lateralis
    note: "Mehr Knie-dominante Bewegung, weniger Hüftbeugung."
  wide_stance:
    increases:
      - gluteus_maximus
      - adductor_magnus
    note: "Mehr Hüftbeugung, höherer Gluteus/Adduktoren-Anteil."
  heel_elevation:
    increases:
      - quadriceps
      - knee_flexion_depth
    decreases_requirement:
      - ankle_dorsiflexion
    note: "Erhöhte Ferse kompensiert mangelnde Dorsalflexion. Lehrreich für Mobilität."

feel_cues:
  - "Gesäß sinkt in der Abwärtsbewegung kontrolliert nach hinten/unten."
  - "Knie bleiben über Zehen, nicht dahinter einknicken."
  - "Beim Hochkommen Boden wegdrücken — Gluteus maximus spüren."
  - "Rücken bleibt aufrecht, keine Vorbeuge aus dem Rumpf."
  - "Gluteus medius hält Knie aktiv auseinander."

coaching_cues:
  setup:
    - "Füße schulterbreit bis etwas breiter, Zehen leicht auswärts (15–30°)."
    - "Stange auf mittlerem Trapezius (High Bar) oder Deltoid-Rücken (Low Bar)."
    - "Tief einatmen in Bauch + Rücken, Bauchpresse aufbauen (Valsalva kontrolliert)."
  execution:
    - "Hüfte und Knie gleichzeitig beugen — nicht zuerst Knie."
    - "Oberkörper der Stange folgen lassen (leichte Vorneigung natürlich)."
    - "Knie über Zehen führen, nicht nach innen drücken lassen."
    - "Mindest-Tiefe: Oberschenkel parallel. Ideal: darunter wenn Mobilität vorhanden."

common_errors_explained:
  knee_valgus:
    description: "Knie fallen beim Absenken oder Hochkommen nach innen."
    anatomical_reason: >
      Kombiniertes Versagen von Gluteus medius (Hüftabduktion/-außenrotation)
      und Fuß-/Sprunggelenk-Stabilität. Das Femur innenrotiert, die Tibia
      folgt — klassische Beinachsen-Instabilität. Oft verstärkt durch
      schwache Hüftaußenrotatoren oder eingeschränkte Dorsalflexion
      (Kompensation über Pronation und Knieeinknicken).
    correction: "Knie aktiv auseinander drücken. Gluteus medius aktivieren."
    teaches:
      - gluteus_medius_function
      - knee_valgus_biomechanics
      - foot_arch_and_knee_chain

  forward_lean:
    description: "Oberkörper kippt stark nach vorne beim Absenken."
    anatomical_reason: >
      Entweder mangelnde Hüftmobilität (Hüfte kann nicht genug flektieren
      ohne Rücken-Kompensation), eingeschränkte Dorsalflexion im Sprunggelenk,
      oder Schwäche der Rückenstrecker unter Last. Bei Low Bar ist mehr
      Vorneigung anatomisch beabsichtigt und korrekt.
    correction: "Dorsalflexion testen. Bei High Bar: Brust hoch, Rückenstrecker aktivieren."
    teaches:
      - ankle_dorsiflexion_importance
      - hip_mobility_and_squat_depth
      - torso_angle_mechanics

  butt_wink:
    description: "Becken kippt am unteren Ende der Bewegung nach hinten (posteriore Pelvis-Kippung)."
    anatomical_reason: >
      Die Hüftflexion überschreitet die verfügbare Hüftmobilität oder
      Hüftbeuger/Hüftkonstruktion. Der Rücken muss kompensieren
      (lumbare Flexion). Leichtes Butt Wink ist anatomisch normal
      und klinisch irrelevant. Starkes Wink unter Last problematisch.
    correction: "Tiefe reduzieren bis kurz über Wink. Hüftmobilität verbessern."
    teaches:
      - hip_anatomy_variability
      - lumbar_flexion_under_load
      - individual_hip_structure

quiz_prompts:
  - question: "Warum ist die Kniebeuge eine Knie- UND Hüftübung?"
    answer: >
      Weil Quadrizeps (Kniestreckung) und Gluteus maximus (Hüftstreckung)
      gleichzeitig konzentrisch arbeiten. Wer nur den Quadrizeps trainieren
      will, nimmt eher Beinpresse oder Hackenschmidt. Die Kniebeuge ist
      ein Kombinationsmuster aus Kniestreckung und Hüftstreckung unter
      axialer Last.

  - question: "Warum fühlen manche die Kniebeuge mehr im Rücken als in den Beinen?"
    answer: >
      Häufig liegt ein hohes Maß an Vorlage vor (stark nach vorne geneigter
      Oberkörper). Das erhöht das Drehmoment auf die Lendenwirbelsäule und
      die Rückenstrecker müssen kompensieren. Ursache ist meist
      Sprunggelenk-Dorsalflexionsmangel oder Hüftmobilitätsdefizit.

  - question: "Was passiert anatomisch, wenn die Knie beim Aufstehen nach innen fallen?"
    answer: >
      Femur innenrotiert, Tibia folgt, das Patellofemoralgelenk wird in
      einer ungünstigen Position belastet. Ursache: Gluteus medius zu schwach
      für Hüftabduktion/-außenrotation, oder Fußpronation zieht die
      gesamte Beinachse nach innen. Lehrt die Funktion des Gluteus medius
      als Becken-/Beinachsen-Stabilisator.
