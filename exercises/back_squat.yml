exercise_id: back_squat
muscle_anatomy:
  trapezius:
    latin: Musculus Trapezius
    origin: Linea nuchae superior (medialer Anteil), Protuberantia occipitalis externa,
      Ligamentum nuchae, Processus spinosi der Hals- und Brustwirbel (C1-T12)
    insertion: Clavicula (laterales Drittel), Acromion, Spina scapulae
    innervation: Nervus accessorius (CN XI), Plexus cervicalis (C2-C4)
    function_in_exercise: Die oberen Fasern des Trapezius bilden eine Ablagefläche
      für die Langhantel bei der High Bar Position und stabilisieren die Schulterblätter
      und den oberen Rücken, um eine aufrechte Haltung zu unterstützen.
  deltoideus:
    latin: Musculus Deltoideus
    origin: Clavicula (lateraler Anteil), Acromion, Spina scapulae
    insertion: Tuberositas deltoidea humeri
    innervation: Nervus axillaris (C5, C6)
    function_in_exercise: Die posterioren Fasern des Deltoideus, zusammen mit der
      Spina scapulae, dienen als Ablagefläche für die Langhantel bei der Low Bar Position,
      wodurch die Hantel sicher auf dem Rücken platziert wird.
  quadriceps:
    latin: Musculus Quadriceps Femoris
    origin: 'Rectus Femoris: Spina iliaca anterior inferior (SIAI), Corpus ossis ilii
      superior des Acetabulum. Vastus Lateralis: Linea aspera (laterale Lippe), Trochanter
      major. Vastus Medialis: Linea aspera (mediale Lippe), Linea intertrochanterica.
      Vastus Intermedius: Vordere und laterale Femurschaftoberfläche.'
    insertion: Patella über die Quadricepssehne, Tuberositas tibiae über das Ligamentum
      patellae
    innervation: Nervus femoralis (L2, L3, L4)
    function_in_exercise: Der Quadriceps ist der primäre Knieextensor. Er ist maßgeblich
      für das Aufrichten aus der Hocke verantwortlich und kontrolliert die Kniebeugung
      während der Abwärtsbewegung, besonders aktiv bei einer aufrechteren Rumpfhaltung
      (High Bar).
  gluteus:
    latin: Musculi Glutei (hauptsächlich Musculus Gluteus Maximus)
    origin: Facies glutealis ossis ilii (hinterer Anteil), Kreuzbein (Os sacrum),
      Steißbein (Os coccygis), Fascia thoracolumbalis
    insertion: Tractus iliotibialis, Tuberositas glutea femoris
    innervation: Nervus gluteus inferior (L5, S1, S2)
    function_in_exercise: Die Gluteen, insbesondere der Gluteus Maximus, sind starke
      Hüftextensoren. Sie sind entscheidend für das explosive Aufrichten aus der Hocke
      und die Stabilisierung des Beckens, besonders bei tieferen Hocken und mehr Rumpfvorlage
      (Low Bar).
  hamstrings:
    latin: Musculi Ischiocrurales (Biceps Femoris, Semitendinosus, Semimembranosus)
    origin: 'Tuberositas ischiadica (alle Köpfe außer Caput breve des M. biceps femoris).
      Caput breve M. biceps femoris: Linea aspera femoris.'
    insertion: Tibia (medialer Kondylus für Semimembranosus, pes anserinus für Semitendinosus)
      und Fibula (Caput fibulae für Biceps Femoris).
    innervation: Nervus ischiadicus (tibialer und fibularer Anteil) (L4, L5, S1, S2)
    function_in_exercise: Die Hamstrings wirken synergistisch mit den Gluteen als
      Hüftextensoren und unterstützen die Kniestabilisierung. Sie sind besonders aktiv
      bei der Hüftextension in Squats mit stärkerer Rumpfvorlage (Low Bar) und wirken
      der Kniehyperextension entgegen.
