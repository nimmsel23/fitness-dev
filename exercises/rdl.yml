exercise_id: romanian_deadlift
name: Romanian Deadlift (RDL)
category: hinge
movement_pattern: hip_hinge
equipment: barbell_dumbbell

simple_explanation: >
  Der RDL ist die reinste Lehrübung für die Hüftgelenksbewegung.
  Er zeigt dir wie Hamstrings und Gluteus maximus als Hüftstrecker
  zusammenarbeiten und warum die Wirbelsäule neutral bleiben muss,
  damit Kraft übertragen wird statt absorbiert. Wer den RDL versteht,
  versteht das Hip Hinge — das Fundament von Deadlift, Kettlebell Swing
  und Hüftstreckung im Sport.

detailed_explanation: >
  Exzentrisch: Der Rumpf neigt sich nach vorne durch Hüftbeugung —
  nicht durch Kniebeugen oder Rückenrunden. Die Hamstrings werden
  auf Dehnung gebracht (Dehnung in Ursprung am Sitzbein + Ansatz
  unter Knie). Gluteus maximus wird exzentrisch gedehnt.
  Die Wirbelsäule bleibt neutral unter isometrischer Spannung
  der Rückenstrecker.
  Konzentrisch: Gluteus maximus und Hamstrings ziehen das Becken
  in die Streckung (anteriore Kipplage → neutral). Die Hüfte
  führt die Bewegung, der Rücken folgt passiv. Entscheidend:
  der RDL trainiert die Hamstrings biartikulär — sie überbrücken
  Hüft- und Kniegelenk und werden in der langen Position
  (Hüfte flektiert) besonders stark in die Dehnung gebracht.

joint_actions:
  hip:
    eccentric:
    - flexion_hinge
    concentric:
    - extension
  knee:
    static:
    - slight_flexion_maintained
    - no_active_movement
  lumbar_spine:
    static:
    - neutral_maintenance
    - no_flexion_or_extension
  pelvis:
    eccentric:
    - anterior_tilt_controlled
    concentric:
    - posterior_tilt_to_neutral

muscle_roles:
  primary:
  - hamstrings
  - gluteus_maximus
  secondary:
  - adductor_magnus
  stabilizers:
  - erector_spinae
  - multifidus
  - core_anterior
  - upper_back_scapular_retractors
  - grip_forearms

rdl_vs_deadlift:
  rdl:
    note: "Knie bleiben in leichter Beugung, Hüfte geht weiter nach hinten. Primär Hamstring/Glute."
    hip_hinge_dominance: high
    knee_flexion: minimal_static
    bar_path: close_to_legs_hinging_back
  conventional_deadlift:
    note: "Mehr Kniebeugung am Start. Kombination Knie- und Hüftstreckung. Mehr Quadrizeps-Anteil."
    hip_hinge_dominance: moderate
    knee_flexion: significant_at_start

feel_cues:
- "Hüfte geht nach hinten — nicht nach unten."
- "Hamstrings dehnen sich hinter den Knien beim Absenken."
- "Rücken bleibt flach, keine Rundung in der Lendenwirbelsäule."
- "Beim Hochkommen die Hüfte vordrücken, nicht den Rücken strecken."
- "Stange nah am Körper — fast Schienbein/Oberschenkel berühren."

coaching_cues:
  setup:
  - "Schulterbreiter Stand, leichte Kniebeugung fixieren."
  - "Stange in Hüftbreite, Griff schulterbreit."
  - "Schulterblätter retrahieren, Brust hoch, Wirbelsäule neutral."
  execution:
  - "Hüfte nach hinten schieben (Hip Hinge) — wie gegen eine Wand dahinter drücken."
  - "Stange nah am Körper entlangführen, keine Bogenform."
  - "Absenken bis Dehnung in Hamstrings spürbar (nicht bis Wirbelsäule rundet)."
  - "Hüfte durch nach vorne — konzentrisch Gluteus maximus."

common_errors_explained:
  knie_schieben_vor:
    description: Die Knie beugen sich übermäßig stark und schieben nach vorne, anstatt den Hüftscharnier (Hip-Hinge) zu betonen.
    anatomical_reason: Übermäßige Kniebeugung reduziert die effektive Dehnung und Spannung auf die Ischiokrurale Muskulatur,
      da der Abstand zwischen deren Ursprung und Ansatz verkürzt wird. Dies führt zu einer Verlagerung des Schwerpunkts und
      einem Verlust des Hip-Hinge-Musters, da die primäre Hüftbewegung durch Kniebeugung kompensiert wird. Die Quadrizepse
      werden unnötig involviert, anstatt die posteriore Kette zu isolieren.
    correction: Wand-Hinge/Box-Hinge zum Erlernen des Hüftscharniers; Kniewinkel bei ~15-20° fixieren und diese Position beibehalten.
    teaches:
    - Hüftscharnier (Hip-Hinge)
    - Ischiokrurale Muskulatur (Hamstrings) Länge-Spannungs-Beziehung
    - Aktivierung der posterioren Kette vs. Quadrizeps
  rundruecken:
    description: Der untere Rücken (Lendenwirbelsäule) beugt sich während der Bewegung, wodurch die neutrale Wirbelsäulenposition
      verloren geht.
    anatomical_reason: Dies ist auf unzureichende isometrische Kraft der Rückenstrecker (Musculi erector spinae) oder fehlende
      neuromuskuläre Kontrolle zurückzuführen, um die Lendenwirbelsäule gegen die Beugung durch die Last und die Hüftflexion
      stabil zu halten. Dies erhöht das Schermoment auf Bandscheiben und Bänder der Wirbelsäule, was das Verletzungsrisiko
      steigert. Es kann auch eine Kompensation für mangelnde Hamstring-Mobilität sein.
    correction: Bewegungsumfang (ROM) kürzen; nicht tiefer gehen, als eine neutrale Wirbelsäule möglich ist. Tempo verlangsamen
      (3-1-1), um mehr Zeit für die Kontrolle der Wirbelsäule zu geben.
    teaches:
    - Wirbelsäulenstabilisierung
    - Neutrale Wirbelsäulenposition
    - Rolle der Musculi erector spinae
    - Bandscheibenbelastung
    - Hüftmobilität
  zu_tief:
    description: Der Athlet versucht, die Bewegungstiefe (ROM) über den Punkt hinaus zu erzwingen, an dem eine neutrale Wirbelsäule
      und die Spannung in den Hamstrings aufrechterhalten werden können.
    anatomical_reason: Dies geschieht oft aufgrund mangelnden Verständnisses der individuellen Mobilitätsgrenzen, insbesondere
      der Hamstring-Länge. Wenn die Hamstrings ihre maximale Dehnung erreicht haben, ohne dass die Bewegung stoppt, kompensiert
      der Körper häufig durch eine Beugung der Lendenwirbelsäule (Rundrücken). Dies führt zu denselben Risiken wie der 'Rundrücken'-Fehler
      und überdehnt die Hamstrings möglicherweise nicht effektiver, sondern verlagert die Belastung auf die Wirbelsäule.
    correction: End-Range markieren (z.B. mit Straps oder Pins) um eine visuelle oder taktile Grenze zu setzen. Den Cue 'Nur
      so tief, wie neutral' anwenden.
    teaches:
    - Individuelle ROM
    - Mobilität (insbesondere Hamstring-Länge)
    - Neutrale Wirbelsäulenposition
    - Kompensationsmuster
    - Schutz der Wirbelsäule
quiz_prompts:
- question: "Warum ist der RDL eine bessere Hamstring-Übung als der Beinbeuger?"
  answer: >
    Der RDL trainiert die Hamstrings biartikulär in der langen Position:
    Hüfte flektiert, Knie leicht gebeugt. Das erzeugt den stärksten
    Dehnungsreiz auf die Muskel-Sehnen-Einheit. Der Beinbeuger isoliert
    die Hamstrings, aber in einer kürzeren Position und ohne Hüftkomponente.
    Stretch-mediierte Hypertrophie spricht für Langposition-Training.

- question: "Was unterscheidet anatomisch Hip Hinge von Squat?"
  answer: >
    Hip Hinge: primär Hüftbeugung bei minimaler Knieflexion.
    Posteriore Kette dominiert (Hamstrings, Gluteus maximus).
    Squat: kombinierte Hüft- und Kniebewegung. Quadrizeps und
    Gluteus maximus teilen sich die Arbeit. Im Hip Hinge geht der
    Rumpf nach vorne, im Squat sinkt der Rumpf nach unten.

- question: "Warum muss die Wirbelsäule beim RDL neutral bleiben?"
  answer: >
    Die Wirbelsäule überträgt die Last von den Beinen/Hüfte zur Stange.
    In neutraler Position sind die Bandscheiben gleichmäßig belastet
    und die tiefen Rückenstrecker können die Wirbel stabil halten.
    In Flexion unter axialer Last: die hintere Annuluslamellen der
    Bandscheiben werden auf Zug beansprucht — Langzeitbelastung
    erhöht Diskuspathologie-Risiko.
muscle_anatomy:
  musculi_ischiocrurales:
    latin: Musculi ischiocrurales (Biceps femoris, Semitendinosus, Semimembranosus)
    origin: Tuber ischiadicum (Sitzbeinhöcker) für alle drei Muskeln; kurzer Kopf des M. biceps femoris zusätzlich an der
      Linea aspera femoris.
    insertion: 'M. biceps femoris: Caput fibulae (Wadenbeinköpfchen) und Condylus lateralis tibiae. M. semitendinosus: Pes
      anserinus superficialis (mediale Tibia). M. semimembranosus: Condylus medialis tibiae.'
    innervation: N. ischiadicus (L4-S3)
    function_in_exercise: Primär exzentrische Kontrolle der Hüftflexion und Knieextension in der Abwärtsbewegung, wodurch
      Spannung in der hinteren Oberschenkelmuskulatur erzeugt wird. Konzentrische Hüftextension in der Aufwärtsbewegung. Ihre
      Länge limitiert maßgeblich die Bewegungstiefe.
  musculus_gluteus_maximus:
    latin: Musculus gluteus maximus
    origin: Facies glutea ossis ilii (dorsal der Linea glutea posterior), Dorsalseite des Os sacrum und Os coccygis, Ligamentum
      sacrotuberale, Fascia thoracolumbalis.
    insertion: Tuberositas glutealis femoris (an der Linea aspera), Tractus iliotibialis.
    innervation: Nervus gluteus inferior (L5-S2)
    function_in_exercise: Hauptverantwortlich für die Hüftextension in der Aufwärtsbewegung (konzentrisch) und exzentrische
      Kontrolle der Hüftflexion in der Abwärtsbewegung, um das Hip-Hinge-Muster zu unterstützen.
  musculi_erector_spinae:
    latin: Musculi erector spinae (M. iliocostalis, M. longissimus, M. spinalis)
    origin: Ursprungssehnenplatte am Os sacrum, Crista iliaca, Processus spinosi der LWS und kaudalen BWS.
    insertion: Anguli costarum (Rippenwinkel), Processus transversi der Brust- und Halswirbel, Processus mastoideus, Processus
      spinosi der Brust- und Halswirbel.
    innervation: Rami posteriores nervorum spinalium (C1-S5)
    function_in_exercise: Isometrische Kontraktion zur Stabilisierung der Wirbelsäule in einer neutralen Position und zur
      Verhinderung von Flexion (Rundrücken), wodurch die Integrität der Wirbelsäule während der Bewegung geschützt wird.
  musculi_iliopsoas:
    latin: Musculi iliopsoas (M. psoas major, M. iliacus)
    origin: 'M. psoas major: Seitenflächen und Processus transversi der Wirbel Th12-L5. M. iliacus: Fossa iliaca, Crista iliaca,
      Pars lateralis ossis sacri.'
    insertion: Trochanter minor femoris.
    innervation: N. femoralis (L1-L4), direkte Äste aus dem Plexus lumbalis (L1-L3).
    function_in_exercise: Die Hüftbeuger werden in der Abwärtsbewegung des RDL, bei der eine starke Hüftflexion stattfindet,
      passiv gedehnt. Ihre Flexibilität ist entscheidend für die volle Bewegungstiefe und das Aufrechterhalten einer neutralen
      Wirbelsäule. Sie sind nicht primär aktiv bei der Bewegungsausführung.
