exercise_id: lunge
name: Ausfallschritt
category: squat
movement_pattern: unilateral_squat
equipment: bodyweight_barbell_dumbbell

simple_explanation: >
  Der Ausfallschritt ist die Kniebeuge in der Einbeinvariante.
  Er zeigt dir Beinachsen-Kontrolle, Beckenstabilität und die
  unabhängige Arbeit beider Beinseiten. Weil nur ein Bein
  gleichzeitig trägt, werden Schwächen im Gluteus medius und in der
  Fußstabilität sofort sichtbar.

detailed_explanation: >
  Das vordere Bein übernimmt die Haupt-Kraftentwicklung:
  Quadrizeps streckt das Knie konzentrisch, Gluteus maximus streckt
  die Hüfte. Das hintere Bein stabilisiert und hilft in der
  konzentrischen Phase mit. Entscheidend ist die Lateralstabilität
  des Beckens: Gluteus medius auf der Standseite verhindert das
  seitliche Absacken des Beckens. Die Adduktoren führen den
  Oberschenkel in der Längsachse. Das Sprunggelenk muss Dorsalflexion
  erlauben (vorderes Bein) für korrekten Knieweg über Zehen.

joint_actions:
  front_leg:
    hip:
      eccentric:
      - flexion_control
      concentric:
      - extension
    knee:
      eccentric:
      - flexion_control
      concentric:
      - extension
    ankle:
      eccentric:
      - dorsiflexion
      concentric:
      - plantar_flexion_partial
  back_leg:
    hip:
      role: "Stabilisierung, konzentrische Streckungshilfe"
      actions:
      - extension_assist
    knee:
      role: "Kontrollierte Beugung bis zur Nähe Boden"
    ankle:
      role: "Plantarflexion für Druckübertragung"

muscle_roles:
  primary:
    front_leg:
    - quadriceps_femoris
    - gluteus_maximus
  secondary:
  - hamstrings
  - adductor_magnus
  stabilizers:
  - gluteus_medius
  - gluteus_minimus
  - adductors
  - tibialis_anterior
  - foot_intrinsics
  - core_anterior_posterior

lunge_variation_effect:
  forward_lunge:
    note: "Mehr Quadrizeps-Belastung durch vorwärts Schwerpunkt-Shift."
    increases:
    - quadriceps
  reverse_lunge:
    note: "Kontrolliertere Variante, weniger Kniescherkräfte. Gut für Anfänger."
    increases:
    - gluteus_maximus
  walking_lunge:
    note: "Erhöhte Balance-Anforderung, propioceptiver Stimulus."
  lateral_lunge:
    increases:
    - adductors
    - gluteus_medius
    note: "Zeigt Frontalebenen-Mechanik, die Sagittal-Übungen nicht trainieren."
  deficit_lunge:
    increases:
    - hip_flexor_stretch
    - gluteus_maximus_range
    note: "Erhöhte ROM für Hüftstrecker."

feel_cues:
- "Hinteres Knie sinkt kontrolliert Richtung Boden."
- "Vorderes Knie bleibt über Zehen, kein Einknicken nach innen."
- "Gesäß des vorderen Beins arbeitet beim Hochkommen."
- "Becken bleibt waagerecht — kein seitliches Absacken."
- "Rumpf aufrecht, kein Vorneigen aus der Hüfte."

coaching_cues:
  setup:
  - "Schulterbreiter Stand, Schritt groß genug dass vorderes Knie nicht über Zehen kommt."
  - "Rumpfspannung aufbauen vor der Bewegung."
  execution:
  - "Hinteres Knie senkrecht Richtung Boden."
  - "Vorderes Knie über Zehen, nie nach innen."
  - "Oberkörper aufrecht, Blick geradeaus."
  - "Gleichmäßig durch Ferse und Ballen hochdrücken."

common_errors_explained:
  knie_valgus_kollaps:
    description: Vorderes Knie fällt nach innen.
    anatomical_reason: Schwäche des M. gluteus medius und fehlende Ansteuerung der Außenrotatoren der Hüfte führen zu einer
      Instabilität der kinetischen Kette.
    correction: Knie aktiv nach außen über die Fußspitze schieben; Fokus auf Fußgewölbe-Stabilität.
    teaches:
    - kniegelenk_stabilität
    - aktivierung_der_hüftabduktoren
  vorwaerts_kippen_oberkoerper:
    description: Der Torso neigt sich zu stark nach vorne.
    anatomical_reason: Mangelnde Core-Stabilität oder verkürzte Hüftbeuger, die den Oberkörper in eine Vorneigung zwingen,
      um das Gleichgewicht zu halten.
    correction: Core fest anspannen, Brustbein anheben, Fokus auf vertikale Bewegung statt Vorwärtsneigung.
    teaches:
    - core_stabilität
    - haltungsaufrichtung
  gewicht_auf_fussspitze:
    description: Die Ferse hebt beim vorderen Bein ab.
    anatomical_reason: Verlagerung des Schwerpunkts nach vorne führt zu einer Überlastung der Patellasehne und fehlender Aktivierung
      der posterioren Kette (Gluteus).
    correction: Gewicht bewusst in die Ferse verlagern, gesamter Fuß bleibt vollflächig am Boden.
    teaches:
    - druckpunktverteilung
    - posteriore_kettenaktivierung
quiz_prompts:
- question: "Warum zeigt der Ausfallschritt Schwächen, die die Kniebeuge verbirgt?"
  answer: >
    Bei der bilateralen Kniebeuge kann das stärkere Bein das schwächere
    kompensieren. Im Ausfallschritt trägt jedes Bein unabhängig — Defizite
    in Kraft, Stabilität und Mobilität werden sofort sichtbar. Besonders
    Gluteus medius Schwäche zeigt sich im unilateralen Standbein-Muster.

- question: "Warum ist der Ausfallschritt funktioneller als die Beinpresse?"
  answer: >
    Der Ausfallschritt erfordert dynamische Balance, Beckenstabilität und
    Koordination zwischen mehreren Gelenken. Die Beinpresse fixiert den
    Rumpf — sie isoliert Quadrizeps/Gluteus maximus, aber trainiert keine
    Lateralstabilität, keine Propriozeption und keine Beinachsen-Kontrolle.
muscle_anatomy:
  quadriceps:
    latin: Musculus quadriceps femoris
    origin: Tuber ischiadicum (indirekt über Becken/Femur), Spina iliaca anterior inferior, Femur-Vorderfläche
    insertion: Tuberositas tibiae (über Patellasehne)
    innervation: Nervus femoralis (L2–L4)
    function_in_exercise: Er fungiert als Haupttreiber in der konzentrischen Phase durch die Streckung des Kniegelenks.
  gluteus_maximus:
    latin: Musculus gluteus maximus
    origin: Os ilium (dorsale Fläche), Os sacrum, Os coccygis
    insertion: Tuberositas glutea ossis femoris, Tractus iliotibialis
    innervation: Nervus gluteus inferior (L5–S2)
    function_in_exercise: Er ist maßgeblich für die Hüftstreckung verantwortlich, um den Körper aus der tiefen Position wieder
      aufzurichten.
  gluteus_medius:
    latin: Musculus gluteus medius
    origin: Facies glutea des Os ilium
    insertion: Trochanter major des Femurs
    innervation: Nervus gluteus superior (L4–S1)
    function_in_exercise: Er stabilisiert das Becken frontal und verhindert ein Abkippen während der einbeinigen Belastung.
  hamstrings:
    latin: Musculus biceps femoris, M. semitendinosus, M. semimembranosus
    origin: Tuber ischiadicum
    insertion: Caput fibulae, Condylus medialis tibiae
    innervation: Nervus ischiadicus (L5–S2)
    function_in_exercise: Sie unterstützen den Gluteus maximus bei der Hüftstreckung und stabilisieren das Kniegelenk exzentrisch.
  adduktoren:
    latin: Musculus adductor magnus, longus, brevis
    origin: Os pubis, Ramus ossis ischii
    insertion: Linea aspera des Femurs
    innervation: Nervus obturatorius (L2–L4)
    function_in_exercise: Sie unterstützen die Hüftstabilität und verhindern eine unerwünschte Abduktion oder Instabilität
      des Standbeins.
  erector_spinae:
    latin: Musculus erector spinae
    origin: Sakrum, Ilium, Dornfortsätze der Lendenwirbel
    insertion: Rippen, Processus transversi der Wirbel, Os occipitale
    innervation: Rami dorsales der Spinalnerven (C1–S5)
    function_in_exercise: Er hält die Wirbelsäule in einer aufrechten Position gegen die Schwerkraft und verhindert ein Einknicken
      des Oberkörpers.
