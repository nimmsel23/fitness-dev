exercise_id: bench_press
name: Bankdrücken
category: push
movement_pattern: horizontal_push
equipment: barbell

simple_explanation: >
  Bankdrücken zeigt dir, wie Brust, vordere Schulter und Trizeps beim
  horizontalen Drücken zusammenarbeiten. Der Pectoralis major führt die
  Bewegung, der Trizeps streckt den Ellenbogen durch, die vordere Schulter
  unterstützt besonders in der unteren und mittleren Phase.

detailed_explanation: >
  Der Pectoralis major ist der primäre Krafterzeuger: Er zieht den Oberarm
  von außen unten zur Körpermitte (horizontale Adduktion) und addiert
  Schulterflexionsanteile. Der Trizeps brachii übernimmt die Ellenbogen-
  extension von der Mitte bis zur vollen Streckung. Der Musculus deltoideus
  pars clavicularis (vordere Schulter) leistet in der ersten Bewegungshälfte
  den größten Synergisten-Beitrag. Die Scapula muss stabil retrahiert und
  deprimiert bleiben — das ist Aufgabe von Trapezius (mittlerer/unterer Anteil)
  und Rhomboiden.

joint_actions:
  shoulder:
    concentric:
    - horizontal_adduction
    - flexion_partial
    eccentric:
    - horizontal_abduction_control
    - extension_control
  elbow:
    concentric:
    - extension
    eccentric:
    - flexion_control
  scapula:
    static:
    - retraction
    - depression

muscle_roles:
  primary:
  - pectoralis_major
  secondary:
  - anterior_deltoid
  - triceps_brachii
  stabilizers:
  - serratus_anterior
  - trapezius_middle_lower
  - rhomboids
  - rotator_cuff

body_position_effect:
  incline:
    increases:
    - anterior_deltoid
    - pectoralis_major_clavicular_head
    decreases_relative:
    - pectoralis_major_sternal_head
  decline:
    increases:
    - pectoralis_major_sternal_head
    - lower_chest_fibers
    decreases_relative:
    - anterior_deltoid
  flat:
    note: "Ausgewogene Beteiligung aller Brustanteile."
  grip_width:
    wide:
      increases:
      - pectoralis_major
      decreases_relative:
      - triceps_brachii
    narrow:
      increases:
      - triceps_brachii
      - anterior_deltoid
      decreases_relative:
      - pectoralis_major_range

feel_cues:
- "Brustmuskeln spannen beim Herunterführen exzentrisch."
- "Beim Durchdrücken spürst du den Trizeps in der oberen Hälfte."
- "Vordere Schulter arbeitet besonders in der unteren Phase."
- "Schulterblätter bleiben die ganze Zeit aktiv nach hinten/unten gezogen."

coaching_cues:
  setup:
  - "Schulterblätter retrahieren und deprimieren, Brückenwölbung erlaubt."
  - "Stange über Mittelfuß-Schulter-Linie ins Rack."
  - "Griffweite: Unterarme senkrecht bei 90° Ellenbogenwinkel."
  execution:
  - "Stange kontrolliert zur unteren Brust führen."
  - "Ellenbogen 45–75° zum Rumpf (nicht 90° flared)."
  - "Explosiv drücken, Scapula-Setup halten."

common_errors_explained:
  shoulder_flare:
    description: "Ellenbogen weichen auf 90° zur Seite aus."
    anatomical_reason: >
      Bei 90° Ellenbogen-Flare liegt der Oberarmknochen in maximaler
      Außenrotation. Das impingiert den Supraspinatus im Schultergelenk
      und überlädt die vordere Schulterkapsel.
    correction: "Ellenbogen auf 45–60° einziehen, Lat minimal anspannen."
    teaches:
    - rotator_cuff
    - shoulder_impingement
    - glenohumeral_mechanics

  scapula_instability:
    description: "Schulterblätter kippen nach vorne/heben ab."
    anatomical_reason: >
      Wenn Serratus anterior und mittlerer Trapezius die Scapula nicht
      stabilisieren, verliert der Pectoralis major seinen stabilen Ursprung
      und die Kraftübertragung bricht zusammen.
    correction: "Vor dem Satz aktiv retrahieren und deprimieren. Halten."
    teaches:
    - scapulohumeral_rhythm
    - serratus_anterior_function
    - force_transfer_principle

  bar_path_deviation:
    description: "Stange wird zur Schulter statt zur unteren Brust geführt."
    anatomical_reason: >
      Zu hohe Stangen-Bahn bedeutet mehr Schulterflexion und weniger
      horizontale Adduktion — der Pectoralis major verliert ROM,
      vordere Schulter übernimmt.
    correction: "Stange Richtung Brustnippel/untere Brust absenken."
    teaches:
    - moment_arm_principles
    - pectoralis_major_fiber_orientation

quiz_prompts:
- question: "Warum ist Bankdrücken keine reine Brustübung?"
  answer: >
    Weil Trizeps (Ellenbogenstreckung) und vordere Schulter (horizontale
    Flexionsanteile) immer mitarbeiten. Je enger der Griff, desto mehr
    Trizeps. Je steiler die Bank, desto mehr Schulter.

- question: "Warum fühlen Anfänger Bankdrücken oft mehr in der Schulter als in der Brust?"
  answer: >
    Meist fehlende Scapula-Stabilität und/oder Ellenbogen-Flare.
    Wenn die Schulterblätter nicht gesetzt sind, fehlt der stabile
    Ursprung für den Pectoralis major — die Schulter übernimmt kompensatorisch.

- question: "Was passiert anatomisch beim Incline Bankdrücken?"
  answer: >
    Der klavikulare Anteil des Pectoralis major und der vordere Deltamuskel
    werden stärker rekrutiert, weil der Winkel mehr Schulterflexion beinhaltet.
    Der sternale Brustanteil verliert etwas Beteiligung.
muscle_anatomy:
  pectoralis_major:
    latin: Musculus Pectoralis Major
    origin: 'Pars clavicularis: vordere Fläche des medialen Drittels der Clavicula. Pars sternocostalis: Vorderfläche des
      Sternums und Knorpel der 2.-6. Rippe. Pars abdominalis: vorderes Blatt der Rektusscheide.'
    insertion: Crista tuberculi majoris des Humerus (Außenlippe des Sulcus intertubercularis).
    innervation: Nervus pectoralis lateralis (C5-C7), Nervus pectoralis medialis (C8-Th1).
    function_in_exercise: Primärer Agonist für die horizontale Adduktion des Arms, d.h. das Drücken der Hantel nach oben und
      zur Körpermitte, sowie für die Flexion des Arms im Schultergelenk.
  anterior_deltoid:
    latin: Musculus Deltoideus (Pars Clavicularis)
    origin: Laterales Drittel der Clavicula (vorderer Rand).
    insertion: Tuberositas deltoidea des Humerus.
    innervation: Nervus axillaris (C5-C6).
    function_in_exercise: Unterstützt den Pectoralis Major bei der Flexion und horizontalen Adduktion des Arms im Schultergelenk,
      insbesondere in der unteren Hälfte der Bewegung.
  triceps_brachii:
    latin: Musculus Triceps Brachii
    origin: 'Caput longum: Tuberculum infraglenoidale der Scapula. Caput laterale: Laterale und hintere Fläche des Humerus
      (proximal des Sulcus nervi radialis). Caput mediale: Posteriore Fläche des Humerus (distal des Sulcus nervi radialis).'
    insertion: Olecranon der Ulna.
    innervation: Nervus radialis (C6-C8).
    function_in_exercise: Primärer Agonist für die Extension des Unterarms im Ellenbogengelenk, entscheidend für das Ausstrecken
      der Arme gegen den Widerstand beim Hochdrücken der Hantel.
  serratus_anterior:
    latin: Musculus Serratus Anterior
    origin: Äußere Flächen der 1. bis 9. Rippe.
    insertion: Margo medialis der Scapula (vor allem Angulus superior und inferior).
    innervation: Nervus thoracicus longus (C5-C7).
    function_in_exercise: Stabilisiert die Scapula an der Thoraxwand durch Protraktion und Fixation und ermöglicht die Aufwärtsrotation
      der Scapula, wichtig für eine stabile Schulterachse beim Drücken.
  trapezius_middle_lower:
    latin: Musculus Trapezius (Pars Transversa et Pars Ascendens)
    origin: 'Pars transversa (middle): Dornfortsätze des 1. bis 4. Brustwirbels (Th1-Th4). Pars ascendens (lower): Dornfortsätze
      des 5. bis 12. Brustwirbels (Th5-Th12).'
    insertion: 'Pars transversa (middle): Acromion und Spina scapulae. Pars ascendens (lower): Spina scapulae (medialer Bereich).'
    innervation: Nervus accessorius (XI. Hirnnerv) und Äste aus dem Plexus cervicalis (C2-C4).
    function_in_exercise: Stabilisiert die Scapula durch Retraktion (mittlere Fasern) und Depression (untere Fasern) an der
      Brustwand, wodurch eine stabile Basis für die Bewegung des Humerus geschaffen wird.
  rhomboids:
    latin: Musculi Rhomboidei (Major et Minor)
    origin: 'Musculus Rhomboideus Minor: Dornfortsätze des 6. und 7. Halswirbels (C6-C7) und Ligamentum nuchae. Musculus Rhomboideus
      Major: Dornfortsätze des 1. bis 4. Brustwirbels (Th1-Th4).'
    insertion: 'Musculus Rhomboideus Minor: Margo medialis der Scapula (oberhalb der Spina scapulae). Musculus Rhomboideus
      Major: Margo medialis der Scapula (unterhalb der Spina scapulae bis zum Angulus inferior).'
    innervation: Nervus dorsalis scapulae (C4-C5).
    function_in_exercise: Retrahieren und elevieren die Scapula und rotieren sie nach unten, wodurch sie eine wichtige Rolle
      bei der Stabilisierung des Schultergürtels und der Fixierung der Scapula während der Druckbewegung spielen.
  rotator_cuff:
    latin: Musculi Rotatores Manchettae (bestehend aus M. supraspinatus, M. infraspinatus, M. teres minor, M. subscapularis)
    origin: Diverse Flächen der Scapula (Fossa supraspinata, Fossa infraspinata, laterale Grenze, Fossa subscapularis).
    insertion: Tuberculum majus und minus des Humerus.
    innervation: Nervus suprascapularis (C4-C6), Nervus axillaris (C5-C6), Nervi subscapulares (C5-C7).
    function_in_exercise: Stabilisieren den Humeruskopf zentrisch in der Gelenkpfanne des Schultergelenks (Cavitas glenoidalis)
      während der gesamten Bewegung und verhindern so ein Ausweichen des Gelenks während der Druckphase.
