  coaching_notes:
  - 'Nutze einen vollen Bewegungsumfang: Hänge dich vollständig aus und ziehe dich so hoch,
    dass dein Kinn über die Stange reicht.'
  - 'Führe die Bewegung kontrolliert aus: Vermeide Schwungholen und führe jede Wiederholung
    langsam und bewusst aus, besonders in der absteigenden Phase.'
  - 'Fokus auf Rücken- und Armmuskulatur: Konzentriere dich darauf, die Schulterblätter nach
    hinten und unten zu ziehen, um die Rückenmuskulatur zu aktivieren.'
  - 'Spann den Rumpf an: Halte den Bauch und unteren Rücken stabil, um eine gerade Körperlinie
    während der gesamten Übung zu gewährleisten.'
  common_errors:
  - 'Unvollständiger Bewegungsumfang: Nicht ganz nach oben ziehen oder sich nicht vollständig
    aushängen lassen, was die Effektivität reduziert.'
  - 'Schwungholen (Kipping): Einsatz von Hüften und Beinen, um sich hochzuschwingen, anstatt
    die Muskeln zu nutzen, was die Belastung auf Gelenke erhöht.'
  - 'Schultern hochziehen: Die Schultern werden zu den Ohren gezogen, anstatt sie stabil unten
    zu halten, was zu Schulterproblemen führen kann.'
  - 'Rundrücken oder Hohlkreuz: Eine instabile Rumpfhaltung, die die Effektivität und Sicherheit
    beeinträchtigt.'
