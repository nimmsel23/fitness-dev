  coaching_notes:
  - Stellen Sie sich aufrecht hin, die Füße schulterbreit auseinander, und halten
    Sie in jeder Hand eine Kurzhantel. Die Handflächen zeigen zum Körper, die Kurzhanteln
    liegen seitlich am Oberschenkel.
  - Behalten Sie während der gesamten Übung eine leichte Beugung in den Ellbogengelenken
    bei, um die Spannung auf den Schultern zu halten und die Gelenke zu schonen.
  - 'Beginnen Sie mit dem Seitheben: Heben Sie die Kurzhanteln seitlich vom Körper
    weg an. Die Bewegung sollte aus den Schultern kommen, nicht aus Schwung. Führen
    Sie die Hanteln bis auf Schulterhöhe. Die Handflächen zeigen dabei nach unten.'
  - Senken Sie die Kurzhanteln kontrolliert wieder seitlich am Körper ab. Die Handflächen
    drehen sich dabei wieder zum Körper.
  - 'Führen Sie unmittelbar danach das Frontheben aus: Heben Sie die Kurzhanteln vor
    dem Körper an, bis sie sich auf Schulterhöhe befinden. Die Handflächen zeigen
    dabei weiterhin nach unten.'
  - Senken Sie die Kurzhanteln kontrolliert wieder vor dem Körper ab, bis sie die
    Ausgangsposition erreichen. Dies ist eine Wiederholung.
  - Achten Sie darauf, die Rumpfmuskulatur während der gesamten Bewegung stabil zu
    halten, um ein Schwingen des Oberkörpers zu vermeiden.
  common_errors:
  - 'Schwungholen: Vermeiden Sie ein ruckartiges Anheben der Gewichte durch Einsatz
    von Bein- oder Rückenschwung. Die Bewegung soll aus den Schultern kommen.'
  - 'Zu hohe oder zu schnelle Ausführung: Die Hanteln sollten nicht über Schulterhöhe
    angehoben werden, weder seitlich noch frontal. Eine zu schnelle Ausführung verringert
    die Muskelspannung.'
  - 'Gerade oder durchgestreckte Arme: Eine leichte Beugung im Ellbogen schützt die
    Gelenke und sorgt für eine bessere Muskelkontraktion im Deltoid. Vollständig durchgestreckte
    Arme können die Ellbogengelenke unnötig belasten.'
  - 'Rundrücken oder Hohlkreuz: Achten Sie auf eine neutrale Wirbelsäulenposition.
    Ein Rundrücken kann die Schultermechanik beeinträchtigen, ein Hohlkreuz den unteren
    Rücken belasten.'
  - 'Schultern hochziehen (Shrugs): Vermeiden Sie es, die Schultern zu den Ohren zu
    ziehen. Die primäre Bewegung ist die Abduktion/Flexion der Schulter, nicht die
    Elevation des Schultergürtels.'
  - 'Mangelnde Kontrolle in der Abwärtsbewegung: Lassen Sie die Gewichte nicht einfach
    fallen. Eine langsame, kontrollierte Abwärtsbewegung ist entscheidend für den
    Muskelaufbau und die Gelenkgesundheit.'
