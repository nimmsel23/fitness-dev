  instructions:
  - In a standing position, hold a pair of dumbbells at your side. This will be your
    starting position.
  - Keeping your elbows slightly bent, raise the weights directly in front of you
    to shoulder height, avoiding any swinging or cheating.
  - At the top of the exercise move the weights out in front of you, keeping your
    arms extended.
  - Lower the weights with a controlled motion.
  - On the next repetition, raise the weights in front of you to shoulder height before
    moving the weights laterally to your sides.
  - Lower the weights to the starting position.
  coaching_notes:
  - Starte aufrecht stehend, Füße schulterbreit, Knie leicht gebeugt, Kurzhanteln
    seitlich am Körper, Handflächen zum Körper gerichtet.
  - Halte die Arme während der gesamten Übung nahezu gestreckt, mit einer leichten
    Beugung im Ellenbogen, um das Gelenk zu schonen.
  - '**Seitheben-Phase:** Hebe die Kurzhanteln seitlich vom Körper weg, bis die Arme
    parallel zum Boden sind (Schulterhöhe). Führe die Bewegung kontrolliert aus den
    Schultern, nicht durch Schwung. Die Handflächen zeigen dabei nach unten.'
  - Senke die Kurzhanteln ebenso kontrolliert seitlich wieder in die Ausgangsposition
    ab.
  - '**Frontheben-Phase:** Direkt im Anschluss hebe die Kurzhanteln vor dem Körper
    bis auf Schulterhöhe an. Die Handflächen zeigen dabei ebenfalls nach unten.'
  - Senke die Kurzhanteln kontrolliert vor dem Körper wieder in die Ausgangsposition
    ab.
  - Diese Abfolge (Seitheben hoch/runter, Frontheben hoch/runter) zählt als eine Wiederholung,
    wie in der Originalbeschreibung angegeben.
  - Konzentriere dich auf die Isolation der Schultermuskulatur und vermeide es, den
    Rücken zu krümmen oder zu stark ins Hohlkreuz zu gehen.
  common_errors:
  - '**Schwungholen:** Einsatz des Rückens oder der Beine, um die Gewichte zu heben.
    Dies reduziert die Effektivität für die Schultermuskulatur und erhöht das Verletzungsrisiko.'
  - '**Zu schwere Gewichte:** Die Wahl von Gewichten, die keine saubere und kontrollierte
    Ausführung ermöglichen. Die Qualität der Bewegung ist wichtiger als das Gewicht.'
  - '**Hochziehen mit dem Trapez:** Statt die Bewegung primär aus der Schulter zu
    initiieren, wird der Nacken (Trapezius) übermäßig beansprucht, was zu Verspannungen
    führen kann.'
  - '**Unkontrollierte Absenkung:** Die Gewichte fallen lassen, anstatt sie kontrolliert
    und langsam abzusenken. Dadurch wird der wichtige negative Teil der Bewegung (exzentrische
    Phase) nicht effektiv genutzt.'
  - '**Durchgestreckte oder zu stark gebeugte Ellenbogen:** Völlig durchgestreckte
    Ellenbogen können die Gelenke belasten; zu stark gebeugte Ellenbogen verkürzen
    den Hebelarm und reduzieren die Belastung der Zielmuskulatur. Eine leichte Beugung
    beibehalten.'
  - '**Rundrücken oder Hohlkreuz:** Eine falsche Körperhaltung, die den unteren Rücken
    belastet und die Rumpfstabilität reduziert. Achte auf eine aktivierte Rumpfmuskulatur
    und eine neutrale Wirbelsäulenposition.'
  original_description:
  - 'Stehe aufrecht und halte die Kurzhanteln seitlich am Körper

    Halte die Arme nahezu vollständig gestreckt

    Hebe die Kurzhanteln ohne Schwung seitlich bis auf Schulterhöhe an, Handflächen
    nach unten

    Senke die Kurzhanteln seitlich am Körper ab, Handflächen nach innen

    Hebe die Kurzhanteln sofort vor dem Körper bis auf Schulterhöhe an, Handflächen
    nach unten

    Wieder absenken

    Das ist eine Wiederholung'
