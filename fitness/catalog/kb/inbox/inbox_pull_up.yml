  coaching_notes:
  - Führen Sie die Bewegung über den vollen Bewegungsumfang aus, bis Ihr Kinn über die Stange
    reicht und die Arme unten fast vollständig gestreckt sind.
  - Konzentrieren Sie sich darauf, die Schulterblätter nach unten und hinten zu ziehen (Skapuladepression
    und -retraktion), um den Latissimus optimal zu aktivieren.
  - Halten Sie den Rumpf während der gesamten Bewegung stabil und vermeiden Sie Schwung.
  - Variationen des Griffes (eng, weit, Obergriff, Untergriff) können unterschiedliche Muskelgruppen
    und deren Betonung beeinflussen.
  common_errors:
  - Unvollständiger Bewegungsumfang (z.B. Kinn erreicht nicht die Stange oder Arme werden
    nicht vollständig gestreckt).
  - Verwendung von Schwung ('Kipping'), um die Bewegung zu erleichtern, statt aus reiner Muskelkraft
    zu arbeiten.
  - Die Schultern werden nach oben gezogen (Shrugging) oder rollen nach vorne, anstatt die
    Schulterblätter nach unten zu ziehen.
  - Verlust der Rumpfspannung, was zu einem unkontrollierten Schwingen des Körpers führt.
