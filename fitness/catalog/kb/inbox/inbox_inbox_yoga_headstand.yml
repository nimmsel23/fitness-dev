  coaching_notes:
  - Beginne immer mit einem gründlichen Aufwärmen, besonders für Nacken, Schultern
    und Handgelenke.
  - 'Schaffe eine stabile Basis: Lege den Scheitelpunkt des Kopfes auf den Boden und
    platziere die Hände schulterbreit mit gespreizten Fingern so, dass sie ein gleichseitiges
    Dreieck mit dem Kopf bilden (Tripod-Kopfstand). Die Unterarme tragen den Großteil
    des Gewichts, nicht der Nacken.'
  - Aktiviere den Rumpf stark, indem du den Bauchnabel zur Wirbelsäule ziehst, um
    den Körper zu stabilisieren und eine gerade Linie zu halten.
  - Halte die Beine aktiv und gestreckt, die Zehen zeigen zur Decke. Stell dir vor,
    du drückst durch die Fersen nach oben.
  - Steige kontrolliert in den Kopfstand ein und aus, idealerweise zuerst mit Unterstützung
    einer Wand.
  - Halte den Blick fest auf einen Punkt am Boden, um das Gleichgewicht zu verbessern.
  - Atme ruhig und gleichmäßig durch die Nase, um Stabilität und Konzentration zu
    fördern.
  common_errors:
  - Zu viel Gewicht auf dem Kopf oder Nacken ablegen, was zu Verletzungen führen kann.
    Das Gewicht sollte hauptsächlich auf den Unterarmen und Händen liegen.
  - Einen runden Rücken bilden (Bananenhaltung) anstatt einer geraden Linie vom Nacken
    bis zu den Fersen. Dies deutet auf mangelnde Rumpfspannung hin.
  - Die Beine unkontrolliert hochschwingen, anstatt sie langsam und kraftvoll anzuheben.
    Dies führt oft zu einem Ungleichgewicht und einem Sturz.
  - Die Hände zu eng oder zu weit auseinander platzieren, was die Dreiecksbasis destabilisiert
    und die Schultern überlastet.
  - Den Atem anhalten. Dies erhöht den Druck im Körper und beeinträchtigt die Stabilität.
  - Nicht genügend Körperspannung im gesamten Körper, wodurch die Haltung wackelig
    wird.
