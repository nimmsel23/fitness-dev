  coaching_notes:
  - Beginnen Sie jedes HIIT-Training mit einem gründlichen Aufwärmen (5-10 Minuten),
    das dynamische Dehnungen und leichte Cardio-Übungen umfasst, um den Körper auf
    die hohe Intensität vorzubereiten und Verletzungen vorzubeugen.
  - 'Für Sprints: Halten Sie den Oberkörper aufrecht, leicht nach vorne geneigt, mit
    entspannten Schultern und Blick nach vorne.'
  - 'Der Armeinsatz ist entscheidend: Die Arme schwingen synchron und kräftig mit
    den Beinen, im 90-Grad-Winkel gebeugt. Der Schwung kommt aus den Schultern, nicht
    nur aus den Ellbogen.'
  - Achten Sie auf einen hohen Kniehub, um einen kraftvollen und effizienten Schritt
    zu ermöglichen.
  - Landen Sie beim Sprinten auf dem Mittelfuß, direkt unter dem Körperschwerpunkt,
    um die Aufprallenergie effizient zu nutzen und eine schnelle Wiederholung zu gewährleisten.
    Vermeiden Sie das Aufsetzen der Ferse zuerst.
  - Während der Belastungsphase (z.B. 20 Sekunden) geben Sie maximale oder submaximale
    Leistung (85-100% Ihrer maximalen Anstrengung).
  - In der Erholungsphase (z.B. 30 Sekunden) reduzieren Sie die Intensität auf ein
    leichtes Gehen oder langsames Joggen, um sich aktiv zu erholen und den Puls zu
    senken.
  - 'Achten Sie auf eine tiefe, rhythmische Atmung: Atmen Sie während der Anstrengung
    kräftig aus und während der Erholung tief ein.'
  - Beenden Sie das Training mit einem 5-10-minütigen Cool-down, bestehend aus leichtem
    Gehen und statischen Dehnungen, um die Herzfrequenz zu senken und die Flexibilität
    zu fördern.
  common_errors:
  - Mangelndes Aufwärmen oder Abwärmen erhöht das Verletzungsrisiko und beeinträchtigt
    die Erholung erheblich.
  - Eine schlechte Körperhaltung, wie ein gekrümmter Rücken oder übermäßiges Zurücklehnen,
    kann die Effizienz des Sprints reduzieren und zu unnötigen Belastungen auf Gelenke
    und Wirbelsäule führen.
  - Ein inaktiver oder fehlender Armeinsatz nimmt dem Sprint wichtige Antriebskraft
    und Balance. Die Arme sollten aktiv zur Beschleunigung beitragen.
  - Der Fersenaufsatz beim Sprinten bremst Sie abrupt ab, erhöht den Aufprallschock
    auf Knie und Schienbein und kann zu Überlastungsschäden führen.
  - Eine nicht angepasste Intensität während der Belastungs- oder Erholungsphase mindert
    die Effektivität des Intervalltrainings. Zu hohe Intensität in der Erholung verhindert
    die notwendige Erholung für die nächste Belastungsphase.
  - Das Anhalten des Atems oder eine flache Atmung kann zu einer schnelleren Ermüdung
    führen, die Leistungsfähigkeit beeinträchtigen und Schwindel verursachen.
