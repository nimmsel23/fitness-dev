  coaching_notes:
  - Ellbogen nah am Körper halten, nicht abspreizen — der enge Griff betont diese Bewegungslinie
  - Brust gegen die Lehne drücken und stabiler Position halten, nicht mit Rücken nach hinten
    lehnen
  - Volle Scapular-Retraktion am Ende erreichen — Schulterblätter zusammenziehn, nicht nur
    Arme beugen
  - Enger Griff verschiebt Fokus von Lats auf Rhomboide und mittleren Trapezius
  - Langsam und kontrolliert zur Ausgangsposition zurück, Spannung halten
  common_errors:
  - Mit dem Rücken nach hinten lehnen statt kontrolliert sitzend zu bleiben
  - Ellbogen zu weit abspreizen — verstößt gegen die Griff-Definition
  - Schultern hochziehen statt Scapula aktiv zu retrahieren
  - Zu viel Gewicht → nur kurze, unkontrollierte Bewegungsausschläge
  - Nicht die volle Range of Motion ausnutzen
