  coaching_notes:
  - 'Die Kraft kommt aus den Beinen: Explosives Triple-Extension (Fußgelenke, Knie, Hüfte)
    ist der Ursprung der Bewegung'
  - Den Rücken neutral halten von der Ausgangsposition bis zur Abzugsposition – leichte Lordose,
    keine Kyphose
  - Aktiv unter die Stange fahren und in einer stabilen Überkopfposition fangen, nicht passiv
    fallen
  - Die Fersen dürfen beim Abzug und Fangen leicht abheben – das ist biomechanisch korrekt
    für maximale Explosivität
  - Maximale Hüft- und Kniebeugung beim Fangen reduziert Verletzungsrisiko und ermöglicht
    schwerere Lasten zu bewältigen
  common_errors:
  - 'Zu frühe Kniebeugung: Die Knie sollten erst nach vollständiger Triple-Extension initiieren'
  - Rücken krümmt sich in der Ausgangsposition – reduziert Kraftübertragung und erhöht Verletzungsrisiko
  - Zu langsames aktives Fahren unter die Stange – verliert Timing und Kraft durch schlechte
    Koordination
  - Passive Hände beim Fangen statt aktiv zu greifen – führt zu schlechter Stabilisierung
    und Kontrollverlust
