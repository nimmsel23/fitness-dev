  coaching_notes:
  - 'Volle Bewegungsamplitude nutzen: von maximaler Kniebeugung bis zur vollständigen Streckung'
  - Oben 1-2 Sekunden statisch halten und den Quadriceps maximal kontrahieren
  - Langsam und kontrolliert arbeiten, besonders in der exzentrischen (abwärts) Phase
  - Knie nicht überextendieren oder nach außen drehen – gerade Bewegungslinie
  - Fester Sitz mit Rücken gegen die Rückenlehne; Hüfte stabil halten
  - Beidseitig gleichmäßig belasten, um muskuläre Asymmetrien zu vermeiden
  common_errors:
  - Zu schnelle, unkontrollierte Bewegungen mit Schwung
  - Knie nach oben reißen statt kontrollierten Bewegungsfluss
  - Ferse von der Maschine abheben oder Knie seitlich abspreizen
  - Zu wenig Bewegungsumfang – nicht bis zur vollständigen Streckung
  - Zu schwer trainieren und Technik kompromittieren
