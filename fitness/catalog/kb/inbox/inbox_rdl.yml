  coaching_notes:
  - Halten Sie den Rücken gerade mit neutraler Wirbelsäule während der gesamten Bewegung
  - Dies ist ein Hüft-Scharnier-Bewegungsmuster — die Bewegung erfolgt primär in der Hüfte,
    nicht im Knie
  - Leichte Kniebeugen (15–20°) sind normal und unterstützen die Technik
  - Kontrollierte exzentrische Phase beim Absenken für maximale Hamstring- und untere Rücken-Aktivierung
  - Das Gewicht darf nicht zu schwer sein — RDL benötigt weniger Last als konventionelles
    Kreuzheben
  - Deutliche Dehnung der Hamstrings in der untersten Position anstreben
  - Hüften nach vorne treiben um zur Ausgangsposition zurückzukehren
  - Ausgezeichnete Übung für Hüftmobilität und Gesundheit der hinteren Muskelkette
  common_errors:
  - Unterer Rücken-Rundung statt stabiler Wirbelsäule
  - Zu viel Kniebeugen — verwandelt RDL in konventionelles Kreuzheben
  - Zu hohes Gewicht, das die Form beeinträchtigt
  - Zu geringer Bewegungsumfang — Hamstring-Dehnung nicht ausgenutzt
  - Schultern nach vorne gezogen statt Brust oben halten
