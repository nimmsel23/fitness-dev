  - 304_rotator_cuff
  - 501_rectus_abdominis
  - 502_obliquus_externus
  coaching_notes:
  - Nehmen Sie eine stabile Sitzposition ein und fixieren Sie Ihre Knie unter den
    Polstern.
  - Lehnen Sie den Oberkörper leicht zurück (ca. 10-15 Grad), um den Lats einen optimalen
    Bewegungsspielraum zu ermöglichen.
  - Fassen Sie die enge, supinierte Stange (Untergriff) schulterbreit oder etwas enger.
    Achten Sie auf einen festen Griff, bei dem die Daumen die Stange vollständig umschließen.
  - Leiten Sie die Bewegung ein, indem Sie die Schulterblätter aktiv nach unten ziehen
    (Depression) und zusammenführen (Retraktion).
  - Ziehen Sie die Stange zur oberen Brust oder zum Brustbein, während Sie die Ellbogen
    eng am Körper halten und nach unten und leicht nach hinten führen.
  - Konzentrieren Sie sich darauf, die Bewegung primär aus den Rückenmuskeln zu initiieren,
    nicht nur aus den Armen.
  - Halten Sie die maximale Kontraktion am tiefsten Punkt kurz, um die Lats vollständig
    zu aktivieren.
  - Lassen Sie die Stange kontrolliert und langsam nach oben steigen, bis die Arme
    fast vollständig gestreckt sind und Sie eine gute Dehnung in den Lats spüren.
  - Vermeiden Sie ein vollständiges Aushängen der Schultern am oberen Punkt, um die
    Spannung in den Muskeln zu halten und die Gelenke zu schonen.
  - Atmen Sie während der Ziehbewegung (konzentrisch) aus und beim Ablassen der Stange
    (exzentrisch) ein.
  common_errors:
  - '**Schwungholen:** Den Oberkörper zu stark nach hinten lehnen und mit Schwung
    arbeiten, anstatt die Muskeln isoliert zu nutzen.'
  - '**Rundrücken:** Die Wirbelsäule krümmen, insbesondere im unteren Rückenbereich,
    was die Belastung erhöhen kann.'
  - '**Schulterhochziehen (Shrugging):** Die Schultern in Richtung Ohren ziehen, anstatt
    sie aktiv nach unten zu drücken und zu stabilisieren.'
  - '**Nur Armeinsatz:** Die Bewegung primär mit dem Bizeps ausführen, ohne die Lats
    ausreichend zu aktivieren.'
  - '**Unkontrollierte Exzentrik:** Die Stange unkontrolliert nach oben schnellen
    lassen, was das Verletzungsrisiko erhöht und den Trainingseffekt mindert.'
  - '**Zu viel Gewicht:** Dies führt oft zu einer schlechten Form und verminderter
    Muskelaktivierung, da Hilfsmuskeln oder Schwung eingesetzt werden.'
