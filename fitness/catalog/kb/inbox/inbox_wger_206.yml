  coaching_notes:
  - '**Ausgangsposition:** Stelle dich aufrecht und schulterbreit hin, der Blick ist
    nach vorne gerichtet. Halte in jeder Hand eine Kurzhantel seitlich am Körper,
    die Handflächen zeigen zum Körper. Dein Rumpf ist angespannt, die Schultern leicht
    zurückgezogen und der Rücken gerade.'
  - '**Der Schritt:** Mache mit einem Bein einen langen, kontrollierten Schritt nach
    vorne. Achte darauf, dass deine Füße weiterhin etwa hüftbreit bleiben, um eine
    stabile Basis zu gewährleisten. Setze den vorderen Fuß sanft mit der Ferse zuerst
    auf, rolle dann zum Mittelfuß ab.'
  - '**Die Abwärtsbewegung:** Senke deine Hüfte kontrolliert, bis das Knie des hinteren
    Beins fast den Boden berührt. Beide Knie sollten dabei einen Winkel von etwa 90
    Grad bilden. Das vordere Knie bleibt direkt über dem Fußgelenk und sollte nicht
    über die Zehenspitzen hinausragen. Das Schienbein des vorderen Beins ist möglichst
    senkrecht. Halte den Oberkörper während der gesamten Bewegung aufrecht und stabil,
    ohne nach vorne oder hinten zu lehnen.'
  - '**Der Übergang (Aufwärts- und Vorwärtsbewegung):** Drücke dich kraftvoll über
    die Ferse des vorderen Fußes nach oben und nach vorne. Führe dabei das hintere
    Bein direkt in den nächsten Ausfallschritt nach vorne. Dies schafft eine flüssige,
    durchgehende Gehbewegung. Halte die Rumpfspannung während der gesamten Bewegung
    aufrecht, um Stabilität zu gewährleisten.'
  - '**Atmung:** Atme während der Abwärtsbewegung kontrolliert ein und kräftig aus,
    wenn du dich über die Ferse nach oben und vorne drückst.'
  - '**Fokus:** Konzentriere dich auf eine langsame, kontrollierte Bewegung und die
    bewusste Aktivierung der Gesäß- und Oberschenkelmuskulatur. Vermeide Schwung.'
  common_errors:
  - '**Vorderes Knie schiebt über die Zehenspitzen:** Dies übt unnötigen Druck auf
    das Kniegelenk aus. Achte darauf, das Schienbein des vorderen Beins vertikal zu
    halten und das Knie über dem Fußgelenk zu lassen. Das Erreichen dieser Position
    erfordert oft einen längeren Schritt.'
  - '**Einknicken des Knies (Knievalgus):** Das vordere Knie knickt nach innen (Richtung
    Mittellinie) ein. Dies deutet auf eine Schwäche der Hüftabduktoren (Gluteus medius/minimus)
    hin und erhöht das Verletzungsrisiko. Achte darauf, das Knie aktiv nach außen
    zu drücken, um es in einer Linie mit den Zehen zu halten.'
  - '**Rumpf neigt sich zu stark nach vorne oder hinten:** Ein nach vorne geneigter
    Oberkörper nimmt die Spannung von den Gesäßmuskeln und verlagert sie auf den unteren
    Rücken. Ein zu stark nach hinten gelehnter Rumpf destabilisiert die Bewegung.
    Halte den Oberkörper während der gesamten Bewegung aufrecht und stabil, indem
    du den Rumpf fest anspannst.'
  - '**Unzureichende Tiefe:** Wenn der Ausfallschritt nicht tief genug ausgeführt
    wird (hinteres Knie weit vom Boden entfernt), wird das volle Bewegungsausmaß und
    die optimale Muskelaktivierung nicht erreicht. Senke dich so weit ab, dass das
    hintere Knie fast den Boden berührt und beide Knie einen 90-Grad-Winkel bilden.'
  - '**Verlust des Gleichgewichts:** Wackelige Bewegung oder vollständiger Verlust
    des Gleichgewichts. Konzentriere dich auf einen festen Blickpunkt vor dir und
    spanne den Rumpf fest an, um die Stabilität zu verbessern. Kleinere Schritte zu
    Beginn können helfen, das Gleichgewicht zu finden.'
  - '**Abdrücken von den Zehen des vorderen Fußes:** Anstatt sich primär über die
    Ferse abzudrücken, wird der vordere Fuß zu sehr über die Zehen belastet. Dies
    beansprucht die Quadrizeps übermäßig und aktiviert die Gesäßmuskulatur weniger.
    Drücke primär durch die Ferse des vorderen Fußes, um die Gesäßmuskeln optimal
    zu nutzen.'
  - '**Zu schnelle Ausführung/Schwung:** Die Bewegung wird zu schnell und unkontrolliert
    mit Schwung ausgeführt. Dies reduziert die effektive Muskelspannung und den Trainingseffekt.
    Führe die Ausfallschritte bewusst und kontrolliert aus, um die Muskulatur maximal
    zu fordern.'
