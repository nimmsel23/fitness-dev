  coaching_notes:
  - Achte darauf, dass deine Schulterblätter während der gesamten Bewegung zurückgezogen
    und unten gehalten werden, um die Brust optimal zu aktivieren und die Schultern
    zu schützen.
  - Wähle einen Bankwinkel, der die obere Brust anspricht, meist zwischen 30-45 Grad.
    Ein zu steiler Winkel kann die vorderen Schultern zu stark belasten.
  - Senke die Kurzhanteln kontrolliert bis auf Brusthöhe ab und drücke sie dann kraftvoll
    nach oben, ohne die Ellenbogen am oberen Punkt ganz durchzustrecken.
  - Halte deine Füße fest auf dem Boden, um eine stabile Basis zu gewährleisten und
    die Kraftübertragung zu optimieren.
  common_errors:
  - Zu steiler Bankwinkel, wodurch die vorderen Schultern die Hauptarbeit übernehmen.
  - Schulterblätter nicht fixiert, was zu einer instabilen Schulterposition und potenziellen
    Verletzungen führen kann.
  - Ellbogen zu weit nach außen spreizen, was die Schultergelenke unnötig belastet.
    Halte die Ellenbogen leicht angewinkelt, etwa 45-60 Grad zum Körper.
  - Verwendung von zu viel Gewicht, was zu unkontrollierter Bewegung und Kompromittierung
    der Form führt.
