  coaching_notes:
  - Halten Sie den Oberkörper aufrecht und die Brust angehoben, um die neutrale Wirbelsäulenposition
    zu bewahren.
  - Die Ellbogen sollten während der gesamten Bewegung hoch und nach vorne zeigen, um die
    Langhantel stabil auf den Schultern zu halten.
  - Streben Sie eine volle Kniebeuge an, bei der die Hüften unterhalb der Knie sinken, solange
    Sie eine gute Form beibehalten können.
  - Die Knie sollten über den Zehen ausgerichtet bleiben und nicht nach innen fallen (Valgusstellung).
  - Atmen Sie tief ein, bevor Sie in die Hocke gehen, und spannen Sie Ihre Bauchmuskeln an,
    um die Rumpfstabilität zu erhöhen.
  common_errors:
  - Das Fallenlassen der Ellbogen, was dazu führt, dass das Gewicht nach vorne verlagert wird
    und der Oberkörper nach vorne kippt.
  - Ein runder Rücken (Kyphose) im unteren Bereich der Kniebeuge, was die Wirbelsäule belastet.
  - Das Anheben der Fersen vom Boden, was die Stabilität verringert und die Belastung auf
    die Knie erhöht.
  - Ein zu frühes Anheben der Hüften aus dem unteren Punkt der Kniebeuge, wodurch die Bewegung
    zu einem 'Good Morning' wird.
