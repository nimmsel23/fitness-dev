  coaching_notes:
  - Der Liegestütz mit Klatschen ist eine fortgeschrittene, plyometrische Oberkörperübung,
    die darauf abzielt, Schnellkraft in Brust, Schultern und Trizeps zu entwickeln.
  - 'Beginne in einer stabilen Plank-Position: Hände etwas weiter als schulterbreit,
    direkt unter den Schultern platziert. Der Körper bildet eine gerade Linie von
    Kopf bis Fersen, Rumpf und Gesäß sind fest angespannt, der Nacken ist neutral.'
  - Senke deinen Körper kontrolliert und mit Spannung ab, bis die Brust knapp über
    dem Boden schwebt. Die Ellbogen sollten dabei in einem Winkel von etwa 45-60 Grad
    zum Körper zeigen, nicht direkt zur Seite.
  - Drücke dich aus dieser tiefen Position explosiv und kraftvoll vom Boden ab. Ziel
    ist es, genügend Schwung zu erzeugen, damit beide Hände den Boden vollständig
    verlassen.
  - Während du dich in der Luft befindest, klatsche schnell einmal in die Hände vor
    der Brust.
  - Lande federnd mit leicht gebeugten Ellbogen, um den Aufprall abzudämpfen und die
    Gelenke zu schonen. Gehe direkt und fließend in die nächste Wiederholung über,
    um den plyometrischen Zyklus aufrechtzuerhalten.
  common_errors:
  - 'Mangelnde Rumpfspannung: Ein Durchhängen des unteren Rückens oder ein Anheben
    des Gesäßes während der Bewegung deutet auf eine Schwäche des Rumpfes hin. Dies
    reduziert die Effektivität der Übung und erhöht das Verletzungsrisiko. Halte den
    Rumpf während der gesamten Bewegung fest angespannt, um eine stabile, neutrale
    Wirbelsäulenposition zu gewährleisten.'
  - 'Unkontrollierte Landung: Ein hartes Aufkommen auf den Handgelenken oder Schultern
    kann zu unnötigem Stress auf die Gelenke führen. Lande bewusst mit leicht gebeugten
    Ellbogen, um den Stoß abzufedern und die Energie für die nächste Wiederholung
    zu nutzen.'
  - 'Unzureichende Explosion: Wenn die Hände den Boden nicht verlassen oder der Klatsch
    nicht ausgeführt werden kann, fehlt es an explosiver Kraft. Konzentriere dich
    darauf, dich mit maximaler Absicht und Geschwindigkeit abzustoßen.'
  - 'Verkürzte Bewegung: Den Körper nicht tief genug abzusenken oder den explosiven
    Teil der Bewegung zu verkürzen, verringert den Trainingsreiz. Achte auf den vollen
    Bewegungsumfang, sowohl in der Abwärts- als auch in der Aufwärtsphase.'
  - 'Falsche Ellbogenposition: Ellbogen, die zu weit seitlich nach außen zeigen (90-Grad-Winkel),
    belasten die Schultergelenke übermäßig. Halte die Ellbogen näher am Körper, um
    die Brustmuskulatur effektiver zu aktivieren und die Schultern zu schützen.'
