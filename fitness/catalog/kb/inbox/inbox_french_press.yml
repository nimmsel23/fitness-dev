  coaching_notes:
  - Oberarme von Beginn bis Ende ruhig halten und die Bewegung fast ausschließlich
    aus dem Ellbogengelenk ausführen.
  - Ellbogen etwa schulterbreit bis leicht enger ausrichten und während des Satzes
    kontrolliert in dieser Linie halten.
  - Das Gewicht langsam hinter oder neben die Stirn absenken, sodass die Trizepsmuskulatur
    unter Spannung bleibt und kein Fallenlassen entsteht.
  - Am tiefsten Punkt eine kontrollierte Dehnung zulassen, ohne die Schulter nach
    vorn kippen oder die Oberarme nach hinten wegdriften zu lassen.
  - In der Streckphase aktiv bis kurz vor die volle Ellbogenstreckung arbeiten, ohne
    die Gelenke hart einzurasten.
  - Handgelenke neutral halten und die Hantel oder Stange fest, aber nicht verkrampft
    führen.
  - Brustkorb stabil halten, Nacken lang lassen und den Kopf ruhig auf der Bank positionieren.
  - Ein moderates Gewicht wählen, das eine saubere exzentrische Phase und eine präzise
    Ellbogenführung über alle Wiederholungen erlaubt.
  common_errors:
  - Die Oberarme wandern während der Wiederholungen nach hinten oder nach vorn, sodass
    die Übung mehr zur Schulterbewegung wird.
  - Die Ellbogen spreizen stark nach außen, was Spannung vom Trizeps nimmt und die
    Gelenkbelastung erhöht.
  - Das Gewicht wird zu schnell abgesenkt und unten nicht kontrolliert, wodurch die
    exzentrische Arbeit verloren geht.
  - Die Handgelenke knicken ab statt neutral zu bleiben, was die Kraftübertragung
    verschlechtert.
  - Mit Schwung aus Schulter oder Rumpf arbeiten, um den schwierigsten Bereich zu
    überbrücken.
  - Zu weit Richtung Gesicht oder Stirn führen, obwohl die gewählte Variante eine
    sichere, reproduzierbare Hantelbahn neben oder leicht hinter den Kopf braucht.
  - Oben aggressiv in die Ellbogen einrasten statt die Endposition muskulär zu kontrollieren.
  - Zu schwer trainieren und dadurch Bewegungsradius, Ellbogenkontrolle und konstante
    Spannung deutlich verlieren.
