      coaching_notes:
      - 'Lie on a flat bench and grasp the straight bar attachment of a low pulley
        with a narrow overhand grip. Tip: The easiest way to do this is to have someone
        hand you the bar as you lay down.'
      - With your arms extended, position the bar over your torso. Your arms and your
        torso should create a 90-degree angle. This will be your starting position.
      - Lower the bar by bending at the elbow while keeping the upper arms stationary
        and elbows in. Go down until the bar lightly touches your forehead. Breathe
        in as you perform this portion of the movement.
      - Flex the triceps as you lift the bar back to its starting position. Exhale
        as you perform this portion of the movement.
      - Hold for a second at the contracted position and repeat for the recommended
        amount of repetitions.
