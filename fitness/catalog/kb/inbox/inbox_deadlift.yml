  coaching_notes:
  - Stellen Sie sich mit schulterbreitem Stand hin, die Langhantel über dem Mittelfuß
    positioniert.
  - Beugen Sie sich an der Hüfte und den Knien, um die Hantel mit einem Oberhand-
    oder Wechselgriff etwas breiter als schulterbreit zu greifen.
  - Halten Sie den Rücken gerade (neutrale Wirbelsäule), die Brust raus und die Schultern
    zurückgezogen.
  - Heben Sie die Hantel, indem Sie die Hüfte und Knie gleichzeitig strecken. Halten
    Sie die Hantel eng am Körper.
  - Am oberen Punkt nicht überstrecken, sondern die Hüfte vollständig durchstrecken
    und die Schultern leicht zurückziehen.
  - Senken Sie die Hantel kontrolliert ab, indem Sie zuerst die Hüfte beugen und dann
    die Knie.
  - Halten Sie die Spannung in den Rumpfmuskeln während der gesamten Bewegung.
  common_errors:
  - Rundrücken (insbesondere im unteren Rückenbereich), was zu Verletzungen führen
    kann.
  - Kniebeugen statt eines Hüftscharniers, wodurch die vordere Oberschenkelmuskulatur
    übermäßig beansprucht wird.
  - Die Hantel zu weit vom Körper entfernt halten, was den Hebelarm verlängert und
    den Rücken zusätzlich belastet.
  - Überstreckung des Rückens am oberen Punkt der Bewegung.
