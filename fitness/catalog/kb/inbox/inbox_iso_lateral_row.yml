  coaching_notes:
  - Schulterblatt-Retraktion initieren, nicht mit den Armen reißen - Rücken-Fokus
    bewahren
  - Am Ende der Bewegung 1-2 Sekunden isometrisch halten für maximale Kontraktion
  - Horizontale Zugbahn nutzen - Brust leicht nach vorne, oberen Rücken involvieren
  - Unilateral trainieren fördert Muskelbalance und stabilisiert die Wirbelsäule
  - Tempo kontrollieren - keine ballistischen Bewegungen, kontinuierliche Spannung
  common_errors:
  - Mit den Armen statt dem Rücken reißen - fehlende Schulterblatt-Aktivation
  - Unvollständige Scapula-Retraktion - zu kurze Bewegungsamplitude
  - Zu hohes Gewicht wählen - Bewegungskontrolle und Form leiden
  - Asymmetrisches Trainieren zwischen beiden Seiten - Kraft-Imbalancen entstehen
