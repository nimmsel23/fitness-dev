name: inbox_lateral_raise
description: 'Proactively generated expert draft for: Seithebemaschine'
exercises:
- exercise_id: lateral_raise_machine
  id: lateral_raise_machine
  name: Seithebemaschine
  display_name: Seithebemaschine
  german: Maschinelles Seitheben
  english: Machine Lateral Raise
  category: shoulders
  type: isolation
  movement_pattern: shoulder_abduction
  equipment:
  - machine
  primary_muscles:
  - shoulders
  secondary_muscles: []
  stabilizers:
  - abs
  coaching_notes:
  - Stellen Sie sich oder setzen Sie sich korrekt in die Maschine, sodass die Polster auf
    Höhe Ihrer Ellbogen oder Unterarme liegen.
  - Halten Sie Ihren Rumpf stabil und den Rücken gerade, idealerweise mit leichtem Kontakt
    zur Rückenlehne.
  - Heben Sie die Arme kontrolliert seitlich nach oben, indem Sie die Kraft aus den Schultern
    (seitlicher Deltamuskel) holen.
  - Stellen Sie sich vor, Sie schütten Wasser aus zwei Kannen seitlich aus – Ihre Ellbogen
    sollten dabei leicht gebeugt und die Hände tiefer als die Ellbogen sein.
  - Führen Sie die Bewegung nur bis etwa Schulterhöhe aus, um unnötige Belastung der Nackenmuskulatur
    zu vermeiden.
  - Lassen Sie das Gewicht langsam und kontrolliert in die Ausgangsposition zurückkehren,
    widerstehen Sie dem Zug des Gewichts.
  common_errors:
  - 'Schwung holen: Vermeiden Sie es, mit dem Oberkörper Schwung zu holen, um das Gewicht
    nach oben zu bewegen. Die Bewegung sollte ausschließlich aus den Schultern kommen.'
  - 'Schultern hochziehen (Shrugs): Achten Sie darauf, dass Ihre Schultern während der gesamten
    Übung unten bleiben und nicht in Richtung Ohren gezogen werden. Dies würde den oberen
    Trapezius überbeanspruchen.'
  - 'Zu viel Gewicht: Wenn das Gewicht zu schwer ist, leidet die Form, und Sie riskieren,
    andere Muskeln einzusetzen oder die Gelenke zu überlasten. Wählen Sie ein Gewicht, das
    Ihnen eine saubere Ausführung erlaubt.'
  - 'Ellbogen durchstrecken: Halten Sie Ihre Ellbogen während der gesamten Bewegung leicht
    gebeugt, um die Gelenke zu schonen und die Spannung auf den Deltamuskel zu halten.'
  - 'Bewegung zu hoch: Ein Anheben der Arme weit über Schulterhöhe hinaus kann die Gelenke
    belasten und verlagert die Arbeit auf den Trapezius statt den seitlichen Deltamuskel.'
