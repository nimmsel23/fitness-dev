  coaching_notes:
  - Stelle dich aufrecht hin und halte dich bei Bedarf leicht an einer Wand oder einem
    Stuhl fest, ohne dich mit dem Oberkörper hineinzulehnen.
  - Verlagere dein Gewicht sauber auf das Standbein und halte Knie, Becken und Fußgewölbe
    dort stabil.
  - Hebe das freie Bein mit gestrecktem oder nur leicht gebeugtem Knie kontrolliert
    seitlich an, ohne die Fußspitze stark nach außen aufzudrehen.
  - Die Bewegung kommt aus dem Hüftgelenk; halte den Oberkörper möglichst ruhig und
    vermeide ein seitliches Ausweichen oder Hochziehen der Hüfte.
  - Führe das Bein kontrolliert wieder zurück und nutze nur so viel Schwung, dass
    die Zielmuskulatur weiter arbeitet und die Haltung sauber bleibt.
  - Atme ruhig weiter, spanne Bauch und Rumpf leicht an und arbeite in einem schmerzfreien
    Bewegungsradius.
  common_errors:
  - Das Becken kippt zur Seite oder die freie Hüfte wird hochgezogen, statt die Bewegung
    aus der Hüftabduktion zu erzeugen.
  - Der Oberkörper lehnt sich stark zur Gegenseite, um Höhe zu gewinnen.
  - Die Fußspitze dreht weit nach außen, wodurch die Belastung weniger sauber auf
    die seitliche Hüftmuskulatur trifft.
  - Das Standbein kollabiert im Knie oder der Fuß verliert die stabile Bodenverbindung.
  - Das Bein wird unkontrolliert geschwungen, sodass Schwung die Muskelarbeit ersetzt.
  - Der Bewegungsumfang wird erzwungen, obwohl dabei Spannung im unteren Rücken oder
    in der Leiste entsteht.
