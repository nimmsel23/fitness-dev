  id: rear_delt_fly_cable_incline
  name: Vorgebeugte Kabel Rear Delt Flys
  display_name: Vorgebeugte Kabel Rear Delt Flys
  german: Vorgebeugte Kabel Rear Delt Flys
  english: Bent-Over Cable Rear Delt Fly
  category: shoulders
  type: isolation
  movement_pattern: horizontal_abduction
  equipment:
