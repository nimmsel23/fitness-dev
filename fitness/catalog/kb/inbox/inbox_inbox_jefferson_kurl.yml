  coaching_notes:
  - Langsam und maximal kontrolliert ausführen – dies ist eine Mobilitätsübung, keine
    Kraftarbeit
  - Mit neutralem Kopf starten, dann Wirbel für Wirbel nach vorne abrollen – nicht
    in Schwung kommen
  - In der untersten Position kurz halten und intensive Dehnung in der hinteren Wirbelsäule
    spüren
  - 'Rückweg genauso langsam: von unten nach oben aufrollen, Wirbel für Wirbel stabilisieren'
  - Bis zur persönlichen Grenze gehen, aber niemals in Schmerz oder extreme Dehnung
    erzwingen
  common_errors:
  - Zu schnell abrollen und die kontrollierte Spannung verlieren
  - Mit Schwung arbeiten statt mit reiner Bewegungskontrolle
  - Zu weit in die Enddehnung gehen und Nervenpinching riskieren
  - Hals/Nacken anspannen statt locker lassen
  - Mit steifem Rücken abrollen statt segmental Wirbel für Wirbel
