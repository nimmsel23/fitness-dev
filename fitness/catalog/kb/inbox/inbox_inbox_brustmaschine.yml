  coaching_notes:
  - Stellen Sie den Sitz so ein, dass Ihre Füße flach auf dem Boden stehen und Ihr
    Rücken fest an der Lehne anliegt.
  - Wählen Sie eine Griffbreite, bei der Ihre Unterarme am obersten Punkt der Bewegung
    senkrecht zum Boden stehen.
  - Halten Sie die Schultern während der gesamten Bewegung tief und nach hinten gezogen
    (Schulterblätter fixiert), um die Brust optimal zu isolieren.
  - Drücken Sie das Gewicht kontrolliert nach vorne, bis die Arme fast vollständig
    gestreckt sind, ohne die Ellenbogen durchzudrücken.
  - Führen Sie das Gewicht langsam und kontrolliert zurück, bis Sie eine leichte Dehnung
    in der Brust spüren und die Ellenbogen etwa auf Schulterhöhe sind.
  - Atmen Sie beim Drücken aus und beim Zurückführen des Gewichts ein.
  - Konzentrieren Sie sich auf die Muskelkontraktion und vermeiden Sie es, Schwung
    zu verwenden.
  common_errors:
  - '**Unzureichende Sitzeinstellung:** Eine falsche Sitzhöhe kann zu unnötiger Belastung
    der Schultern oder des Rückens führen. Achten Sie auf eine stabile Basis mit den
    Füßen.'
  - '**Durchgestreckte Ellenbogen:** Das vollständige Durchdrücken der Ellenbogen
    am Endpunkt der Bewegung belastet die Gelenke übermäßig und reduziert die Muskelspannung.'
  - '**Kurzer Bewegungsbereich:** Das Auslassen des vollständigen Zurückführens des
    Gewichts oder des vollen Ausstoßes nach vorne verringert die Effektivität der
    Übung.'
  - '**Schultern hochziehen:** Wenn die Schultern während des Drückens zu den Ohren
    gezogen werden, überlastet dies den oberen Trapezius und verringert die Aktivierung
    der Brustmuskulatur.'
  - '**Ruckartige Bewegungen:** Die Verwendung von Schwung statt kontrollierter Muskelkraft
    erhöht das Verletzungsrisiko und mindert den Trainingsreiz.'
  - '**Abheben des Rückens:** Ein starkes Hohlkreuz oder das Abheben des Rückens von
    der Lehne kann die Stabilität beeinträchtigen und den unteren Rücken belasten.'
