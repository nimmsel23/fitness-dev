  primary_muscles:
  - 304_rotator_cuff
  secondary_muscles:
  - 303_posterior_deltoid
  stabilizers:
  - 501_rectus_abdominis
  - 502_obliquus_externus
  - 203_trapezius_middle
  - 205_rhomboids
  coaching_notes:
  - Stellen Sie sich seitlich zum Kabelzugturm, der Griff auf Ellenbogenhöhe.
  - Halten Sie den Oberarm eng am Körper und beugen Sie den Ellenbogen auf 90 Grad.
  - Rotieren Sie den Unterarm langsam nach außen, weg vom Körper, während der Oberarm
    stabil bleibt.
  - Führen Sie die Bewegung kontrolliert zurück in die Ausgangsposition.
  - Konzentrieren Sie sich auf die Muskelkontraktion der Rotatorenmanschette und vermeiden
    Sie Schwung.
  common_errors:
  - Verwendung von zu viel Gewicht, was zu Kompensationsbewegungen führt.
  - Den Ellenbogen vom Körper wegbewegen oder den Oberarm mitschwingen lassen.
  - Schnelle, unkontrollierte Bewegungen, besonders in der exzentrischen Phase.
  - Mit dem Oberkörper mitrotieren anstatt nur aus der Schulter.
