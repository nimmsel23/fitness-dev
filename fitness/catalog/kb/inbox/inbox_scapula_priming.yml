  id: scapula_priming
  name: Scapula Priming
  display_name: Schulterblatt-Aktivierung
  german: Schulterblatt-Aktivierung
  english: Scapula Priming
  category: back
  type: isolation
  movement_pattern: scapular_control
  equipment:
  - bodyweight
  - resistance_band
  primary_muscles:
  - 105_serratus_anterior
  - 205_rhomboids
  - 203_trapezius_middle
  - 202_trapezius_upper
  - 204_trapezius_lower
  secondary_muscles:
  - 201_latissimus_dorsi
  - 104_pectoralis_minor
  - 304_rotator_cuff
  stabilizers:
  - 206_erector_spinae
  - 504_transverse_abdominis
  coaching_notes:
  - Fokussieren Sie sich auf die bewusste Bewegung und Aktivierung Ihrer Schulterblattmuskulatur.
  - Führen Sie die Bewegungen langsam und kontrolliert aus, um die Muskel-Gehirn-Verbindung
    zu stärken.
  - 'Praktizieren Sie verschiedene Schulterblattbewegungen: Protraktion (nach vorne
    schieben), Retraktion (nach hinten ziehen), Elevation (hochziehen), Depression
    (runterdrücken) und Rotation (auf- und abwärts).'
  - Halten Sie den Rumpf stabil und vermeiden Sie Ausweichbewegungen aus der Wirbelsäule
    oder den Armen.
  common_errors:
  - Bewegung hauptsächlich aus den Armen oder der Wirbelsäule statt aus den Schulterblättern.
  - Verkrampfung oder zu starkes Hochziehen der Schultern (Überaktivität des oberen
    Trapezius).
  - Zu schnelle oder ruckartige Ausführung, ohne Fokus auf die zielgerichtete Muskelaktivierung.
