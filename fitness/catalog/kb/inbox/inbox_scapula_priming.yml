  coaching_notes:
  - Fokussieren Sie sich auf die bewusste Bewegung und Aktivierung Ihrer Schulterblattmuskulatur.
  - Führen Sie die Bewegungen langsam und kontrolliert aus, um die Muskel-Gehirn-Verbindung
    zu stärken.
  - 'Praktizieren Sie verschiedene Schulterblattbewegungen: Protraktion (nach vorne schieben),
    Retraktion (nach hinten ziehen), Elevation (hochziehen), Depression (runterdrücken) und
    Rotation (auf- und abwärts).'
  - Halten Sie den Rumpf stabil und vermeiden Sie Ausweichbewegungen aus der Wirbelsäule oder
    den Armen.
  common_errors:
  - Bewegung hauptsächlich aus den Armen oder der Wirbelsäule statt aus den Schulterblättern.
  - Verkrampfung oder zu starkes Hochziehen der Schultern (Überaktivität des oberen Trapezius).
  - Zu schnelle oder ruckartige Ausführung, ohne Fokus auf die zielgerichtete Muskelaktivierung.
