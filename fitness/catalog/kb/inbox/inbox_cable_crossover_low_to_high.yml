name: inbox_cable_crossover_low_to_high
description: 'Proactively generated expert draft for: Low-to-High Cable Cross'
exercises:
- exercise_id: cable_crossover_low_to_high
  id: cable_crossover_low_to_high
  name: Low-to-High Cable Cross
  display_name: Kabelzug von unten nach oben
  german: Kabelzug von unten nach oben
  english: Low-to-High Cable Crossover
  category: chest
  type: isolation
  movement_pattern: incline_horizontal_adduction
  equipment:
  - cable
  primary_muscles:
  - chest
  secondary_muscles:
  - shoulders
  stabilizers:
  - abs
  coaching_notes:
  - Stellen Sie die Kabelzüge auf die niedrigste Position ein. Greifen Sie je einen Griff
    mit jeder Hand.
  - Stellen Sie sich mit leichtem Vorwärtsschritt oder in einer leichten Schrittstellung in
    die Mitte der Kabelzugmaschine.
  - Beugen Sie die Ellbogen leicht an und halten Sie diese Beugung während der gesamten Bewegung
    bei.
  - Führen Sie die Griffe in einer diagonalen Bewegung von unten nach oben und innen zusammen,
    bis sich Ihre Hände auf Brusthöhe oder leicht darüber treffen.
  - Konzentrieren Sie sich darauf, die obere Brust am höchsten Punkt der Bewegung bewusst
    anzuspannen.
  - Führen Sie die Griffe kontrolliert und langsam in die Ausgangsposition zurück, um die
    Dehnung in der Brust zu spüren.
  common_errors:
  - Verwenden von zu viel Gewicht, wodurch die Bewegung unkontrolliert wird und andere Muskeln
    (z.B. Trizeps, Schultern) dominieren.
  - Zu starkes Beugen oder Strecken der Ellbogen, was die Belastung von der Brust nimmt.
  - Schultern hochziehen (Schulterzucken), was den oberen Trapezius aktiviert und die Brust
    weniger isoliert.
  - Rundrücken oder Überstrecken des Rückens; der Rumpf sollte stabil und leicht nach vorne
    gebeugt bleiben.
  - Die Bewegung nicht vollständig ausführen, sowohl in der Kontraktions- als auch in der
    Dehnungsphase.
