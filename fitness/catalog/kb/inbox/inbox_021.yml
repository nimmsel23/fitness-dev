  coaching_notes:
  - Der Untergriff betont die Bizeps-Muskulatur deutlich stärker als der klassische Obergriff-Klimmzug
  - 'Optimal: schulterweit Griffbreite für maximale Hebel-Mechanik und Bizeps-Aktivierung'
  - 'Vollständiger ROM ist essentiell: Kinn über die Stange in der obersten Position, volle
    Ellenbogenstreckung unten'
  - 'In der Ausgangsposition: aktive Schulterdepression vor dem Hochziehen; beim Hochziehen
    Schulterblatt nach hinten-oben bewegen'
  - Diese Variante ist anfängerfreundlicher als Obergriff-Klimmzüge und eine gute Progressionsbrücke
    zum vollen Pull-up
  - 'Körperspannung halten: kein Schwung aus Hüfte oder Beinen – reine Arm- und Rückenmuskeln-Arbeit'
  - 'Bei Anfängern: negative Klimmzüge trainieren (von oben springen, langsam senken) als
    Progressionsschritt'
  common_errors:
  - 'Unvollständiges ROM: nur halbe Bewegungen statt Kinn über die Stange oben und volle Streckung
    unten'
  - Zu viel Schwung aus Körper und Beinen statt kontrolierter Zugbewegung
  - Schultern nicht richtig deprimiert in der Ausgangsposition
  - Zu breiter Griff – Untergriff funktioniert besser mit schulterweit bis schulterbreite
    Griffbreite
  - Fehlende Körperspannung und unkontrollierter Abstieg (Abstoßen statt Senken)
