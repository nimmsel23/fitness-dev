  coaching_notes:
  - Spannen Sie Bauch, Gesäß und Oberschenkel gleichzeitig an, als wollten Sie den
    Boden mit den Unterarmen nach hinten ziehen und die Füße nach vorne schieben.
  - Halten Sie Kopf, Brustkorb, Becken und Fersen in einer geraden Linie; das Ziel
    ist Körperspannung, nicht bloß Zeit auf der Uhr.
  - Kippen Sie das Becken leicht nach hinten, damit der untere Rücken lang bleibt
    und die Anti-Extensionsarbeit aus der Rumpfmuskulatur kommt.
  - Drücken Sie die Unterarme aktiv in den Boden und schieben Sie die Schulterblätter
    kontrolliert nach vorne, damit der obere Rücken stabil bleibt.
  - Atmen Sie flach und kontrolliert in den Bauch- und Flankenraum, ohne die Spannung
    im Rumpf zu verlieren.
  - Beenden Sie den Satz, sobald die Beckenposition oder Rumpfspannung nicht mehr
    sauber gehalten werden kann.
  common_errors:
  - Das Becken sinkt ab und der untere Rücken fällt ins Hohlkreuz, wodurch die Belastung
    von der Rumpfmuskulatur auf passive Strukturen verlagert wird.
  - Das Gesäß wird zu hoch geschoben, sodass die Position eher zu einer Pike als zu
    einer geraden Plank-Linie wird.
  - Die Schultern kollabieren zwischen den Oberarmen, weil nicht aktiv in den Boden
    gedrückt und die Schulterblattspannung verloren wird.
  - Der Kopf wird angehoben oder fallen gelassen, statt die Halswirbelsäule neutral
    in Verlängerung der Wirbelsäule zu halten.
  - Es wird die Luft angehalten, bis die Rumpfspannung zusammenbricht, anstatt unter
    Spannung kontrolliert weiterzuatmen.
  - Die Haltedauer wird über Technik priorisiert, obwohl die Übung biomechanisch nur
    mit sauberer Anti-Extensionskontrolle sinnvoll ist.
