  coaching_notes:
  - Um die Brustmuskulatur zu betonen, lehne den Oberkörper deutlich nach vorne und
    halte die Ellbogen leicht ausgestellt.
  - Senke dich kontrolliert ab, bis die Schultern unterhalb der Ellbogen sind, um
    einen vollen Bewegungsumfang zu erreichen, aber nur solange es schmerzfrei ist.
  - Drücke dich kraftvoll nach oben, um in die Ausgangsposition zurückzukehren. Vermeide
    es, die Schultern am oberen Punkt zu den Ohren hochzuziehen.
  - Spanne deine Bauchmuskeln an, um den Rumpf stabil zu halten und ein Schwingen
    zu vermeiden.
  common_errors:
  - Nicht tief genug absenken, wodurch der Bewegungsumfang und die Muskelaktivierung
    begrenzt werden.
  - Die Ellbogen zu eng am Körper halten, was die Betonung stärker auf den Trizeps
    verlagert.
  - Die Schultern nach vorne rundet oder in eine ungünstige Position bringt, was zu
    Verletzungen führen kann.
  - Schwung durch Schwingen des Körpers holen, anstatt die Muskeln arbeiten zu lassen.
