  coaching_notes:
  - Oberkörper aufrecht halten, die Stange ruht auf den vorderen Deltamuskeln und
    Schlüsselbeinen
  - Knie fahren nach vorne über die Zehen in einer geraden Linie – kein Valgus-Einknicken
  - Tiefe unter Kontrolle erreichen, kein Ruck aus der untersten Position
  - Enge Fußstellung, etwa hüftbreit, Gewicht im Vorfuß verteilt
  - Starke Abdominalspannung mit Valsalva-Manöver für Kraftübertragung und Spinalstabilität
  common_errors:
  - Oberkörper nach vorne lehnen – reduziert Quad-Beteiligung und erhöht Wirbelsäulenbelastung
  - Knie kollabieren nach innen (Valgus) – Zeichen fehlender Hüftabduktoren-Kontrolle
  - Unzureichende Knöchel- oder Hüftmobilität führt zu Kompensationsmuster
  - Gewicht nach hinten auf den Fersen verlagert – vermindert Quadriceps-Aktivierung
  - Fehlende Kernspannung oder Atemkontrolle – Stabilitätsverlust und Kraftverlust
