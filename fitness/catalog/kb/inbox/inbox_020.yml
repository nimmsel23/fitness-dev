  instructions:
  - 'Grab the pull-up bar with the palms facing forward using the prescribed grip.
    Note on grips: For a wide grip, your hands need to be spaced out at a distance
    wider than your shoulder width. For a medium grip, your hands need to be spaced
    out at a distance equal to your shoulder width and for a close grip at a distance
    smaller than your shoulder width.'
  - As you have both arms extended in front of you holding the bar at the chosen grip
    width, bring your torso back around 30 degrees or so while creating a curvature
    on your lower back and sticking your chest out. This is your starting position.
  - 'Pull your torso up until the bar touches your upper chest by drawing the shoulders
    and the upper arms down and back. Exhale as you perform this portion of the movement.
    Tip: Concentrate on squeezing the back muscles once you reach the full contracted
    position. The upper torso should remain stationary as it moves through space and
    only the arms should move. The forearms should do no other work other than hold
    the bar.'
  - After a second on the contracted position, start to inhale and slowly lower your
    torso back to the starting position when your arms are fully extended and the
    lats are fully stretched.
  - Repeat this motion for the prescribed amount of repetitions.
  coaching_notes:
  - 'Starte aus einem aktiven Hang: Hals lang, Schultern weg von den Ohren, und baue
    eine leichte Vorspannung in den Schulterblättern (Scapula-Depression) auf, anstatt
    passiv in den Gelenken zu hängen.'
  - 'Arbeite über die volle, kontrollierte Bewegungsfreiheit (ROM): unten sauber ausstrecken
    (Schultern bleiben aktiv), oben den oberen Brustkorb zur Leiste bringen, ohne
    die Spannung im Rumpf zu verlieren.'
  - Konzentriere dich darauf, die Ellenbogen aktiv Richtung Flanken oder Hüfte zu
    ziehen. Dies gewährleistet, dass der Zug primär aus Latissimus und oberem Rücken
    erfolgt und nicht nur aus den Armen.
  - Halte den Körper als stabile, gerade Linie von Kopf bis Fuß. Gesäß und Bauchmuskeln
    leicht anspannen, um ein Hohlkreuz oder unerwünschten Beinschwung zu vermeiden.
  - Lass die Schulterblätter während der Zugphase bewusst nach unten und leicht nach
    hinten gleiten (Scapula-Depression und Retraktion), um eine optimale Schulterposition
    zu bewahren und ein Hochziehen der Schultern zu den Ohren zu verhindern.
  - Steuere auch die exzentrische (absinkende) Phase bewusst und kontrolliert. Ein
    langsames, sauberes Absenken verbessert die Schulterkontrolle, fördert den Kraftaufbau
    und schult das Positionsgefühl im Hang.
  - Der Obergriff (Pronated Grip) an der Leiste verlagert die Belastung tendenziell
    stärker auf Latissimus, Teres Major und den oberen Rücken und fordert die Griffkraft
    intensiver als ein Standard-Klimmzug an einer dickeren Stange.
  common_errors:
  - Start aus einem passiven Hang, bei dem die Schultern zu den Ohren gezogen sind
    und keine Grundspannung im Schultergürtel und Rumpf vorhanden ist.
  - Schwungholen (Kipping) mit Beinen oder Hüfte, anstatt jede Wiederholung kontrolliert
    und aus eigener Kraft aus dem Hang einzuleiten.
  - 'Halbe Wiederholungen ausführen: entweder unten nicht vollständig ausstrecken
    oder oben nicht weit genug hochziehen, um die maximale Kontraktion zu erreichen.'
  - Die Schultern zu den Ohren ziehen und damit die wichtige Scapula-Depression sowie
    eine stabile und gesunde Schultermechanik verlieren.
  - Ins Hohlkreuz fallen oder die Rippen aufklappen lassen (Rib Flare), wodurch der
    Rumpf instabil wird, die Kraftübertragung leidet und das Risiko für den unteren
    Rücken steigt.
  - Den Kopf nach vorne zur Leiste schieben und den Hals überstrecken, anstatt den
    Brustkorb aktiv zur Leiste zu ziehen und eine neutrale Kopfposition zu halten.
  - Eine gewählte Leiste oder Griffbreite ist zu anspruchsvoll, führt zu Technikverlust,
    übermäßiger Belastung von Sehnen und Gelenken, und erhöht das Verletzungsrisiko
    für Finger und Ellbogen.
