  coaching_notes:
  - Stelle die Kabelrollen oberhalb der Schulterhöhe ein und nimm einen kleinen Ausfallschritt,
    damit du stabil stehst und die Seile dich nicht nach hinten ziehen.
  - Halte in beiden Armen eine leichte, feste Ellbogenbeugung und bewahre diesen Winkel
    über den ganzen Satz, damit die Spannung auf der Brust bleibt und nicht zum Trizeps
    oder Ellenbogen wandert.
  - Ziehe die Griffe in einem bogenförmigen Verlauf vor dem Körper nach unten und
    innen, als würdest du die unteren Brustfasern aktiv zusammenführen.
  - Lass die Brust stolz, die Rippen kontrolliert und die Schultern tief; die Schulterblätter
    sollen stabil bleiben und am Ende nur natürlich mit nach vorn gleiten, nicht aggressiv
    nach vorne kippen.
  - Stoppe die exzentrische Phase dort, wo du noch Zug auf der Brust hältst und die
    Schultervorderseite nicht in eine passive Dehnung gezogen wird.
  - Atme beim Zusammenführen kraftvoll aus, spanne Bauch und Gesäß leicht an und vermeide
    jedes Nachgeben im Rumpf, damit die Kraft sauber in die Arme und Brust übertragen
    wird.
  - Halte die Endposition kurz mit bewusstem Brust-Squeeze, ohne die Griffe gegeneinander
    zu schlagen oder durch Schwung über die eigentliche Kontraktion hinauszuziehen.
  common_errors:
  - Zu schweres Gewicht, sodass die Bewegung zu einem ganzen Oberkörperzug wird und
    der Fokus von der Brust auf Schwung und Schultern kippt.
  - Die Ellbogen während der Bewegung stark beugen oder strecken, wodurch aus dem
    Fly eher ein unsauberer Press- oder Curl-Mix wird.
  - Die Arme in der Rückführung zu weit öffnen und die Schultern nach vorn ziehen
    lassen, was die vordere Schulter unnötig belastet.
  - Die Hände nur nach unten statt nach unten und vor dem Körper zusammenzuführen,
    wodurch der eigentliche Adduktionsanteil der Brust verloren geht.
  - Den Oberkörper stark nach vorn beugen oder ins Hohlkreuz ausweichen, um die Last
    zu bewegen, statt den Rumpf stabil zu halten.
  - Am tiefsten Punkt die Spannung zu verlieren und die Gewichte zurückschnappen zu
    lassen, wodurch die exzentrische Kontrolle und der Muskelreiz sinken.
  - Die Schultern hochzuziehen und den Nacken anzuspannen, anstatt die Bewegung aus
    Brust und kontrollierter Schulterführung zu organisieren.
