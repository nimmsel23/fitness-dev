  coaching_notes:
  - Kontrollierte Bewegung ohne Schwung – die Streckung sollte flüssig und langsam
    erfolgen
  - Vollständige Streckung im obersten Punkt erreichen, ohne das Knie zu hyperextendieren
  - Gewicht bewusst wählen – zu schwer reduziert Kontrolle und Isolationswirkung
  - Knie sollten immer in Linie mit den Hüften bleiben; nicht nach innen oder außen
    drehen
  - Negative (Rückwärts-)Phase verlangsamen – das ist der wichtigste Teil für Muskelaufbau
  - Fersen auf der Fußstütze halten; nicht mit den Zehen drücken
  common_errors:
  - Zu schnelle, unkontrollierte Bewegungen ohne Pause
  - Unvollständige Streckung im obersten Punkt (Knie nicht ganz durchgestreckt)
  - Knie kippen nach innen (Valgus) oder außen (Varus)
  - Mit Schwung arbeiten statt kontrolliert zu bewegen
  - Rückenlehne zu weit nach hinten geneigt – reduziert Isolationswirkung
