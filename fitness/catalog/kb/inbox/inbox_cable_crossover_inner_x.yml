  coaching_notes:
  - Stelle die Kabelrollen etwa auf Schulterhöhe ein, gehe mittig zwischen die Türme
    und nimm einen versetzten, stabilen Stand ein.
  - Hebe den Brustkorb an, halte die Schultern tief und hinten organisiert und bewahre
    während der gesamten Wiederholung eine leichte Ellbogenbeugung.
  - Führe die Arme in einer weiten Bogenbahn vor dem Körper zusammen, bis sich die
    Hände leicht überkreuzen und die Brust aktiv maximal verkürzt.
  - Die Bewegung kommt aus der horizontalen Adduktion im Schultergelenk, nicht aus
    einem nachdrückenden Strecken der Ellbogen.
  - Halte die Endposition für einen kurzen Moment, ohne die Schultern nach vorn hochzuziehen,
    und spanne die Brust bewusst an.
  - Lass die Griffe kontrolliert und unter Spannung in die gedehnte Position zurückkehren,
    ohne dass die Gewichte absetzen oder dich nach hinten ziehen.
  - Wähle ein Gewicht, bei dem du die Zugbahn sauber halten kannst und die Spannung
    durchgehend in der Brust statt im vorderen Schulterbereich spürst.
  common_errors:
  - Zu hohes Gewicht, wodurch die Ellbogen zunehmend strecken und die Übung eher zu
    einem Trizepsdrücken als zu einer Brustisolation wird.
  - Die Schultern wandern nach oben oder nach vorn, was die Belastung aus der Brust
    in den Nacken und die vordere Schulter verschiebt.
  - Zu kurze Bewegungsamplitude, bei der weder eine saubere Dehnung in der Startposition
    noch eine volle Kontraktion in der Endposition erreicht wird.
  - Schwung aus Oberkörper oder Hüfte, statt die Wiederholung kontrolliert aus dem
    Schultergelenk zu führen.
  - Zu starkes Beugen oder Verändern des Ellbogenwinkels während der Wiederholung,
    wodurch die Belastung unnötig auf Arme und Gelenke verlagert wird.
  - Die exzentrische Phase wird fallen gelassen, sodass Spannung, Kontrolle und Dehnungsreiz
    in der Brust verloren gehen.
  - Der Kopf schiebt nach vorn oder der untere Rücken wird überstreckt, weil die Rumpfspannung
    und Standstabilität fehlen.
