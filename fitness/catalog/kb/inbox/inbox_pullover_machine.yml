  coaching_notes:
  - Kontrollierte Bewegung durchführen, keine ruckartigen Züge oder Schwungbewegungen
  - In der Ausgangsposition die Arme vollständig oder nahezu vollständig strecken
  - Ellbogen leicht gebeugt halten – weder vollständig durchgestreckt noch stark gebeugt
  - Am unteren Punkt der Bewegung eine intensive Brustkontraktion anstreben
  - Die komplette Bewegungsamplitude ausnutzen für optimale Muskelaktivation
  - Vor schweren Sätzen ausgiebig aufwärmen, um die Schulter zu mobilisieren
  common_errors:
  - Zu schnelle oder unkontrollierte Bewegungen mit erhöhtem Verletzungsrisiko
  - Ellbogen zu weit nach außen positionieren – sollten nah am Körper sein
  - Mit zu viel Gewicht arbeiten und die Bewegung mit Schwung ausführen
  - Unvollständige Bewegungsamplitude, die die Effektivität mindert
  - Nacken und Schultern anspannen statt die Bewegung sauber auszuführen
