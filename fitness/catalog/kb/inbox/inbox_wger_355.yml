  coaching_notes:
  - Stelle die Sitzhöhe so ein, dass deine Knie unter den Polstern fixiert sind und
    die Füße fest auf dem Boden stehen. Der Oberkörper sollte aufrecht sein.
  - Fasse die Stange mit einem weiten Griff, etwas breiter als schulterbreit, wobei
    die Handflächen nach vorne zeigen.
  - Ziehe die Schulterblätter aktiv nach unten und hinten, bevor du die Bewegung initiierst.
    Halte diese Spannung während der gesamten Übung.
  - Ziehe die Stange mit Kontrolle nach unten in Richtung obere Brust oder Schlüsselbein,
    indem du dich auf die Kontraktion des Latissimus konzentrierst. Die Ellenbogen
    sollten eng am Körper nach unten geführt werden.
  - Atme beim Herunterziehen aus und lass die Stange dann kontrolliert wieder nach
    oben steigen, bis deine Arme fast vollständig gestreckt sind und du eine Dehnung
    im Latissimus spürst. Achte darauf, die Schultern nicht hochzuziehen.
  - Konzentriere dich auf eine langsame und kontrollierte Ausführung, um die Zielmuskulatur
    optimal zu stimulieren und Schwung zu vermeiden.
  common_errors:
  - Verwendung von Schwung und Wippen des Oberkörpers, um das Gewicht zu bewegen,
    anstatt die Rückenmuskulatur zu nutzen. Dies reduziert die Effektivität und erhöht
    das Verletzungsrisiko.
  - Ein zu starkes Zurücklehnen des Oberkörpers, wodurch die Bewegung von einem vertikalen
    Zug zu einer horizontalen Ruderbewegung verschoben wird und der Latissimus weniger
    isoliert arbeitet.
  - Unvollständige Streckung der Arme am oberen Punkt der Bewegung, was den vollen
    Bewegungsumfang und die Dehnung des Latissimus einschränkt.
  - Hochziehen der Schultern zu den Ohren während der Bewegung (Schulter-Elevation),
    was auf eine mangelnde Kontrolle der Schulterblätter hindeutet und die Nackenmuskulatur
    überlastet.
  - Fokus auf die Arme und den Bizeps anstatt auf den Rücken, was dazu führt, dass
    der Bizeps übermäßig beansprucht wird und der Latissimus nicht ausreichend trainiert
    wird.
  - Ein zu enger oder zu breiter Griff, der die Biomechanik beeinträchtigt und die
    Zielmuskulatur weniger effektiv trifft oder die Schultern unnötig belastet.
