  coaching_notes:
  - Den gesamten Körper vom Kopf bis zu den Zehenspitzen aktiv anspannen und eine
    gerade Linie bilden.
  - Drücke die Hände fest in den Boden und schiebe die Schultern aktiv zu den Ohren
    (Schultergürtel eleviert und protrudiert), als würdest du den Boden von dir wegdrücken.
  - Halte die Ellbogen vollständig gestreckt und arretiert, aber nicht überstreckt,
    um maximale Stabilität zu gewährleisten.
  - Halte den Kopf in einer neutralen Position, Blick leicht nach vorne zwischen die
    Hände oder auf den Boden. Vermeide ein Überstrecken des Nackens.
  - Ziehe den Bauchnabel fest zur Wirbelsäule und spanne die Gesäßmuskeln an, um ein
    Hohlkreuz zu vermeiden. Das Becken sollte leicht nach hinten gekippt sein.
  - Halte die Beine zusammen und vollständig gestreckt, die Knie durchgedrückt. Strecke
    die Zehen spitz nach oben, um die Linie zu verlängern.
  - Versuche, ruhig und kontrolliert zu atmen, obwohl der Core fest angespannt ist,
    um die Haltedauer zu verlängern.
  common_errors:
  - '**Hohlkreuz (Bananenrücken):** Der Core ist nicht ausreichend angespannt, die
    Hüfte ist zu stark gebeugt und die Lendenwirbelsäule überstreckt sich. Dies beeinträchtigt
    die Stabilität und erhöht die Belastung auf die Wirbelsäule.'
  - '**Durchhängende Schultern:** Die Schultern werden nicht aktiv hochgeschoben oder
    protrudiert. Dies führt zu einem ''zusammengesackten'' Gefühl und mangelnder Stabilität
    in der Schulterpartie.'
  - '**Gekrümmte Ellbogen:** Die Ellbogen sind nicht vollständig durchgestreckt, was
    die Arme instabil macht und die Belastung auf die Ellbogengelenke erhöht.'
  - '**Ungestapelte Gelenke:** Hüfte und Schultern sind nicht vertikal über den Händen
    gestapelt, was die Balance erheblich erschwert und unnötige Muskelarbeit erfordert.
    Eine gerade Linie vom Handgelenk über Schulter, Hüfte, Knie bis zu den Fußgelenken
    ist entscheidend.'
  - '**Atem anhalten:** Das Anhalten des Atems führt zu erhöhtem Druck und mangelnder
    Ausdauer. Versuche, eine kontrollierte, flache Atmung durchzuführen, auch wenn
    die Rumpfmuskulatur fest angespannt ist.'
