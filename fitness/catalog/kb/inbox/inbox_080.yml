  coaching_notes:
  - Halten Sie den Rücken während der gesamten Bewegung gerade und neutral, um die
    Wirbelsäule zu schützen.
  - Beginnen Sie die Bewegung, indem Sie die Hüften nach hinten schieben (Hüftscharnier),
    gefolgt von der Beugung der Knie.
  - Spannen Sie die Bauchmuskeln fest an (Valsalva-Manöver bei schweren Lasten), um
    die Rumpfstabilität zu maximieren.
  - Halten Sie die Hantel so nah wie möglich am Körper, um den Hebelarm zu minimieren
    und den unteren Rücken zu entlasten.
  - Atmen Sie am oberen Punkt aus und wieder tief ein, bevor Sie die Hantel kontrolliert
    absetzen.
  common_errors:
  - 'Runden des unteren Rückens: Dies erhöht das Risiko von Bandscheibenverletzungen
    erheblich.'
  - 'Das Hochkommen der Hüften vor dem Oberkörper (''Striptease-Deadlift''): Dies
    führt zu einer übermäßigen Belastung des unteren Rückens.'
  - 'Zu weite Entfernung der Hantel vom Körper: Erhöht den Hebelarm und die Belastung
    für den Rücken.'
  - 'Verwenden von zu viel Gewicht bei schlechter Form: Priorisieren Sie die Technik
    vor dem Gewicht.'
