  coaching_notes:
  - Hüfte nach hinten schieben; Knie bleiben leicht gebeugt, aber der Fokus bleibt auf dem Hüftscharnier.
  - Hantel nah am Körper führen und die Hamstring-Dehnung kontrolliert suchen.
  - Nur so tief gehen, wie die neutrale Rückenposition gehalten werden kann.
  - Auf dem Rückweg Hüfte nach vorne bringen, ohne oben ins Hohlkreuz zu überstrecken.
  common_errors:
  - Zu viel Kniebeugung, wodurch die Übung zum normalen Kreuzheben wird.
  - Rücken rundet am unteren Punkt, weil die ROM erzwungen wird.
  - Hantel driftet nach vorne und zieht unnötig am unteren Rücken.
  - Zu schwer laden und dadurch die exzentrische Kontrolle verlieren.
