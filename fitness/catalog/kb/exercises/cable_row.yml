  coaching_notes:
  - Oberkörper minimal nach vorne neigen (etwa 45°), Knie leicht gebeugt
  - Langhantel dicht am Körper halten, nicht weggebeugt
  - An der Oberseite pausieren und Schulterblattsqueeze durchführen
  - Keine übermäßige Lumbalflexion – Rückenstrecker neutral halten
  - Ellbogen dicht am Körper, nicht weit abspreizen
  - Kontrolle in der Bewegung, kein Reißen oder exzessives Momentum
  common_errors:
  - Rücken zu sehr gerundet oder übermäßig gewölbt
  - Langhantel vom Körper weg während des Zugs
  - Zu schnelle Wiederholungen ohne Muskelkontrolle
  - Gewicht zu schwer, Kompensation durch Rückenstrecker statt Lat
  - Schulterblatt nicht vollständig retraktion
