  coaching_notes:
  - Arme sollten während der gesamten Bewegung senkrecht zum Boden bleiben. Nur die
    Ellbogen beugen sich, keine Schulterbewegung.
  - Ellbogen eng beieinander halten. Ein breiter Stand führt zu schlechterer Isolation
    und überlasten die Schultergelenke.
  - 'Vollständigen Bewegungsbereich nutzen: von der vollen Streckung bis zur kontrollierten
    Beugung hinter dem Kopf.'
  - Bei der Absenkung einatmen, bei der Streckung ausatmen.
  - Mit moderatem Gewicht beginnen – diese Übung erfordert gute Kontrolle und Stabilität
    im Ellbogengelenk.
  common_errors:
  - Ellbogen bewegen sich auseinander statt stabil beieinander zu bleiben
  - Schulterbewegung statt isolierter Ellbogenstreckung – führt zu Kraftverlust
  - Zu schweres Gewicht, das zu Schwungbewegungen und Rumpfausgleich führt
  - Unvollständiger Bewegungsbereich – nicht bis zur vollständigen Streckung
  - Kopf wird passiv nach hinten bewegt statt aktiv neutral zu bleiben
