  coaching_notes:
  - Arme während der gesamten Bewegung leicht gebeugt halten, nicht vollständig strecken
  - Langsam und kontrolliert zusammenführen, Peak-Kontraktion 1-2 Sekunden halten
  - Kein Schwung mit dem Oberkörper — reine Adduktionsbewegung aus den Armen
  - 'Für unteren Brustbereich: Griffe von oben nach unten führen'
  - 'Für mittleren Brustbereich: Griffe in mittlerer Höhe positionieren'
  - 'Für oberen Brustbereich: Griffe von unten nach oben führen'
  - Aufrecht bleiben, nicht nach vorne lehnen
  common_errors:
  - Zu schnell oder mit Oberkörper-Schwung arbeiten statt kontrolliert
  - Arme am äußersten Punkt vollständig strecken (sollten leicht gebeugt bleiben)
  - Zu schwer laden und dadurch Bewegungsqualität verlieren
  - Nach vorne lehnen oder Rumpf-Rotation verwenden
