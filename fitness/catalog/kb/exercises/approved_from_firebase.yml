  common_errors:
  - Zu hohes Gewicht, sodass die Bewegung über Schwung statt über die Außenrotatoren
    erzeugt wird.
  - Der Ellenbogen löst sich vom Oberkörper oder wandert nach hinten, wodurch die
    Übung ihre Zielmuskulatur verfehlt.
  - Der Oberkörper rotiert mit, um zusätzliche Bewegungsamplitude vorzutäuschen.
  - Die Schulter zieht nach oben Richtung Ohr, anstatt in einer stabilen, tiefen Position
    zu bleiben.
  - Die exzentrische Phase wird fallengelassen, statt den Griff kontrolliert zurückzuführen.
  - Das Handgelenk knickt ab oder der Griff wird verkrampft festgehalten, obwohl die
    Bewegung aus der Schulter kommen soll.
  - Zu weit in die Endposition zu drehen, obwohl die Spannung nur noch über Kompensation
    gehalten werden kann.
  - Den Oberarm nach vorn schieben oder das Schulterblatt nach vorn kippen lassen,
    statt den Humeruskopf zentriert zu kontrollieren.
