  common_errors:
  - Mit Kipping, Beinschwung oder Hüftschwung arbeiten statt jede Wiederholung aus
    dem Hang kontrolliert einzuleiten.
  - Aus einem passiven Hang hart anziehen, ohne zuerst Spannung im Schultergürtel
    aufzubauen.
  - Die Schultern zu den Ohren ziehen und damit Scapula-Depression und stabile Schultermechanik
    zu verlieren.
  - Nur das Kinn irgendwie über die Stange bringen, während Brustkorb, Schulterposition
    und Zuglinie kollabieren.
  - 'Halbe Wiederholungen machen: unten nicht ausstrecken oder oben zu früh abbrechen.'
  - Den Kopf nach vorne zur Stange schieben statt den Körper zur Stange zu ziehen.
  - Ins Hohlkreuz fallen oder die Rippen aufklappen lassen, wodurch der Rumpf instabil
    wird und die Kraftübertragung leidet.
  - Zu breit greifen und dadurch ROM, Schultermechanik und saubere Ellbogenführung
    unnötig verschlechtern.
