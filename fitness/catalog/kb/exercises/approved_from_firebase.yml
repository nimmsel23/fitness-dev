  common_errors:
  - Unvollständiger Bewegungsumfang (nicht ganz nach oben ziehen oder nicht ganz nach
    unten ablassen).
  - Schwungholen (Kipping) statt einer kontrollierten Muskelkontraktion.
  - Die Schultern hochziehen statt sie nach unten zu depressen und zu retrahieren
    (Shrugging).
  - Den Kopf überstrecken oder nach vorne schieben.
  name: Klimmzug (Obergriff)
  primary_muscles:
  - 201_latissimus_dorsi
  - 207_teres_major
  coaching_notes:
  - Beginne mit ausgestreckten Armen und greife die Stange etwas breiter als schulterbreit
    mit Obergriff (Handflächen zeigen von dir weg).
  - Ziehe dich nach oben, indem du deine Schulterblätter nach unten und hinten ziehst
    und deinen Rücken aktivierst, bis dein Kinn über der Stange ist.
  - Kontrolliere die Abwärtsbewegung, bis deine Arme wieder vollständig gestreckt
    sind. Vermeide Schwung.
  - Der Obergriff beansprucht den Latissimus dorsi stärker und den Bizeps etwas weniger
    als der Untergriff.
  - Halte den Körper während der gesamten Bewegung stabil und vermeide ein Schwingen.
