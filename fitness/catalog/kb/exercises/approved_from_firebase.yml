  coaching_notes:
  - Stellen Sie sich seitlich zum Kabelzug, sodass der arbeitende Arm weiter vom Turm
    entfernt ist, und positionieren Sie den Griff etwa auf Ellenbogenhöhe.
  - Ziehen Sie die Schulter sanft nach hinten unten und halten Sie das Schulterblatt
    ruhig, ohne es während der Bewegung nach vorn kippen zu lassen.
  - Klemmen Sie den Oberarm eng an den Körper und halten Sie den Ellenbogen konstant
    bei ungefähr 90 Grad Beugung.
  - Starten Sie aus der Innenrotation und drehen Sie den Unterarm kontrolliert nach
    außen, während Oberarm, Schulter und Rumpf stabil bleiben.
  - Bewegen Sie nur im Schultergelenk; denken Sie daran, den Oberarmkopf zentriert
    in der Pfanne zu halten statt Reichweite über Ausweichbewegungen zu erzwingen.
  - Arbeiten Sie mit leichtem bis moderatem Widerstand und einer sauberen Exzentrik,
    damit die Rotatorenmanschette die gesamte Bewegung kontrollieren kann.
  - Atmen Sie ruhig aus, wenn Sie nach außen rotieren, und spannen Sie Bauch und Rumpf
    leicht an, um ein Mitdrehen des Oberkörpers zu verhindern.
  - Beenden Sie die Wiederholung dort, wo Sie die Außenrotation noch ohne Schulterhochziehen,
    Hohlkreuz oder Ellbogenverlust sauber kontrollieren können.
