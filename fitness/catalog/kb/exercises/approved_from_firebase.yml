  - 'Stelle die Kabel so ein, dass der Zugwinkel zu der Brustregion passt, die du
    betonen willst: hoch nach tief eher sternal, mittig eher gesamter Brustkorb, tief
    nach hoch eher clavicular.'
  - Nimm eine stabile Split- oder Parallelstellung ein und richte Brustbein und Rippen
    kontrolliert auf, ohne ins Hohlkreuz zu fallen.
  - Halte die Ellbogen über die ganze Bewegung leicht gebeugt und behalte diesen Winkel
    konstant; die Bewegung kommt aus dem Schultergelenk, nicht aus aktivem Drücken
    mit dem Trizeps.
  - Führe die Griffe in einem weiten Bogen zusammen, als würdest du die Oberarme vor
    dem Brustkorb umarmen, statt die Hände einfach nur nach vorn zu schieben.
  - Lass die Brust in der Dehnung arbeiten, aber stoppe bevor die Schulter nach vorn
    kippt oder du Spannung im vorderen Schultergelenk verlierst.
  - Bringe die Hände vor dem Körper kontrolliert zusammen und halte die Endposition
    kurz, ohne die Schultern hochzuziehen oder den Nacken anzuspannen.
  - Halte den Rumpf ruhig und vermeide Rotation; beide Seiten sollen mit gleicher
    Bahn und gleicher Geschwindigkeit arbeiten.
  - Wähle ein Gewicht, bei dem du den Zielmuskel klar spürst und die exzentrische
    Phase sauber abbremsen kannst.
