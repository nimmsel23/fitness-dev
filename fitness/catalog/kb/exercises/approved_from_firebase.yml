  common_errors:
  - Die Bank zu steil einstellen, sodass die vordere Schulter die Hauptarbeit übernimmt
    und der Reiz auf der oberen Brust deutlich sinkt.
  - Die Schulterblätter beim Ablassen nach vorne kippen oder die Schultern hochziehen,
    was die vordere Schulter unnötig belastet.
  - Die Hanteln unten zu tief neben den Körper fallen lassen und dabei die passive
    Schulterbeweglichkeit statt aktive Kontrolle zu nutzen.
  - Die Ellenbogen starr im 90-Grad-Winkel abspreizen, wodurch die Schulter im unteren
    Abschnitt oft unnötig gestresst wird.
  - Die Hanteln oben gegeneinander schlagen oder Schwung aus dem Richtungswechsel
    holen, statt die exzentrische Phase kontrolliert zu führen.
  - Die Handgelenke nach hinten abknicken, sodass die Kraftlinie nicht mehr sauber
    über Unterarm und Hantel verläuft.
  - Mit den Füßen herumrutschen oder das Gesäß von der Bank lösen, um Wiederholungen
    künstlich leichter zu machen.
  - Zu kurz ablassen und dadurch den gedehnten unteren Arbeitsbereich der Brust fast
    vollständig verschenken.
