  schema_version: 2026-08-12.exercise-v1
  common_errors:
  - Die Hüfte schießt direkt vom Boden nach oben, während die Schultern zurückbleiben.
    Dadurch verlierst du den Beindruck im ersten Zug und die Stange driftet früh nach
    vorn.
  - Zu frühes Armziehen vor der vollständigen Beinstreckung nimmt der Bewegung Explosivität.
    Der Snatch wird dann ein Armzug statt einer kraftvollen Ganzkörperstreckung.
  - Die Stange wird im zweiten Zug vom Körper weggeschlagen. Das verlängert den Hebel,
    verschlechtert den Lockout über Kopf und macht den Catch instabil.
  - Es wird nach oben gesprungen, aber nicht aktiv unter die Hantel gezogen. Das Resultat
    ist ein zu hoher Catch, fehlende Tiefe und häufig ein Nachdrücken oder Verlieren
    nach vorn.
  - 'Im Catch fehlt aktiver Schultergürtel-Einsatz: Ellbogen bleiben weich, die Schulterblätter
    rotieren nicht sauber nach oben und die Hantel sinkt hinter oder vor die stabile
    Linie.'
  - Das Gewicht verlagert sich im Empfang auf die Zehen oder Fersen statt über den
    Mittelfuß. Dadurch wird die Überkopfkniebeuge wackelig und die Hantelbahn schwer
    kontrollierbar.
  - Der Blick geht zu früh hoch oder der Brustkorb kollabiert in der tiefen Position.
    Beides verschlechtert die Rumpfspannung und destabilisiert die Hantel über Kopf.
