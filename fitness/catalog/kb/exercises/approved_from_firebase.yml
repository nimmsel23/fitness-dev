      coaching_notes:
      - 'Schritte:


        Befestige zunächst ein Widerstandsband um einen Pfosten oder an einer sicheren
        Position, an der es sich nicht löst und auf Ellbogenhöhe liegt.

        Stelle dich seitlich zum Band und greife mit der Hand, die dem Band gegenüberliegt,
        nach dem Griff.

        Führe das Band zu deiner Brust, halte deinen Ellbogen in einem 90-Grad-Winkel
        gebeugt und rotiere dann langsam deinen Arm in einer Rückhandbewegung, sodass
        das Band nach außen rotiert.

        Führe die Bewegung so weit wie möglich nach außen aus, sodass du eine Dehnung
        in deinen Schultern spürst, halte einen Moment und kehre dann in die Ausgangsposition
        zurück.

        Wiederhole dies für so viele Wiederholungen und Sätze wie gewünscht.'
