  common_errors:
  - Zu viel Gewicht zu wählen und den Satz mit Schwung aus dem Oberkörper oder mit
    einem Rücklehnen abzuschließen, statt die Zugbewegung muskulär zu kontrollieren.
  - Die Ellbogen absinken zu lassen, wodurch die Bewegung mehr zu einem normalen Rudern
    wird und der Reiz auf hintere Schulter und Außenrotatoren deutlich sinkt.
  - Das Seil nur zur Nase zu ziehen, ohne die Hände in der Endposition auseinanderzuführen;
    dadurch geht ein wesentlicher Teil der Außenrotation verloren.
  - Die Schultern zu den Ohren hochzuziehen, statt den Nacken lang zu halten und die
    Schulterblätter kontrolliert nach hinten-unten arbeiten zu lassen.
  - Den unteren Rücken zu überstrecken oder die Rippen aufzufächern, um mehr Bewegungsweg
    vorzutäuschen; halten Sie Rumpf und Becken stabil.
  - Die exzentrische Phase fallen zu lassen und die Spannung zwischen den Wiederholungen
    komplett zu verlieren, anstatt die Rückführung bewusst zu bremsen.
  - Den Kabelzug zu tief einzustellen, sodass der Bewegungswinkel nicht mehr zur Zielmuskulatur
    passt und die Übung biomechanisch eher zu einem tiefen Ruderzug wird.
