      - 'Once you are standing completely straight up, lower the bar by pushing the
        hips back, only slightly bending the knees, unlike when squatting. Tip: Take
        a deep breath at the start of the movement and keep your chest up. Hold your
        breath as you lower and exhale as you complete the movement.'
      - Repeat for the recommended amount of repetitions.
