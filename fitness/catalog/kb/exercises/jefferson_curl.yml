  coaching_notes:
  - Langsam und maximal kontrolliert ausführen; das ist Mobilitäts- und Kontrollarbeit, kein Ego-Lift.
  - Starte mit neutralem Kopf und rolle Wirbel für Wirbel nach vorne ab.
  - Halte die Last nah am Körper und gehe nur bis zur kontrollierbaren Dehngrenze.
  - Rolle auch auf dem Rückweg segmental auf, statt aus Hüfte oder Schwung hochzureißen.
  common_errors:
  - Zu schnell abrollen und passive Endrange erzwingen.
  - Schmerz, Kribbeln oder Nervenzug ignorieren.
  - Mit steifem Rücken aus der Hüfte klappen statt segmental zu flektieren.
  - Zu früh Zusatzgewicht nutzen, bevor unbelastete Kontrolle vorhanden ist.
