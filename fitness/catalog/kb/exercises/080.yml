  coaching_notes:
  - Stange über dem Mittelfuß starten und während des gesamten Zugs eng am Körper führen.
  - Vor dem Abheben Bracing setzen und die Lat-Spannung aktiv aufbauen.
  - Hüfte und Schultern steigen gemeinsam; die Bewegung ist kein ungewollter Stiff-Leg-Deadlift.
  - Den Boden wegdrücken, dann Hüfte durchstrecken; oben nicht in Hyperextension lehnen.
  common_errors:
  - Rücken rund machen, bevor die Stange den Boden verlässt.
  - Hüfte schießt zuerst hoch und der Zug wird zum Rückenheben.
  - Stange driftet vom Schienbein weg und vergrößert den Hebelarm.
  - Lockout durch Zurücklehnen statt saubere Hüftstreckung.
