  coaching_notes:
  - Stelle die Füße so, dass die Stange über dem Mittelfuß liegt; die Schienbeine
    kommen erst nach dem Setup leicht an die Stange.
  - 'Baue vor dem Abheben Ganzkörperspannung auf: tief in Bauch und Flanken einatmen,
    den Rumpf zirkulär anspannen und die Achseln aktiv ''schließen'', damit die Lat-Spannung
    die Stange am Körper hält.'
  - Ziehe das Spiel aus der Stange, bevor das Gewicht den Boden verlässt; der erste
    Zug ist Druck in den Boden, nicht ein ruckartiges Hochreißen mit dem Rücken.
  - Hüfte und Schultern sollen in der Startphase gemeinsam steigen, sodass der Rückenwinkel
    bis knapp unter Kniehöhe weitgehend stabil bleibt.
  - Führe die Stange in einer geraden, engen Bahn über Schienbein und Oberschenkel;
    je näher die Last am Körperschwerpunkt bleibt, desto sauberer ist die Hebelmechanik.
  - Beende die Wiederholung mit vollständiger Hüftstreckung und aufgerichtetem Körper,
    ohne ins Hohlkreuz zu fallen oder die Rippen nach vorne zu schieben.
  - Senke die Stange kontrolliert über die Hüfte ein, halte die Spannung bis zum Boden
    und starte jede Wiederholung aus einer sauber neu aufgebauten Position.
  common_errors:
  - Die Hüfte schießt beim Start zuerst hoch, wodurch aus dem Zug vom Boden ein ineffizientes
    Rückenheben wird.
  - Der Rücken verliert vor dem Abheben oder direkt vom Boden weg die Spannung und
    rundet insbesondere in der Lendenwirbelsäule ein.
  - Die Stange driftet vom Körper weg, was den Hebelarm vergrößert und den Zug unnötig
    schwer macht.
  - Es wird ohne sauberes Bracing angerissen, statt erst Spannung in Rumpf, Lat und
    Griff aufzubauen.
  - Die Knie werden zu früh nach hinten genommen, sodass die Stange um die Knie herumgeführt
    werden muss statt geradlinig aufzusteigen.
  - Der Lockout wird durch Zurücklehnen und Überstrecken der Lendenwirbelsäule erzwungen
    statt durch eine saubere Hüftstreckung abgeschlossen.
  - Die exzentrische Phase wird fallengelassen oder ungeordnet abgesenkt, wodurch
    Position, Spannung und Reproduzierbarkeit der nächsten Wiederholung verloren gehen.
