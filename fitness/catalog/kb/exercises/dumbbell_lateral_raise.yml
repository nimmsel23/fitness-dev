  coaching_notes:
  - Stehe stabil mit leicht gebeugten Knien und fixiere den Rumpf, damit die Bewegung
    nicht aus Schwung oder Oberkoerperpendeln entsteht.
  - Fuehre die Hanteln seitlich in der Skapularebene nach oben, die Ellbogen bleiben
    leicht gebeugt und fuehren die Bewegung.
  - Hebe nur bis etwa Schulterhoehe. Hoeher wird der obere Trapezius dominant und
    die Schulterposition oft unguenstiger.
  - Halte Handgelenke neutral bis minimal oberhalb der Ellbogen. Vermeide bewusstes
    "Wasser-ausgiessen" mit starker Innenrotation.
  - Senke die Hanteln langsam und kontrolliert ab, statt sie in die Ausgangsposition
    fallen zu lassen.
  common_errors:
  - Zu hohe Last, wodurch Schwung, Ruecklage oder Schulterzucken die Zielmuskulatur
    uebernehmen.
  - Hochziehen der Schultern Richtung Ohren, wodurch der obere Trapezius statt der
    seitliche Deltoid dominiert.
  - Komplett gestreckte Ellbogen oder abknickende Handgelenke, was Hebel und Gelenkbelastung
    unguenstig veraendert.
  - Arme deutlich ueber Schulterhoehe heben und dadurch Spannung vom lateralen Deltoid
    verlieren.
