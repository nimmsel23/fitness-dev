  coaching_notes:
  - Arme in leichter Beugung halten (ca. 15–20° Flexion), nicht völlig gestreckt
  - Die Bewegung aus der Brust initiieren — nicht aus den Schultern
  - Oben kurz halten für Peak-Kontraktion und Squeeze in der Brust
  - Kontrollierte negative Phase — nicht einfach zurückschnappen lassen
  - Schulterstabilität bewahren, Schulterblatt nicht nach vorn kippen
  - Ideal nach schweren Brust-Compounds (Bench Press, Incline) als Finisher
  common_errors:
  - Zu viel Gewicht — kompromittiert die Form und verlagert Arbeit auf Schultern
  - Arme zu weit öffnen/zurückbringen — reduziert Spannung in der Brust
  - Arme völlig gestreckt — verliert Muskelverspannung und belastet Ellenbogengelenk
  - Zu schnelle, ruckartige Bewegung — Schwung statt Muskelarbeit
  - Kopf nach vorn kippen oder Oberkörper runden — beeinträchtigt Core-Stabilität
