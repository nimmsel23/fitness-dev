  coaching_notes:
  - Ellbogen bleiben hoch; sobald sie fallen, rollt die Stange nach vorne und der Squat kippt.
  - Aufrechter Torso, Knie kontrolliert nach vorne und über die Zehen führen.
  - Druck über Mittelfuß/Ganzfuß halten, Fersen bleiben am Boden.
  - Bracing vor jeder Wiederholung setzen; Bauchspannung hält die Front-Rack-Position stabil.
  - Tiefe nur so weit, wie Sprunggelenk, Hüfte und Rückenposition sauber bleiben.
  common_errors:
  - Ellbogen fallen lassen und dadurch in eine Good-Morning-Position kippen.
  - Knie kollabieren nach innen statt über den Zehen zu laufen.
  - Fersen heben ab, weil Sprunggelenk-Dorsiflexion oder Lastposition fehlen.
  - Untere Position rebounden, ohne Rumpfspannung und Kniekontrolle zu halten.
