  coaching_notes:
  - Stelle das Polster so ein, dass das Kniegelenk frei beugen kann und die Last nicht am Sprunggelenk hebelt.
  - Halte Hüfte und Becken fest am Polster; wenn die Hüfte abhebt, ist der Satz technisch vorbei.
  - Beuge kontrolliert bis zur aktiven Peak-Kontraktion und senke langsam in die Dehnung zurück.
  - Nutze Dorsalflexion neutral bis leicht aktiv, wenn du den Hamstring-Fokus halten willst.
  common_errors:
  - Schwung aus Hüfte oder Rücken statt kontrollierter Kniebeugung.
  - Gewicht abwerfen und die exzentrische Dehnphase verlieren.
  - Zu wenig ROM oder fehlende Peak-Kontraktion.
  - Wadenkrampf durch zu starkes Zehenspitzenziehen oder schlecht eingestellte Rolle.
