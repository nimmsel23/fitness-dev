  coaching_notes:
  - Der Hüftschwung erzeugt Momentum aus den Beinen - dies ist eine Power-Bewegung
  - Tiefe Kniebeugen vor dem Drücken sind essentiell, um die Kraft aus den Quadrizeps
    und Glutes zu nutzen
  - Starke Kernspannung während der gesamten Bewegung bewahren, kein Hohlkreuz
  - Die Arme sollten die Bewegung vollständig ausbremsen, nicht nur leiten
  - Diese Variante ist ideal für Kraftentwicklung, aber der reguläre Schulterdruck
    trainiert die Schultermuskulatur isolierter
  common_errors:
  - Zu viel Rückenbiegung in der Lendenwirbelsäule - Kern anspannen
  - Knie nicht ausreichend nutzen - der Schwung sollte aus einer echten Kniebeugen-Position
    kommen
  - Unkontrollierte oder zu aggressive Hüftbewegung
  - Arme nicht in volle Streckung am Ende der Bewegung
  - Kopf nach hinten neigen statt neutral zu halten
