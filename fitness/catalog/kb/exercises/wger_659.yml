  coaching_notes:
  - Stellen Sie sich etwa einen halben Schritt vom Kabelturm entfernt auf, Brustbein
    angehoben, Knie leicht gebeugt und den Rumpf aktiv gespannt. Die Ausgangsposition
    soll stabil sein, ohne dass Sie ins Hohlkreuz ausweichen.
  - Greifen Sie das Seil neutral und ziehen Sie die Ellbogen dicht an die Flanken.
    Entscheidend ist, dass die Oberarme während des gesamten Satzes nahezu unbeweglich
    bleiben und nur das Ellbogengelenk arbeitet.
  - Beginnen Sie jede Wiederholung aus einer kontrollierten Dehnung, ohne dass die
    Schultern nach vorn kippen. Drücken Sie das Seil dann nach unten, bis die Ellbogen
    vollständig gestreckt sind.
  - Am unteren Endpunkt die Seilenden leicht nach außen führen und die Trizepse bewusst
    hart anspannen. Diese kleine Abspreizbewegung erhöht oft das Kontraktionsgefühl,
    darf aber nicht aus einer Schulterrotation entstehen.
  - Lassen Sie das Gewicht langsam und kontrolliert zurücklaufen, sodass die Unterarme
    zur Ausgangsposition aufsteigen, ohne dass die Ellbogen nach vorn wandern. Die
    exzentrische Phase sollte aktiv gebremst werden.
  - Wählen Sie ein Gewicht, das volle Streckung und saubere Ellbogenführung erlaubt.
    Bei dieser Übung ist konstante Spannung und präzise Isolation wertvoller als hohe
    Last.
  common_errors:
  - Zu viel Gewicht verwenden und das Kabel mit Oberkörper-Schwung nach unten drücken,
    statt die Bewegung sauber aus dem Ellbogen zu erzeugen.
  - Die Ellbogen nach außen oder nach vorn wandern lassen, wodurch Spannung vom Trizeps
    verloren geht und Schulter sowie Brust stärker mithelfen.
  - Nur den halben Bewegungsradius trainieren und die Ellbogen unten nicht vollständig
    strecken, wodurch ein großer Teil der Endkontraktion verloren geht.
  - Am oberen Punkt das Gewicht einfach hochschnellen lassen, statt die Rückführung
    kontrolliert zu bremsen und die Dehnung aktiv mitzunehmen.
  - Die Handgelenke stark abknicken oder einrollen, wodurch Unterarme und Griff unnötig
    überlastet werden und die Kraftübertragung schlechter wird.
  - Die Schultern hochziehen oder nach vorn fallen lassen, was die Nacken- und Schulterspannung
    erhöht und die Übung instabil macht.
