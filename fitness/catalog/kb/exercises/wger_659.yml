  display_name: Trizeps Seildrücken
  german: Trizeps Seildrücken
  english: Rope Triceps Pushdown
  category: strength
  equipment:
  - cable
  primary_muscles:
  - 401a_triceps_long_head
  - 401b_triceps_lateral_head
  - 401c_triceps_medial_head
  secondary_muscles: []
  stabilizers:
  - 203_trapezius_middle
  - 205_rhomboids
  - 501_rectus_abdominis
  - 504_transverse_abdominis
  movement_pattern: elbow_extension
  coaching_notes:
  - Positionieren Sie sich mit leicht gebeugten Knien und einem kleinen Schritt vom
    Kabelturm entfernt. Lehnen Sie sich leicht nach vorne, um eine stabile Basis zu
    schaffen.
  - Fassen Sie das Seil mit einem neutralen Griff (Handflächen zueinander) und halten
    Sie die Ellbogen eng am Körper, direkt unter den Schultern.
  - Strecken Sie die Unterarme vollständig nach unten, indem Sie die Trizepse bewusst
    anspannen. Ziehen Sie dabei die Enden des Seils leicht auseinander, um eine maximale
    Kontraktion zu erreichen.
  - Halten Sie die Oberarme während der gesamten Bewegung fixiert und konzentrieren
    Sie sich darauf, die Bewegung ausschließlich aus dem Ellbogengelenk auszuführen.
  - Führen Sie die exzentrische Phase (Rückführung des Seils nach oben) langsam und
    kontrolliert aus, um die Trizepse unter Spannung zu halten und eine volle Dehnung
    zu ermöglichen.
  common_errors:
  - Verwenden von zu viel Gewicht, was zu einem Schwung aus dem Oberkörper oder den
    Schultern führt und die Isolation der Trizepse reduziert.
  - Abspreizen der Ellbogen vom Körper, wodurch die Spannung auf die Trizepse verringert
    und andere Muskeln unnötig belastet werden.
  - Unvollständige Streckung der Arme am tiefsten Punkt, was eine volle Trizeps-Kontraktion
    verhindert.
  - Die Aufwärtsbewegung zu schnell ausführen, wodurch das Training der exzentrischen
    Muskelphase vernachlässigt wird und das Verletzungsrisiko steigt.
