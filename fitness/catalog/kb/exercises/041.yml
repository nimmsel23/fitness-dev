  coaching_notes:
  - Stelle die Bank auf etwa 30-45 Grad ein; je steiler der Winkel, desto mehr übernimmt die vordere Schulter.
  - Ziehe die Schulterblätter vor dem ersten Rep nach hinten und unten und halte die Brust aktiv.
  - Senke die Kurzhanteln kontrolliert bis knapp neben die obere Brust, ohne die Schulter nach vorne kippen zu lassen.
  - Drücke in einer leicht bogenförmigen Linie nach oben und stoppe kurz vor dem harten Ellenbogen-Lockout.
  - Halte Füße, Gesäß und oberen Rücken stabil aufgesetzt; ein extremes Hohlkreuz verfälscht den Reiz.
  common_errors:
  - Zu steiler Bankwinkel, wodurch aus der Übung fast Schulterdrücken wird.
  - Schultern am unteren Punkt nach vorne rollen lassen.
  - Hanteln unkontrolliert fallen lassen oder oben gegeneinander schlagen.
  - Ellenbogen zu weit nach außen spreizen und dadurch die Schulter unnötig stressen.
