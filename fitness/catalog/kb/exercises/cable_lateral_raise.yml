  - 501_rectus_abdominis
  - 203_trapezius_middle
  - 204_trapezius_lower
  coaching_notes:
  - Halte eine leichte, aber fixe Beugung (ca. 10-20°) in den Ellbogen. Diese Armposition
    bleibt während der gesamten Bewegung statisch.
  - Führe die Bewegung bewusst mit den Ellbogen an. Die Hände und Handgelenke bleiben
    neutral und stabil, ohne zu rotieren oder zu knicken.
  - Positioniere den Seilzug so, dass der Widerstand optimal auf den seitlichen Deltoid
    wirkt – idealerweise auf Knie- oder Hüfthöhe.
  - Hebe das Gewicht kontrolliert und ohne jeglichen Schwung seitlich bis auf Schulterhöhe
    an.
  - Halte die Spitzenkontraktion oben für eine Sekunde, um die Muskelspannung zu maximieren.
  - Lasse das Gewicht langsam und hochkontrolliert in der negativen Phase ab, um die
    Spannung im Muskel aufrechtzuerhalten und den vollen Bewegungsumfang zu nutzen.
  - Halte die Schultern während der gesamten Ausführung stabil und unten, um ein Hochziehen
    (Shrug) und eine Überaktivierung des oberen Trapezius zu verhindern.
  - Spann deinen Rumpf an und halte den Oberkörper aufrecht und absolut stabil, um
    jegliche Kompensation zu vermeiden.
  common_errors:
  - Verwendung von zu hohem Gewicht, was zu Schwung, einem Hochziehen der Schultern
    (Shrug) oder Kompensation durch den Oberkörper führt.
  - Ein zu starkes Nach-hinten-Lehnen oder Schwingen des Oberkörpers, um die Bewegung
    zu erleichtern.
  - Die Ellbogen unter die Höhe der Handgelenke fallen lassen, was den Hebel verändert
    und die Belastung vom seitlichen Deltoid nimmt.
  - Die Arme über Schulterhöhe hinaus heben, was die Rotatorenmanschette unnötig belastet
    und die Spannung vom Zielmuskel reduziert.
  - Zu schnelle, ruckartige und unkontrollierte Bewegungen, die den Trainingseffekt
    mindern und das Verletzungsrisiko erhöhen.
  - Eine ungewollte Innen- oder Außenrotation des Arms oder Unterarms, die die Last
    vom seitlichen Deltoid nimmt und die Schulter unnötig belastet.
