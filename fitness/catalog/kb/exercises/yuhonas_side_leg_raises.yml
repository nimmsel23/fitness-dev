  coaching_notes:
  - Stand next to a chair, which you may hold onto as a support. Stand on one leg.
    This will be your starting position.
  - Keeping your leg straight, raise it as far out to the side as possible, and swing
    it back down, allowing it to cross the opposite leg.
  - Repeat this swinging motion 5-10 times, increasing the range of motion as you
    do so.
