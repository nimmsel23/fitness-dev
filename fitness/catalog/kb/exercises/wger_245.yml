  coaching_notes:
  - Lege dich auf eine flache Hantelbank, die Füße fest auf dem Boden. Nimm die Kurzhanteln
    in einen neutralen Griff (Handflächen zueinander) oder Obergriff (Handflächen
    zu den Füßen) und strecke die Arme senkrecht über deiner Brust aus.
  - Für eine intensivere Dehnung der langen Trizeps-Kopfes kann der Kopf leicht über
    das Ende der Bank hinausragen, um die Hanteln tiefer hinter den Kopf senken zu
    können.
  - Senke die Kurzhanteln langsam und kontrolliert durch Beugen der Ellenbogen in
    einem Bogen in Richtung Stirn oder leicht hinter den Kopf. Halte die Oberarme
    dabei relativ ruhig und fixiert.
  - Drücke die Hanteln über die Kraft deiner Trizeps zurück in die Ausgangsposition,
    strecke die Ellenbogen vollständig durch und spanne den Trizeps am obersten Punkt
    fest an.
  - Atme während des Absenkens ein und beim Hochdrücken aus.
  - Halte die Ellenbogen während der gesamten Bewegung stabil und versuche, sie nicht
    übermäßig nach außen spreizen zu lassen.
  common_errors:
  - '**Abspreizen der Ellenbogen:** Wenn die Ellenbogen zu stark nach außen zeigen,
    wird der Trizeps weniger effektiv trainiert und die Schultergelenke können unnötig
    belastet werden.'
  - '**Miteinsatz des Oberarms:** Wenn die Oberarme mitbewegt werden (Schultergelenk
    beugt sich mit), wird die Übung zu einem engen Bankdrücken, was die Trizeps-Isolation
    reduziert. Die Oberarme sollten so fixiert wie möglich bleiben.'
  - '**Zu hohes Gewicht:** Die Verwendung von zu schweren Gewichten führt oft zu unsauberer
    Technik, verkürztem Bewegungsumfang und erhöhtem Verletzungsrisiko für Ellenbogen
    und Schultern.'
  - '**Unvollständiger Bewegungsumfang:** Wenn die Ellenbogen nicht ausreichend gebeugt
    werden (beim Absenken) oder nicht vollständig gestreckt werden (beim Hochdrücken),
    wird der volle Trainingseffekt des Trizeps reduziert.'
  - '**Hohlkreuz:** Ein übermäßiges Hohlkreuz auf der Bank kann den unteren Rücken
    belasten. Die Bauchmuskulatur sollte angespannt werden, um den Rumpf zu stabilisieren.'
