  - 501_rectus_abdominis
  emphasis_muscles:
  - 601c_vastus_medialis
  coaching_notes:
  - Richte Kniegelenk und Drehachse der Maschine sauber aus, bevor du Last auflegst.
  - Strecke kontrolliert bis kurz vor harte Hyperextension und halte oben kurz aktive Quadrizepsspannung.
  - Führe die exzentrische Phase langsam zurück, statt das Gewicht in den Stack fallen zu lassen.
  - Halte Hüfte und Rücken fest am Sitz; Bewegung kommt aus dem Knie, nicht aus Schwung oder Hüftheben.
  common_errors:
  - Zu viel Gewicht und dadurch Schwung statt sauberer Knieextension.
  - Unvollständige ROM, besonders fehlende kontrollierte Endstreckung.
  - Knie kippen nach innen oder außen, statt in Linie mit Hüfte und Fuß zu bleiben.
  - Hüfte hebt vom Sitz ab und nimmt Spannung aus dem Quadrizeps.
