  coaching_notes:
  - Greife schulterbreit bis leicht enger im Untergriff; Handflächen zeigen zu dir.
  - Starte aus aktivem Hang mit Schulterdepression, nicht aus passiv hochgezogenen Schultern.
  - Ziehe Ellenbogen nach unten und leicht nach hinten, bis das Kinn sauber über die Stange kommt.
  - Senke kontrolliert bis zur vollen Streckung, ohne unten Spannung komplett zu verlieren.
  - Halte Rippen und Becken stabil, damit der Zug nicht in Schwung oder Hohlkreuz kippt.
  common_errors:
  - Schwung aus Hüfte oder Beinen statt kontrolliertem vertikalem Zug.
  - Nur das Kinn nach vorne schieben, statt Brust und Rücken aktiv Richtung Stange zu bewegen.
  - Zu breiter Untergriff, wodurch Handgelenk und Ellenbogen unnötig belastet werden.
  - Halbe Wiederholungen unten oder oben, wodurch Lat- und Bizepsreiz verloren gehen.
