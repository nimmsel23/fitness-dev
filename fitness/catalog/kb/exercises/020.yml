  coaching_notes:
  - Starte im aktiven Hang mit langem Körper und zieh die Schulterblätter zuerst nach unten.
  - Zieh die Ellenbogen Richtung Hüfte, nicht nur das Kinn irgendwie über die Stange.
  - Nutze volle ROM: unten kontrolliert strecken, oben Brust Richtung Stange.
  - Halte Rippen und Becken stabil, damit der Zug nicht in Schwung oder Hohlkreuz kippt.
  - Obergriff verschiebt den Fokus stärker auf Latissimus/oberen Rücken und etwas weg vom Bizeps im Vergleich zum Chin-Up.
  common_errors:
  - Kipping oder Beinschwung statt kontrollierter vertikaler Zug.
  - Schultern zu den Ohren ziehen und ohne Scapula-Depression starten.
  - Halbe Wiederholungen unten oder oben, wodurch Lat-Stretch und Abschluss fehlen.
  - Kopf nach vorne schieben, statt Brust und Rückenarbeit zur Stange zu bringen.
