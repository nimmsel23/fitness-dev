  coaching_notes:
  - Stelle beide Kabel auf die unterste Position und wähle ein Gewicht, das dir eine
    saubere Bogenbewegung ohne Schwung erlaubt.
  - Nimm eine stabile Schrittstellung ein, richte das Brustbein auf und halte den
    Rumpf aktiv, damit die Bewegung aus dem Schultergelenk und nicht aus dem unteren
    Rücken kommt.
  - Greife die Griffe mit leicht gebeugten Ellbogen und behalte diesen Ellbogenwinkel
    über die gesamte Wiederholung nahezu konstant.
  - Starte mit den Händen leicht hinter der Körperlinie, um die Brust unter Dehnung
    zu bringen, ohne die Schulter nach vorn kippen zu lassen.
  - Führe die Arme in einem weiten Bogen von unten außen nach oben innen, als würdest
    du die Oberarme vor dem oberen Brustkorb zusammenführen.
  - Denke daran, die Oberarme zueinander zu bewegen, statt die Griffe mit den Händen
    nach oben zu ziehen; so bleibt die Zielspannung auf der oberen Brust.
  - Am Endpunkt dürfen sich die Hände auf Höhe des oberen Brustkorbs oder leicht darunter
    treffen, ohne dass die Schultern nach oben gezogen werden.
  - Halte die Endkontraktion kurz, spanne die obere Brust bewusst an und lass die
    Griffe anschließend kontrolliert in die Dehnung zurücklaufen.
  - Begrenze die Range of Motion, sobald du vorne nur noch Schultervorschub statt
    zusätzlicher Brustspannung erzeugst.
  - Atme beim Zusammenführen aus und beim kontrollierten Zurückführen ein, um Rumpfspannung
    und Bewegungsrhythmus sauber zu halten.
  common_errors:
  - Zu viel Gewicht, wodurch aus der geführten Fly-Bewegung ein unsauberes Ziehen
    oder Drücken mit Schwung wird.
  - Die Ellbogen während der Wiederholung stark beugen oder strecken, wodurch Bizeps
    und Trizeps unnötig viel Arbeit übernehmen.
  - Die Schultern zu den Ohren hochziehen, statt die Schulterblätter kontrolliert
    und ruhig zu halten.
  - Ins Hohlkreuz ausweichen, um die Griffe höher zu bekommen, anstatt die Spannung
    in der oberen Brust sauber zu erzeugen.
  - Die Hände aktiv übereinander schlagen lassen und dadurch vorne die Spannung zu
    verlieren.
  - Die exzentrische Phase abkürzen und die Gewichte einfach zurückziehen lassen,
    statt die Dehnung kontrolliert zu nutzen.
  - Zu tief oder zu weit hinter den Körper öffnen, obwohl die Schulterposition dabei
    instabil oder unangenehm wird.
  - Die Bewegung aus den Händen zu denken, statt die Oberarme diagonal nach innen
    oben zu führen.
  - Den Kopf nach vorn schieben oder den Oberkörper stark mitdrehen, wodurch die Übung
    an Isolation verliert.
  - Eine zu hohe Kabelposition wählen, wodurch der Zugwinkel eher zu einer normalen
    Fly-Variante als zur oberen-Brust-Betonung passt.
