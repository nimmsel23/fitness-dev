  coaching_notes:
  - Stellen Sie das Kabel so ein, dass es sich auf Schulter- oder Kopfhöhe befindet.
  - Fassen Sie das Seil mit einem Oberhandgriff und ziehen Sie es in Richtung Ihres
    Gesichts.
  - Konzentrieren Sie sich darauf, die Schulterblätter zusammenzuziehen und die Schultern
    nach außen zu rotieren.
  - Halten Sie die Ellbogen hoch und nach außen, über dem Handgelenk, um die Zielmuskulatur
    optimal zu aktivieren.
  common_errors:
  - Zu viel Gewicht verwenden, was zu Schwung führt und die Form beeinträchtigt.
  - Die Ellbogen zu tief halten, wodurch der Fokus von den hinteren Schultern und
    dem oberen Rücken abweicht.
  - Den Rücken übermäßig runden oder überstrecken; halten Sie den Oberkörper stabil.
