# Biomechanical Consistency Rules
# Maps movement patterns to required or expected primary muscles.

movement_pattern_rules:
  horizontal_press:
    required_primary: [chest, 101_pectoralis_major, 102_pectoralis_major_clavicular, 103_pectoralis_major_sternal]
    description: "Horizontal pressing should target the chest."
  
  vertical_press:
    required_primary: [shoulders, 301_anterior_deltoid, 302_lateral_deltoid]
    description: "Vertical pressing should target the shoulders."
    
  vertical_pull:
    required_primary: [back, upper_back, 201_latissimus_dorsi]
    description: "Vertical pulling should target the lats/back."
    
  horizontal_pull:
    required_primary: [back, middle_back, rhomboids, 203_trapezius_middle, 204_trapezius_lower, 205_rhomboids, 201_latissimus_dorsi]
    description: "Horizontal pulling (rows) should target the back (lats, trapezius, rhomboids)."
    
  squat:
    required_primary: [quadriceps, legs, 601_quadriceps_femoris]
    description: "Squat patterns should target the quadriceps."
    
  hinge:
    required_primary: [glutes, hamstrings, lower_back, 603_gluteus_maximus, 604_biceps_femoris, 206_erector_spinae]
    description: "Hinge patterns (deadlifts) should target the posterior chain."

isolation_rules:
  max_primary_muscles: 2
  description: "Isolation exercises should usually target only 1 or 2 primary muscles."
