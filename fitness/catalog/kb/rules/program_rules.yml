program_rules:
  default_split: full_body
  max_sessions_per_week: 4
  coverage_defaults:
    sets: 1
    rpe: 8
  templates:
    push_day:
      slots:
        # 041 = einziger noch gueltige Expert-ID (User-approved). Restliche
        # choose_from-Eintraege sind Bulk-Fallback (wger_*/yuhonas_*,
        # unreviewed) - keine Expert-Alternative existiert aktuell im Katalog,
        # nur so bleibt der Slot ueberhaupt befuellbar. Bei Katalog-Kuration
        # durch Expert-IDs ersetzen, sobald vorhanden.
        - name: main_chest_press
          choose_from:
            - 041
            - wger_1788
        - name: secondary_press
          choose_from:
            - yuhonas_incline_dumbbell_press
            - yuhonas_seated_dumbbell_press
        - name: shoulder_press_or_raise
          choose_from:
            - wger_687
            - wger_1580
        - name: chest_isolation
          choose_from:
            - wger_1689
            - wger_1425
        - name: triceps_isolation
          choose_from:
            - wger_1185
            - wger_1781
    pull_day:
      slots:
        # 020/021 = Expert-IDs (User-approved), bleiben erste Wahl. Rest Bulk-Fallback.
        - name: vertical_pull
          choose_from:
            - 020
            - 021
        - name: horizontal_pull
          choose_from:
            - wger_448
            - iso_lateral_row_high
        - name: secondary_row_or_pulldown
          choose_from:
            - wger_1466
            - wger_1785
        - name: rear_delt_or_face_pull
          choose_from:
            - face_pull
            - wger_222
        - name: biceps_movement
          choose_from:
            - yuhonas_dumbbell_bicep_curl
            - yuhonas_machine_bicep_curl
    legs_day:
      slots:
        # 061/080/081/402 = Expert-IDs (User-approved), bleiben erste Wahl. Rest Bulk-Fallback.
        - name: main_squat
          choose_from:
            - 061
            - yuhonas_barbell_squat
        - name: main_hinge
          choose_from:
            - 081
            - 080
        - name: unilateral_or_machine
          choose_from:
            - wger_1692
            - yuhonas_leg_press
        - name: hamstring_isolation
          choose_from:
            - 402
            - yuhonas_lying_leg_curls
        - name: calves
          choose_from:
            - wger_1422
            - yuhonas_donkey_calf_raises
        - name: core_optional
          choose_from:
            - plank
            - wger_167
