<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>anatomy-kb</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0f1117;
    --bg2:    #181c25;
    --card:   #1e2330;
    --line:   #2a2f3d;
    --ink:    #e8ecf4;
    --muted:  #6b7591;
    --accent: #5eeacc;
    --red:    #f87171;
    --yellow: #fbbf24;
    --green:  #34d399;
  }

  body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.6; }

  .shell { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }

  /* Header */
  .hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .hdr-title { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
  .hdr-sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .15em; margin-top: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot-red   { background: var(--red); }
  .dot-grey  { background: var(--muted); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--line); padding-bottom: 0; }
  .tab { padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; color: var(--muted); background: transparent; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .card + .card { margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width:600px) { .grid2 { grid-template-columns: 1fr; } }

  /* Labels */
  .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .2em; color: var(--muted); margin-bottom: 8px; }

  /* Stats */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat-val { font-size: 24px; font-weight: 800; color: var(--accent); }
  .stat-key { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .15em; color: var(--muted); text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg2); }

  /* Score bar */
  .bar-wrap { width: 80px; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width .3s; }

  /* Badges */
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .badge-accent { background: rgba(94,234,212,.12); color: var(--accent); border: 1px solid rgba(94,234,212,.25); }
  .badge-red    { background: rgba(248,113,113,.12); color: var(--red);    border: 1px solid rgba(248,113,113,.25); }
  .badge-yellow { background: rgba(251,191,36,.12);  color: var(--yellow); border: 1px solid rgba(251,191,36,.25); }
  .badge-muted  { background: var(--bg2); color: var(--muted); border: 1px solid var(--line); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: rgba(94,234,212,.15); color: var(--accent); border: 1px solid rgba(94,234,212,.3); }
  .btn-primary:hover:not(:disabled) { background: rgba(94,234,212,.22); }
  .btn-ghost { background: var(--bg2); color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

  /* SQL */
  textarea { width: 100%; background: var(--bg2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; resize: vertical; outline: none; }
  textarea:focus { border-color: var(--accent); }

  /* Error */
  .error { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.25); border-radius: 10px; padding: 10px 12px; color: var(--red); font-size: 13px; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin .7s linear infinite; display: inline-block; }

  /* Mono */
  .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }

  /* Freq bar gradient */
  .freq-bar { height: 4px; border-radius: 99px; margin-top: 4px; background: linear-gradient(90deg, var(--accent), var(--green)); }

  .empty { color: var(--muted); font-size: 13px; padding: 24px; text-align: center; }
</style>
</head>
<body>
<div class="shell" x-data="app()" x-init="init()">

  <!-- Header -->
  <div class="hdr">
    <div>
      <div class="hdr-title">
        <span class="dot" :class="health === true ? 'dot-green' : health === false ? 'dot-red' : 'dot-grey'"></span>
        anatomy-kb
      </div>
      <div class="hdr-sub">Knowledge Layer · :9200</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span x-show="syncMsg" x-text="syncMsg" style="font-size:12px;color:var(--muted)"></span>
      <button class="btn btn-primary" @click="syncAll()" :disabled="syncing">
        <span x-show="syncing" class="spin">⟳</span>
        <span x-show="!syncing">↺</span>
        Sync
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab" :class="{active: tab==='status'}"  @click="tab='status'">Status</button>
    <button class="tab" :class="{active: tab==='muscles'}" @click="tab='muscles'; loadMuscles()">Muskeln</button>
    <button class="tab" :class="{active: tab==='gap'}"     @click="tab='gap'; loadGap()">Gap</button>
    <button class="tab" :class="{active: tab==='freq'}"    @click="tab='freq'; loadFreq()">Training</button>
    <button class="tab" :class="{active: tab==='query'}"   @click="tab='query'">Query</button>
  </div>

  <!-- STATUS -->
  <div x-show="tab==='status'">
    <div class="card" x-show="!statusData && !statusErr">
      <div class="empty"><span class="spin">⟳</span> Lade…</div>
    </div>
    <div class="error" x-show="statusErr" x-text="statusErr"></div>

    <template x-if="statusData">
      <div>
        <div class="stat-grid" style="margin-bottom:12px">
          <template x-for="[k,v] in Object.entries(statusData.tables || {})" :key="k">
            <div class="stat">
              <div class="stat-val" x-text="v"></div>
              <div class="stat-key" x-text="k"></div>
            </div>
          </template>
        </div>
        <div class="card">
          <div class="label">Datenbank</div>
          <code class="mono" style="color:var(--muted)" x-text="statusData.db"></code>
        </div>
      </div>
    </template>
  </div>

  <!-- MUSKELN -->
  <div x-show="tab==='muscles'">
    <div class="card" x-show="musclesLoading">
      <div class="empty"><span class="spin">⟳</span> Lade…</div>
    </div>
    <div class="error" x-show="musclesErr" x-text="musclesErr"></div>
    <template x-if="!musclesLoading && muscleRows.length">
      <div class="card" style="padding:0;overflow:hidden">
        <table>
          <thead>
            <tr>
              <th>Muskel</th>
              <th>Latein</th>
              <th>Übungen</th>
              <th>Score</th>
              <th>Zuletzt</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="r in muscleRows" :key="r.muscle_id">
              <tr>
                <td>
                  <span class="mono" style="color:var(--accent)" x-text="r.muscle_id"></span>
                  <span x-show="!r.has_anatomy" class="badge badge-red" style="margin-left:6px;font-size:10px">kein anatomy</span>
                </td>
                <td style="color:var(--muted)" x-text="r.latin || '—'"></td>
                <td x-text="r.exercise_count"></td>
                <td>
                  <div style="display:flex;align-items:center;gap:8px">
                    <div class="bar-wrap">
                      <div class="bar-fill" :style="`width:${r.score_rate*100}%;background:${r.score_rate>=.6?'var(--green)':r.score_rate>=.3?'var(--yellow)':'var(--red)'}`"></div>
                    </div>
                    <span :style="`color:${r.score_rate>=.6?'var(--green)':r.score_rate>=.3?'var(--yellow)':'var(--red)'}`"
                          x-text="Math.round(r.score_rate*100)+'%'"></span>
                  </div>
                </td>
                <td style="color:var(--muted);font-size:12px" x-text="r.last_flashcard || '—'"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </div>

  <!-- GAP -->
  <div x-show="tab==='gap'">
    <div class="card" x-show="gapLoading">
      <div class="empty"><span class="spin">⟳</span> Lade…</div>
    </div>
    <div class="error" x-show="gapErr" x-text="gapErr"></div>
    <template x-if="!gapLoading && gapRows.length === 0 && !gapErr">
      <div class="card"><div class="empty" style="color:var(--green)">Alle Muskeln über 60% — kein Nachholbedarf.</div></div>
    </template>
    <template x-if="!gapLoading && gapRows.length">
      <div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
          <span x-text="gapRows.length"></span> Muskeln unter 60% Score
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <table>
            <thead>
              <tr>
                <th>Muskel</th>
                <th>Latein</th>
                <th>Score</th>
                <th>Übungen</th>
                <th>Zuletzt</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="r in gapRows" :key="r.muscle_id">
                <tr>
                  <td>
                    <span :class="r.score_rate < .4 ? 'badge badge-red' : 'badge badge-yellow'" x-text="r.muscle_id"></span>
                  </td>
                  <td style="color:var(--muted)" x-text="r.latin || '—'"></td>
                  <td>
                    <div style="display:flex;align-items:center;gap:8px">
                      <div class="bar-wrap">
                        <div class="bar-fill" :style="`width:${r.score_rate*100}%;background:${r.score_rate<.4?'var(--red)':'var(--yellow)'}`"></div>
                      </div>
                      <span :style="`color:${r.score_rate<.4?'var(--red)':'var(--yellow)'}`"
                            x-text="Math.round(r.score_rate*100)+'%'"></span>
                    </div>
                  </td>
                  <td x-text="r.exercise_count"></td>
                  <td style="color:var(--muted);font-size:12px" x-text="r.last_flashcard || '—'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </div>

  <!-- TRAINING FREQ -->
  <div x-show="tab==='freq'">
    <div class="card" x-show="freqLoading">
      <div class="empty"><span class="spin">⟳</span> Lade…</div>
    </div>
    <div class="error" x-show="freqErr" x-text="freqErr"></div>
    <template x-if="!freqLoading && freqRows.length">
      <div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
          Muskeln × Trainings-Sessions — aus training_history.sqlite
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <table>
            <thead>
              <tr>
                <th>Muskel</th>
                <th>Rolle</th>
                <th>Session-Tage</th>
                <th>Sets gesamt</th>
                <th>Zuletzt</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="r in freqRows" :key="r.muscle_id+r.role">
                <tr>
                  <td>
                    <span class="mono" style="color:var(--ink)" x-text="r.muscle_id"></span>
                    <div style="font-size:11px;color:var(--muted)" x-text="r.latin"></div>
                  </td>
                  <td>
                    <span :class="r.role==='primary'?'badge badge-accent':r.role==='secondary'?'badge badge-yellow':'badge badge-muted'"
                          x-text="r.role"></span>
                  </td>
                  <td>
                    <div style="display:flex;align-items:center;gap:8px">
                      <span style="font-weight:700;color:var(--ink)" x-text="r.session_days"></span>
                      <div class="freq-bar" :style="`width:${Math.min(r.session_days*8,80)}px`"></div>
                    </div>
                  </td>
                  <td x-text="r.total_sets"></td>
                  <td style="color:var(--muted);font-size:12px" x-text="r.last_trained || '—'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>
  </div>

  <!-- QUERY -->
  <div x-show="tab==='query'">
    <div class="card" style="margin-bottom:12px">
      <div class="label" style="margin-bottom:8px">SQL (nur SELECT)</div>
      <textarea x-model="sql" rows="4"
        placeholder="SELECT muscle_id, score_rate FROM muscle_coverage ORDER BY score_rate"></textarea>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" @click="runQuery()" :disabled="queryLoading || !sql.trim()">
          <span x-show="queryLoading" class="spin">⟳</span>
          Ausführen
        </button>
        <button class="btn btn-ghost" @click="setSql('SELECT muscle_id, latin, score_rate, exercise_count FROM muscle_coverage ORDER BY score_rate')">Coverage</button>
        <button class="btn btn-ghost" @click="setSql('SELECT muscle_id, latin, score_rate, last_flashcard, exercise_count FROM weak_muscles')">Gap</button>
        <button class="btn btn-ghost" @click="setSql('SELECT muscle_id, role, session_days, total_sets, last_trained FROM muscle_training_freq ORDER BY session_days DESC')">Training</button>
        <button class="btn btn-ghost" @click="setSql('SELECT exercise_id, COUNT(*) as muscles FROM exercise_muscles GROUP BY exercise_id ORDER BY muscles DESC LIMIT 20')">Exercises</button>
      </div>
    </div>
    <div class="error" x-show="queryErr" x-text="queryErr"></div>
    <template x-if="queryRows.length">
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)">
          <span x-text="queryRows.length"></span> Zeilen
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <template x-for="col in queryCols" :key="col">
                  <th x-text="col"></th>
                </template>
              </tr>
            </thead>
            <tbody>
              <template x-for="(row, i) in queryRows" :key="i">
                <tr>
                  <template x-for="col in queryCols" :key="col">
                    <td x-text="row[col] ?? '—'"></td>
                  </template>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </template>
    <template x-if="!queryLoading && queryRows.length === 0 && !queryErr && queryDone">
      <div class="card"><div class="empty">Keine Ergebnisse.</div></div>
    </template>
  </div>

</div>

<script>
function app() {
  return {
    tab: 'status',
    health: null,
    syncing: false,
    syncMsg: '',

    // status
    statusData: null,
    statusErr: '',

    // muscles
    musclesLoading: false,
    musclesErr: '',
    muscleRows: [],

    // gap
    gapLoading: false,
    gapErr: '',
    gapRows: [],

    // freq
    freqLoading: false,
    freqErr: '',
    freqRows: [],

    // query
    sql: '',
    queryLoading: false,
    queryErr: '',
    queryRows: [],
    queryCols: [],
    queryDone: false,

    async init() {
      await this.checkHealth()
      await this.loadStatus()
    },

    async checkHealth() {
      try {
        const r = await fetch('/health')
        this.health = r.ok
      } catch { this.health = false }
    },

    async loadStatus() {
      this.statusErr = ''
      try {
        const r = await fetch('/api/db/status')
        const d = await r.json()
        if (d.ok) this.statusData = d
        else this.statusErr = d.error || 'Fehler'
      } catch (e) { this.statusErr = e.message }
    },

    async syncAll() {
      this.syncing = true
      this.syncMsg = ''
      try {
        const r = await fetch('/api/db/sync', { method: 'POST' })
        const d = await r.json()
        if (d.ok) {
          this.syncMsg = `Sync OK · ${Object.values(d.counts).reduce((a,b)=>a+b,0)} Einträge`
          await this.loadStatus()
          if (this.tab === 'muscles') await this.loadMuscles()
          if (this.tab === 'gap') await this.loadGap()
          if (this.tab === 'freq') await this.loadFreq()
        } else {
          this.syncMsg = 'Sync fehlgeschlagen'
        }
      } catch (e) { this.syncMsg = e.message }
      this.syncing = false
      setTimeout(() => this.syncMsg = '', 4000)
    },

    async loadMuscles() {
      if (this.muscleRows.length) return
      this.musclesLoading = true
      this.musclesErr = ''
      try {
        const sql = 'SELECT muscle_id, latin, has_anatomy, exercise_count, score_rate, last_flashcard FROM muscle_coverage ORDER BY score_rate'
        const r = await fetch('/api/db/query?sql=' + encodeURIComponent(sql))
        const d = await r.json()
        if (d.ok) this.muscleRows = d.rows
        else this.musclesErr = d.error || 'Fehler'
      } catch (e) { this.musclesErr = e.message }
      this.musclesLoading = false
    },

    async loadGap() {
      if (this.gapRows.length) return
      this.gapLoading = true
      this.gapErr = ''
      try {
        const sql = 'SELECT muscle_id, latin, score_rate, last_flashcard, exercise_count FROM weak_muscles'
        const r = await fetch('/api/db/query?sql=' + encodeURIComponent(sql))
        const d = await r.json()
        if (d.ok) this.gapRows = d.rows
        else this.gapErr = d.error || 'Fehler'
      } catch (e) { this.gapErr = e.message }
      this.gapLoading = false
    },

    async loadFreq() {
      if (this.freqRows.length) return
      this.freqLoading = true
      this.freqErr = ''
      try {
        const sql = 'SELECT muscle_id, latin, role, session_days, total_sets, last_trained FROM muscle_training_freq ORDER BY session_days DESC'
        const r = await fetch('/api/db/query?sql=' + encodeURIComponent(sql))
        const d = await r.json()
        if (d.ok) this.freqRows = d.rows
        else this.freqErr = d.error || 'Fehler'
      } catch (e) { this.freqErr = e.message }
      this.freqLoading = false
    },

    setSql(q) { this.sql = q },

    async runQuery() {
      this.queryLoading = true
      this.queryErr = ''
      this.queryRows = []
      this.queryCols = []
      this.queryDone = false
      try {
        const r = await fetch('/api/db/query?sql=' + encodeURIComponent(this.sql.trim()))
        const d = await r.json()
        if (d.ok) {
          this.queryRows = d.rows
          this.queryCols = d.rows.length ? Object.keys(d.rows[0]) : []
        } else {
          this.queryErr = d.error || 'Fehler'
        }
      } catch (e) { this.queryErr = e.message }
      this.queryLoading = false
      this.queryDone = true
    },
  }
}
</script>
</body>
</html>
