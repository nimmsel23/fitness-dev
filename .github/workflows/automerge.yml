# Auto-Promote dev -> master.
# Ziel: nichts bleibt auf dev liegen. Ablauf:
#   Check auf dev gruen und per push ausgeloest
#       -> master per Fast-Forward (git push). Der Branch-Schutz akzeptiert
#          diesen Check-Kontext "check" auf genau diesem Commit.
#   Check gruen, aber nur per workflow_dispatch
#       -> git push antwortet GH006 "Required status check check is expected".
#          Ein Dispatch-Lauf steht in der Checks-API als success und zaehlt
#          fuer den Schutz trotzdem nicht (Beleg: Promote-Job 133151184049 auf
#          4c09f7f; am 15.11. ging derselbe Push durch, Run 43686381122, weil
#          der Check ein push war, Run 43686323814). Stattdessen PR dev -> master
#          und gh pr merge --merge, sobald ein pull_request-Check "check" gruen
#          ist. Danach wird dev per Fast-Forward auf denselben Commit gezogen
#          (dev ist nicht geschuetzt). Rebase erzeugt bei GitHub neue SHAs, die
#          Zweige liefen auseinander.
#   dev hinter master
#       -> dev per Fast-Forward nachziehen. Ein promote-Merge loest keinen
#          Push-Deploy aus; fehlt der Live-Deploy, wird er hier nachgezogen.
#   beide haben eigene Commits -> roter Lauf (nur nach direktem Push auf master).
# Rot bleibt liegen. Zeitplan alle 30 Min. GITHUB_TOKEN-Pushes loesen keine
# Workflows aus -> der Live-Deploy wird per workflow_dispatch gestartet.
# Laeuft aus dem Default-Branch; die Datei muss dort liegen.

name: Auto-Promote dev -> master (Check (Fitness))

on:
  workflow_run:
    workflows: ["Check (Fitness)"]
    types: [completed]
  push:
    branches: [master]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read
  pull-requests: write

concurrency:
  group: auto-promote-${{ github.repository }}
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    env:
      # Checkout-Push bleibt das GITHUB_TOKEN (actions/checkout). gh fuer den
      # Promote-PR nimmt das merge-agent-Muster: PAT, falls das Secret existiert,
      # sonst GITHUB_TOKEN. Nur ein PAT startet den pull_request-Check von selbst.
      # Ein mit GITHUB_TOKEN geoeffneter PR bleibt auf "Approve workflows" stehen,
      # und der Dispatch-Check erfuellt den Schutz nicht.
      GH_TOKEN: ${{ github.token }}
      PROMOTE_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      DEPLOY_FILE: deploy-master.yml
      CHECK_FILE: check.yml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev
      - name: Abgleichen
        timeout-minutes: 45
        run: |
          set -euo pipefail

          dispatch_deploy() {
            echo "Live-Deploy per Dispatch."
            gh workflow run "$DEPLOY_FILE" -R "$REPO" --ref master
          }

          deploy_already() {
            local sha="$1" hit
            hit=$(gh run list -R "$REPO" --workflow "$DEPLOY_FILE" --commit "$sha" --limit 10 \
              --json status,conclusion \
              --jq '[.[] | select(.conclusion=="success" or .status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending")] | length')
            [ "${hit:-0}" != "0" ]
          }

          align_dev() {
            git fetch -q origin master dev
            local m d
            m=$(git rev-parse origin/master)
            d=$(git rev-parse origin/dev)
            if [ "$m" != "$d" ] && git merge-base --is-ancestor "$d" "$m"; then
              echo "dev per Fast-Forward auf $m ziehen."
              git push origin "${m}:refs/heads/dev"
              git fetch -q origin dev
              d=$(git rev-parse origin/dev)
            fi
            if [ "$m" != "$d" ]; then
              echo "::error::dev ($d) und master ($m) sind nicht identisch."
              return 1
            fi
            echo "dev == master == $m"
          }

          # stdout: merged | ready | wait | red | held
          classify_pr() {
            local pr="$1" json mstate draft head state
            json=$(GH_TOKEN="$PROMOTE_TOKEN" gh pr view "$pr" -R "$REPO" \
              --json state,mergeStateStatus,isDraft,headRefOid,statusCheckRollup)
            state=$(printf '%s' "$json" | jq -r '.state')
            mstate=$(printf '%s' "$json" | jq -r '.mergeStateStatus')
            draft=$(printf '%s' "$json" | jq -r '.isDraft')
            head=$(printf '%s' "$json" | jq -r '.headRefOid')
            echo "PR #$pr state=$state merge=$mstate draft=$draft head=$head" >&2
            if [ "$state" = "MERGED" ]; then
              echo merged
              return 0
            fi
            local pending=0 eligible=0 red=0 held=0 status concl url run event
            while IFS=$'\t' read -r status concl url; do
              [ -n "${status}${concl}${url}" ] || continue
              case "$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')" in
                completed) ;;
                action_required) held=1 ;;
                *) pending=1 ;;
              esac
              case "$(printf '%s' "$concl" | tr '[:upper:]' '[:lower:]')" in
                success) ;;
                failure|cancelled|timed_out|startup_failure) red=1 ;;
                action_required) held=1 ;;
              esac
              if [ "$(printf '%s' "$concl" | tr '[:upper:]' '[:lower:]')" = "success" ] && [ -n "$url" ]; then
                run=$(printf '%s' "$url" | sed -n 's#.*/runs/\([0-9][0-9]*\)/.*#\1#p')
                if [ -n "$run" ]; then
                  event=$(gh api "repos/$REPO/actions/runs/$run" --jq '.event')
                  echo "Check-Lauf $run event=$event" >&2
                  case "$event" in
                    push|pull_request) eligible=1 ;;
                  esac
                fi
              fi
            done < <(printf '%s' "$json" | jq -r '
              [.statusCheckRollup[]? | select(.name=="check")
                | [(.status // ""), (.conclusion // ""), (.detailsUrl // .targetUrl // "")] | @tsv]
              | .[]')
            if [ "$held" = 1 ]; then
              echo held
              return 0
            fi
            if [ "$red" = 1 ] && [ "$pending" = 0 ] && [ "$eligible" = 0 ]; then
              echo red
              return 0
            fi
            if [ "$eligible" = 1 ] && [ "$pending" = 0 ]; then
              echo ready
              return 0
            fi
            echo wait
          }

          ensure_pr() {
            local pr url
            pr=$(GH_TOKEN="$PROMOTE_TOKEN" gh pr list -R "$REPO" --base master --head dev --state open \
              --json number,headRefName --jq '[.[] | select(.headRefName=="dev")][0].number // empty')
            if [ -n "$pr" ]; then
              echo "Bestehender PR #$pr." >&2
              echo "$pr"
              return 0
            fi
            url=$(GH_TOKEN="$PROMOTE_TOKEN" gh pr create -R "$REPO" --base master --head dev --draft \
              --title "promote: dev nach master" \
              --body "Automatischer Promote. Der Check auf dev ist gruen. Ein per workflow_dispatch gelaufener Check erfuellt den Branch-Schutz auf master nicht. Dieser PR wird gemergt, sobald der pull_request-Check check gruen ist. Danach zeigt dev auf denselben Commit wie master.")
            echo "$url" >&2
            printf '%s\n' "$url" | sed -n 's#.*/pull/\([0-9][0-9]*\).*#\1#p'
          }

          promote_via_pr() {
            local pr verdict before after i head_now merged_ok
            pr=$(ensure_pr)
            if [ -z "$pr" ]; then
              echo "::error::Promote-PR dev -> master liess sich nicht oeffnen."
              return 1
            fi
            for i in $(seq 1 60); do
              verdict=$(classify_pr "$pr")
              echo "PR #$pr: $verdict (Versuch $i)."
              case "$verdict" in
                merged) break ;;
                ready)
                  git fetch -q origin dev
                  head_now=$(GH_TOKEN="$PROMOTE_TOKEN" gh pr view "$pr" -R "$REPO" --json headRefOid --jq '.headRefOid')
                  if [ "$head_now" != "$(git rev-parse origin/dev)" ]; then
                    echo "dev hat sich bewegt ($head_now -> $(git rev-parse origin/dev)), weiter warten."
                    verdict=wait
                    sleep 30
                    continue
                  fi
                  break
                  ;;
                red)
                  echo "Check auf dem Promote-PR ist rot -> bleibt offen, kein Merge."
                  return 0
                  ;;
                held)
                  echo "::error::Der pull_request-Check wartet auf manuelle Freigabe (Approve workflows). Der Promote-PR wurde mit einem Token geoeffnet, das den Lauf nicht selbst startet."
                  return 1
                  ;;
                wait) sleep 30 ;;
                *)
                  echo "::error::Unbekannter PR-Status '$verdict'."
                  return 1
                  ;;
              esac
            done
            if [ "$verdict" = "wait" ]; then
              echo "::error::Promote-PR #$pr: kein push- oder pull_request-Check wurde gruen (Timeout)."
              return 1
            fi
            git fetch -q origin master dev
            before=$(git rev-parse origin/master)
            if [ "$verdict" != "merged" ]; then
              if ! git merge-base --is-ancestor "$before" "$(git rev-parse origin/dev)"; then
                echo "::error::dev und master sind auseinandergelaufen, bevor der PR gemergt werden konnte."
                return 1
              fi
              if [ "$(GH_TOKEN="$PROMOTE_TOKEN" gh pr view "$pr" -R "$REPO" --json isDraft --jq '.isDraft')" = "true" ]; then
                GH_TOKEN="$PROMOTE_TOKEN" gh pr ready "$pr" -R "$REPO"
              fi
              merged_ok=0
              for i in 1 2 3 4 5; do
                if GH_TOKEN="$PROMOTE_TOKEN" gh pr merge "$pr" -R "$REPO" --merge \
                  --subject "promote: dev nach master (#$pr)" \
                  --body "Check per pull_request ist gruen. Merge-Commit statt git push, danach dev auf denselben Commit."; then
                  merged_ok=1
                  break
                fi
                echo "Merge von PR #$pr noch nicht durch (Versuch $i)." >&2
                sleep 5
              done
              if [ "$merged_ok" != 1 ]; then
                echo "::error::Merge von PR #$pr fehlgeschlagen."
                return 1
              fi
            fi
            git fetch -q origin master
            after=$(git rev-parse origin/master)
            if [ "$before" != "$after" ] && ! deploy_already "$after"; then
              dispatch_deploy
            fi
            align_dev
          }

          git fetch -q origin master dev
          master=$(git rev-parse origin/master)
          dev=$(git rev-parse origin/dev)
          [ "$master" = "$dev" ] && { echo "dev == master, nichts zu tun."; exit 0; }

          if git merge-base --is-ancestor "$dev" "$master"; then
            echo "dev ist hinter master -> dev per Fast-Forward nachziehen."
            msg=$(git log -1 --format=%s origin/master)
            case "$msg" in
              promote:*)
                if ! deploy_already "$master"; then
                  echo "Promote-Merge $master hat noch keinen Live-Deploy."
                  dispatch_deploy
                fi
                ;;
            esac
            git push origin "${master}:refs/heads/dev"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$master" "$dev"; then
            echo "::error::dev und master haben eigene Commits (jemand hat direkt auf master gepusht). Von Hand mit einem normalen Push zusammenfuehren: git merge origin/master auf dev, pushen -> Check -> dieser Workflow zieht master nach."
            exit 1
          fi

          runs=$(gh api "repos/$REPO/actions/workflows/$CHECK_FILE/runs?head_sha=$dev&per_page=30")
          push_ok=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.event=="push" and .conclusion=="success")] | length')
          inprog=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.status!="completed")] | length')
          any_success=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
          any_fail=$(printf '%s' "$runs" | jq '[.workflow_runs[] | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")] | length')
          open_pr=$(GH_TOKEN="$PROMOTE_TOKEN" gh pr list -R "$REPO" --base master --head dev --state open \
            --json number,headRefName --jq '[.[] | select(.headRefName=="dev")][0].number // empty')
          echo "Check-Laeufe auf $dev: push_ok=$push_ok in_progress=$inprog success=$any_success fail=$any_fail open_pr=${open_pr:-none}"

          if [ "$inprog" != "0" ] && [ -z "$open_pr" ]; then
            echo "Check fuer $dev laeuft noch/fehlt -> naechster Lauf (workflow_run oder Zeitplan) uebernimmt."
            exit 0
          fi
          if [ "$any_success" = "0" ] && [ -z "$open_pr" ]; then
            if [ "$any_fail" != "0" ]; then
              echo "Check auf $dev ist rot -> bleibt auf dev liegen."
            else
              echo "Check fuer $dev laeuft noch/fehlt -> naechster Lauf (workflow_run oder Zeitplan) uebernimmt."
            fi
            exit 0
          fi

          if [ "$push_ok" != "0" ] && [ "$inprog" = "0" ]; then
            echo "Check per push gruen auf $dev -> master per Fast-Forward, Live-Deploy per Dispatch."
            if git push origin "${dev}:refs/heads/master"; then
              dispatch_deploy
              exit 0
            fi
            echo "Fast-Forward abgelehnt, weiter mit PR-Merge."
          elif [ "$push_ok" != "0" ]; then
            echo "push-Check auf $dev ist gruen, ein weiterer Lauf ist noch offen -> PR-Merge."
          else
            echo "Kein push-Check auf $dev (workflow_dispatch zaehlt fuer den Branch-Schutz nicht) -> PR-Merge."
          fi

          promote_via_pr
