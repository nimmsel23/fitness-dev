# Standalone-Prod Fitness: Push auf master deployt live (nur CI).

name: Live Deploy (Fitness master)
'on':
  workflow_dispatch: null
  push:
    branches:
    - master
jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout vitalos (Meta-Repo, liefert Nachbar-Repos)
      uses: actions/checkout@v4
      with:
        repository: nimmsel23/vitalos
        ref: master
    - name: Private Skills submodule access
      uses: ./.github/actions/skills-submodule-auth
      with:
        deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
    - name: Submodules via HTTPS + Token
      run: |
        git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
        git submodule sync
        git submodule update --init --recursive
    - name: fitness-app auf den ausgelösten Commit setzen
      run: |
        cd fitness-app
        SHA="${{ github.sha }}"
        git fetch origin "$SHA"
        git checkout "$SHA"
        git submodule sync --recursive
        git submodule update --init --recursive
    - uses: pnpm/action-setup@v4
      with:
        version: 11.3.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install (Workspaces)
      run: pnpm install --frozen-lockfile
    - name: Firebase config bereitstellen
      run: |
        if [ -n "$FIREBASE_CONFIG" ]; then
          echo "$FIREBASE_CONFIG" > fitness-app/firebase.config.js
        elif [ ! -f fitness-app/firebase.config.js ]; then
          cp firebase.config.js fitness-app/firebase.config.js
        fi
      env:
        FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
    - name: Build Fitness (Live)
      run: pnpm --filter ./fitness-app run build:firebase
    - name: Deploy Live
      id: firebase_deploy
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
        projectId: fitness-aos
        entryPoint: fitness-app
        target: client
        channelId: live
    - name: Telegram-Benachrichtigung senden
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          🚀 Fitness ist LIVE deployed (vitalos)!

          🔗 Live-URL: https://fitness-aos.web.app
          (oder eine verknüpfte Domain)

          Commit: ${{ github.event.head_commit.message }}
