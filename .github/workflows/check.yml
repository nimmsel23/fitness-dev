# Check für Fitness: Lint + Build auf jedem PR/dev-Push, ohne Deploy.
#
# Gleicher Aufbau wie preview-dev.yml (Meta-Repo vitalos liefert die Nachbar-
# Repos, dieses Submodul wird auf den geprüften Commit gesetzt), aber ohne
# Pfadfilter, ohne Secrets für Firebase und ohne Preview – so wird jeder PR
# (auch Dependabot, Doku ausgenommen) geprüft, bevor er nach master (Standalone/Shell-Pin) wandert.

name: Check (Fitness)

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout vitalos (Meta-Repo, liefert Nachbar-Repos)
        uses: actions/checkout@v7
        with:
          repository: nimmsel23/vitalos
          ref: master

      - name: Private Skills submodule access
        uses: ./.github/actions/skills-submodule-auth
        with:
          deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}

      # Nur die Top-Level-Submodule (Nachbar-Repos). Nicht --recursive:
      # journal-app pinnt die privaten Repos aos-core4, aos-door, aos-game und
      # aos-voice. Der GITHUB_TOKEN sieht sie nicht ("Repository not found",
      # Run 43227437574) und der Fitness-Check nutzt sie nicht.
      # deploy-master.yml klont die Nachbarn ebenfalls ohne verschachtelte
      # Submodule. journal-app selbst bleibt ausgecheckt, damit der
      # Workspace-Install das Paket findet.
      - name: Submodules via HTTPS + Token
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init

      - name: fitness-app auf den geprüften Commit setzen
        run: |
          cd fitness-app
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch origin "$SHA"
          git checkout "$SHA"
          # Dieses Repo hat keine .gitmodules. Trotzdem nicht rekursiv, damit
          # ein späteres verschachteltes Privat-Repo den Check nicht kippt.
          git submodule sync
          git submodule update --init

      # Skills, 6Pack, Plan, Relax sind Geschwister von Fitness: gleicher Branch wie der Lauf
      # (dev-Push → dev, PR → Ziel-Branch), nicht der vitalos-Pin.
      - name: Geschwister skills/6pack/plan/relax auf den passenden Branch
        run: |
          set -euo pipefail
          B="${{ github.base_ref || github.ref_name }}"
          [[ "$B" == master || "$B" == dev ]] || B=dev
          for app in skills-app 6pack-app plan-app relax-app; do
            git -C "$app" fetch -q origin "$B"
            git -C "$app" checkout -q --detach FETCH_HEAD
            echo "$app @ $B $(git -C "$app" rev-parse --short HEAD)"
          done

      # KB-SOT ist nimmsel23/fitness (in coach-dev nur als Submodul fitness/catalog/kb).
      - name: Checkout fitness KB (SOT)
        uses: actions/checkout@v7
        with:
          repository: nimmsel23/fitness
          ref: main
          path: fitness-kb
          submodules: recursive

      - name: KB einhängen
        run: |
          set -euo pipefail
          mkdir -p fitness-app/fitness/catalog
          ln -sfn "$GITHUB_WORKSPACE/fitness-kb" fitness-app/fitness/catalog/kb
          test -d fitness-app/fitness/catalog/kb/exercises/6pack
          echo "KB @ $(git -C fitness-kb rev-parse --short HEAD)"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # nicht --frozen-lockfile: Lockfile kommt vom Meta-Repo, die package.json
      # von fitness-app weicht gewollt ab (siehe Kommentar in preview-dev.yml)
      - name: Install (Workspaces)
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm --filter ./fitness-app run lint

      # Unit-Tests in src/ (node --test). Läuft nach dem KB-Einhängen, weil
      # exampleEntries/nonExercises-Tests KB-YML-Daten lesen.
      - name: Unit tests
        run: pnpm --filter ./fitness-app test

      - name: Tooling (Biome format scripts/)
        run: pnpm --filter ./fitness-app run tooling:biome

      - name: Tooling (knip report)
        continue-on-error: true
        run: pnpm --filter ./fitness-app run tooling:knip

      - name: Firebase config bereitstellen (gitignored, Platzhalter genügt zum Bauen)
        run: cp firebase.config.js fitness-app/firebase.config.js

      # KB-Daten (generierte Dateien + Stempel). Der Stempel prüft den Inhalt der Eingaben,
      # ein veralteter Cache führt also nur zu einem Neubau, nie zu falschen Daten.
      - name: KB-Daten-Cache
        uses: actions/cache@v6
        with:
          path: |
            fitness-app/.cache/kb-data
            fitness-app/src/lib/db/firestore/*.generated.js
            fitness-app/src/lib/db/shared/nonExercises.generated.js
            fitness-app/src/lib/coachNotesData.generated.js
            fitness-app/src/views/SixPack/sixpackData.generated.js
          key: kb-data-${{ runner.os }}-${{ hashFiles('fitness-kb/**') }}
          restore-keys: kb-data-${{ runner.os }}-

      - name: Build Fitness
        run: pnpm --filter ./fitness-app run build:firebase
        env:
          # plan-app-Pin im Meta kann hinter fitness-dev liegen (alte bulk-Skripte).
          KB_DATA_SKIP_PLAN: "1"
