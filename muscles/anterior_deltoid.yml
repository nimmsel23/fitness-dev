muscle_id: anterior_deltoid
wger_id: 2
latin: Anterior deltoid
name_en: Shoulders
is_front: true
origin: Clavicula (lateraler Anteil), Acromion, Spina scapulae
insertion: Tuberositas deltoidea humeri
innervation: Nervus axillaris (C5, C6)
function: Die posterioren Fasern des Deltoideus, zusammen mit der Spina scapulae,
  dienen als Ablagefläche für die Langhantel bei der Low Bar Position, wodurch die
  Hantel sicher auf dem Rücken platziert wird.
exercises:
  back_squat:
    function_in_exercise: Die posterioren Fasern des Deltoideus, zusammen mit der
      Spina scapulae, dienen als Ablagefläche für die Langhantel bei der Low Bar Position,
      wodurch die Hantel sicher auf dem Rücken platziert wird.
  bench_press:
    function_in_exercise: Unterstützt den Pectoralis Major bei der Flexion und horizontalen
      Adduktion des Arms im Schultergelenk, insbesondere in der unteren Hälfte der
      Bewegung.
