muscle_id: erector_spinae
wger_id: 16
latin: Musculus erector spinae
name_en: Lower back
is_front: false
origin: Sakrum, Ilium, Dornfortsätze der Lendenwirbel
insertion: Rippen, Processus transversi der Wirbel, Os occipitale
innervation: Rami dorsales der Spinalnerven (C1–S5)
function: Er hält die Wirbelsäule in einer aufrechten Position gegen die Schwerkraft
  und verhindert ein Einknicken des Oberkörpers.
exercises:
  lunge:
    function_in_exercise: Er hält die Wirbelsäule in einer aufrechten Position gegen
      die Schwerkraft und verhindert ein Einknicken des Oberkörpers.
  romanian_deadlift:
    function_in_exercise: Isometrische Kontraktion zur Stabilisierung der Wirbelsäule
      in einer neutralen Position und zur Verhinderung von Flexion (Rundrücken), wodurch
      die Integrität der Wirbelsäule während der Bewegung geschützt wird.
