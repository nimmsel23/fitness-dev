<title>Session Tafelbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,600;62..125,900&display=swap">
<style>
/* Entwurf D = A (Logbuch-Eintrag) + C (Rhythmus-Tafel).
   Layout: Handy-first. Oben Tafel (was war/ist dran, Woche), darunter der Nachtrag als Logbuch-Blatt, Speichern unten fixiert. */
:root{
  --bg:#e6e4df; --paper:#f6f5f2; --grid:#dcd9d2; --ink:#141414; --muted:#6b6862; --line:#c9c6bf;
  --sig:#ff4f1f; --sigsoft:#ffe1d6; --on-sig:#ffffff;
  --display:"Archivo","Arial Narrow",sans-serif; --mono:"Archivo","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--paper:#1e1e1c;--grid:#2a2a27;--ink:#f0eee9;--muted:#9a968e;--line:#363531;--sig:#ff6a3d;--sigsoft:#3a2219;--on-sig:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--paper:#1e1e1c;--grid:#2a2a27;--ink:#f0eee9;--muted:#9a968e;--line:#363531;--sig:#ff6a3d;--sigsoft:#3a2219;--on-sig:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--mono);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:14px 104px}
.w{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.disp{font-family:var(--display);font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.88}

/* Tafel (aus C) */
.cyc{display:grid;grid-template-columns:1fr 1.35fr 1fr;border:3px solid var(--ink);background:var(--paper)}
.c{padding:10px;border:0;border-right:3px solid var(--ink);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.c:last-child{border-right:0}
.c b{font-size:clamp(30px,10vw,52px)}
.c span{font-size:12px}
.c.on{background:var(--sig);color:var(--on-sig)}.c.on .lab{color:var(--on-sig)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.d{border:0;border-top:4px solid var(--line);background:none;color:inherit;font:inherit;padding:5px 0 0;text-align:left;cursor:pointer;min-width:0}
.d small{display:block;font-size:10px;color:var(--muted)}
.d b{display:block;font-size:17px}
.d.t{border-top-color:var(--ink)}.d.sel{border-top-color:var(--sig)}.d.sel b{color:var(--sig)}

/* Logbuch-Blatt (aus A) */
.sheet{background:var(--paper);border-left:6px solid var(--ink);padding:14px 14px 16px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:8px}
.top h1{margin:4px 0 0;font-size:clamp(36px,11vw,56px)}
.top h1 em{font-style:normal;color:var(--sig)}
.stamp{border:2px solid var(--sig);color:var(--sig);padding:3px 7px;transform:rotate(-3deg);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;background:var(--paper);white-space:nowrap}
.fields{display:grid;grid-template-columns:1.6fr 1fr;border:1.5px solid var(--ink);background:var(--paper)}
.fields label{padding:6px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fields label+label{border-left:1px solid var(--line)}
.fields input{font:900 20px var(--display);font-stretch:75%;border:0;background:none;color:var(--ink);padding:0;width:100%;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sh button{font:600 12px var(--mono);color:var(--sig);background:none;border:0;padding:4px 0;cursor:pointer}
ol{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink);background:var(--paper)}
li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
li .n{font:900 22px var(--display);font-stretch:62%;color:var(--muted);text-align:center}
li .nm{font:900 21px var(--display);font-stretch:75%;text-transform:uppercase;display:block;line-height:1.05}
li .ago{font-size:11px;color:var(--muted)}
li .ago.long{color:var(--sig);font-weight:600}
li input{font:13px var(--mono);border:0;border-bottom:1px solid transparent;background:none;color:var(--muted);width:100%;padding:3px 0}
li input:focus{border-bottom-color:var(--sig);color:var(--ink);outline:none}
.tools{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.hit,.x{font:600 11px var(--mono);border:1.5px solid var(--line);background:var(--paper);color:var(--muted);padding:3px 7px;cursor:pointer;min-width:40px}
.hit.on{border-color:var(--sig);color:var(--sig);background:var(--sigsoft)}
.x{border-color:transparent;font-size:16px;padding:0 7px}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1;min-width:0;font:600 16px var(--display);border:1.5px dashed var(--sig);padding:10px;background:var(--paper);color:var(--ink)}
.add button{border:0;background:var(--ink);color:var(--paper);font:900 22px var(--display);width:46px;cursor:pointer}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.scale button{font:900 20px var(--display);font-stretch:62%;padding:10px 0;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.scale button.in{background:var(--sigsoft);border-color:var(--sigsoft)}
.scale button.on{background:var(--sig);border-color:var(--sig);color:var(--on-sig)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--mono);border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 11px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
textarea{width:100%;min-height:80px;font:16px/1.5 var(--display);border:0;border-top:3px solid var(--ink);background:transparent;color:var(--ink);padding:10px 0 0;resize:vertical}
.save{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:3px solid var(--ink);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.save div{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.save p{margin:0;flex:1;font-size:12px;color:var(--muted);min-width:0}
.save button{min-height:50px;padding:0 22px;border:0;background:var(--sig);color:var(--on-sig);font:900 22px var(--display);font-stretch:75%;text-transform:uppercase;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
</style>
<div class="w">
  <div class="lab">Entwurf D · C-Stil · Nachtrag am Handy · Beispieldaten</div>

  <div class="cyc" id="cyc" aria-label="Split-Zyklus">
    <button class="c" data-s="Push"><span class="lab">Sa</span><b class="disp">Push</b><span>vor 3 T.</span></button>
    <button class="c on" data-s="Pull"><span class="lab">nachtragen</span><b class="disp">Pull</b><span>laut Zyklus</span></button>
    <button class="c" data-s="Legs"><span class="lab">dann</span><b class="disp">Legs</b><span>vor 8 T.</span></button>
  </div>

  <div class="week" id="week"></div>

  <section class="sheet">
    <div class="top">
      <div><div class="lab">Nachtrag</div><h1 class="disp"><span id="dt">Di 18.11.</span> · <em id="sp">Pull</em></h1></div>
    </div>

    <div class="fields">
      <label><span class="lab">Ort</span><input id="loc" value="Fitness First Schnirchg."></label>
      <label><span class="lab">Dauer</span><input id="dur" value="30′"></label>
    </div>

    <div>
      <div class="sh"><span class="lab">Übungen</span><button id="prev">↺ wie letzter Pull</button></div>
      <ol id="ex"></ol>
      <form class="add" id="addf"><input id="newex" placeholder="Übung nachtragen …" autocomplete="off" aria-label="Übung nachtragen"><button aria-label="Hinzufügen">+</button></form>
    </div>

    <div><div class="sh"><span class="lab">Effort</span><span class="lab" id="efl">6 / 10</span></div><div class="scale" id="scale"></div></div>

    <div><div class="sh"><span class="lab">Add-on</span></div><div class="chips" id="addon">
      <button class="chip">Sauna</button><button class="chip">HIIT</button><button class="chip">Cardio</button><button class="chip">Mobility</button></div></div>

    <textarea id="notes" aria-label="Notiz" placeholder="Wie lief's? Was nächstes Mal anders?"></textarea>
  </section>
</div>
<div class="save"><div><p id="sum">3 Übungen · Effort 6 · 30′</p><button id="sv">Speichern</button></div></div>
<script>
const LAST={Pull:[["Klimmzug im Obergriff","",6],["Cable Rear-Delt Fly","einarmig",6],["Seitheben am Kabel","einarmig",23]],
 Push:[["Bankdrücken","",3],["Schulterdrücken KH","",3],["Dips","",10]],
 Legs:[["Frontkniebeuge","Leg Extensions zum Aufwärmen",8],["Beinstrecken","",8]]};
let split="Pull",ex=[],eff=6;
const E=document.getElementById('ex');
function load(s){ex=LAST[s].map(([n,t,a])=>({n,t,a,h:false}));r()}
function r(){E.innerHTML=ex.map((e,i)=>`<li><span class="n">${i+1}</span><div><span class="nm">${e.n}</span><span class="ago ${e.a>14?'long':''}">${e.a==null?'neu':'zuletzt vor '+e.a+' Tagen'}</span><input id="note${i}" value="${e.t}" placeholder="Randnotiz …" aria-label="Notiz zu ${e.n}"></div><div class="tools"><button class="hit ${e.h?'on':''}" data-h="${i}">HIT</button><button class="x" data-x="${i}" aria-label="${e.n} entfernen">×</button></div></li>`).join('');sum()}
E.onclick=e=>{const h=e.target.closest('[data-h]'),x=e.target.closest('[data-x]');if(h){ex[h.dataset.h].h^=1;r()}if(x){ex.splice(x.dataset.x,1);r()}};
E.oninput=e=>{if(e.target.id.startsWith('note'))ex[+e.target.id.slice(4)].t=e.target.value};
addf.onsubmit=e=>{e.preventDefault();const v=newex.value.trim();if(v){ex.push({n:v,t:"",a:null,h:false});newex.value="";r()}};
prev.onclick=()=>load(split);
cyc.onclick=e=>{const c=e.target.closest('.c');if(!c)return;split=c.dataset.s;cyc.querySelectorAll('.c').forEach(x=>x.classList.toggle('on',x===c));sp.textContent=split;prev.textContent="↺ wie letzter "+split;load(split)};
const days=[["Do","Legs"],["Fr",""],["Sa","Push"],["So",""],["Mo",""],["Di","?"],["Mi","heute"]],dates=["13.","14.","15.","16.","17.","18.","19."];
week.innerHTML=days.map(([w,s],i)=>`<button class="d ${s&&s!=='?'&&s!=='heute'?'t':''} ${i==5?'sel':''}" data-i="${i}"><small>${w} ${dates[i]}</small><b class="disp">${s||'–'}</b></button>`).join('');
week.onclick=e=>{const d=e.target.closest('.d');if(!d)return;week.querySelectorAll('.d').forEach(x=>x.classList.toggle('sel',x===d));const i=+d.dataset.i;dt.textContent=days[i][0]+" "+dates[i]+"11."};
function rs(){scale.innerHTML=Array.from({length:10},(_,i)=>`<button class="${i+1==eff?'on':i+1<eff?'in':''}" aria-label="Effort ${i+1}">${i+1}</button>`).join('');efl.textContent=eff+" / 10";sum()}
scale.onclick=e=>{const b=e.target.closest('button');if(b){eff=[...scale.children].indexOf(b)+1;rs()}};
addon.onclick=e=>{const b=e.target.closest('.chip');if(b)b.classList.toggle('on')};
function sum(){document.getElementById('sum').textContent=`${ex.length} Übungen · Effort ${eff} · ${dur.value}`}
dur.oninput=sum;
sv.onclick=()=>{sv.textContent="Gespeichert";setTimeout(()=>sv.textContent="Speichern",1500)};
load("Pull");rs();
</script>
