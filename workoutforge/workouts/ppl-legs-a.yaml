id: ppl-legs-a
name: PPL – Legs A
goal: Hypertrophie
notes: "Quad-dominiert. RIR 1–2. Bei Kniebeuge gut aufwärmen (2–3 Ramp-up Sätze)."

exercises:
  - name: Barbell Squat
    order: 1
    sets: 4
    reps: "6-10"
    rir: 1
    rest_seconds: 240
    tempo: "30X0"
    notes: "Oberschenkel parallel oder tiefer"

  - name: Leg Press
    order: 2
    sets: 3
    reps: "10-15"
    rir: 1
    rest_seconds: 180

  - name: Romanian Deadlift
    order: 3
    sets: 3
    reps: "8-12"
    rir: 1
    rest_seconds: 180
    notes: "Hüfte zurück, leichte Kniebeugung, Stange nah am Körper"

  - name: Lying Leg Curl
    order: 4
    sets: 3
    reps: "10-15"
    rir: 0
    rest_seconds: 120

  - name: Standing Calf Raises
    order: 5
    sets: 4
    reps: "12-15"
    rir: 0
    rest_seconds: 90
    notes: "Volle Streckung, 1s Peak Contraction"
