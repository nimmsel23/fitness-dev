id: hit-fullbody-a
name: HIT Fullbody A
goal: Maximale Intensität
notes: "1 Arbeitssatz bis Versagen. Warm-up: 2 leichte Ramp-up Sätze. Pause: 5–10 min zwischen Übungen. Tempo: langsame Exzentrik 4–5s, explosive Konzentrik."

exercises:
  - name: Barbell Squat
    order: 1
    sets: 1
    reps: "6-10"
    effort: to_failure
    rest_seconds: 420
    tempo: "50X0"
    notes: "Tiefe kontrolliert, kein Bounce. Letzte Reps sehr langsam."

  - name: Wide-Grip Lat Pulldown
    order: 2
    sets: 1
    reps: "6-10"
    effort: to_failure
    rest_seconds: 360
    notes: "Peak Contraction 2s halten"

  - name: Dips
    order: 3
    sets: 1
    reps: "6-12"
    effort: to_failure
    rest_seconds: 420
    notes: "Vorne lehnen für Brustfokus. Ggf. 1–2 Forced Reps."

  - name: Seated Dumbbell Press
    order: 4
    sets: 1
    reps: "6-10"
    effort: to_failure
    rest_seconds: 360

  - name: Lying Leg Curl
    order: 5
    sets: 1
    reps: "10-15"
    effort: to_failure
    rest_seconds: 300
    notes: "Ferse zur Hüfte, langsame Exzentrik"
