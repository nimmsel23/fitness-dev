id: hit-fullbody-b
name: HIT Fullbody B
goal: Maximale Intensität
notes: "Consolidation Routine B – 7–10 Tage nach A. Andere Übungsauswahl, gleiches Prinzip."

exercises:
  - name: Leg Press
    order: 1
    sets: 1
    reps: "10-15"
    effort: to_failure
    rest_seconds: 420
    notes: "Füße schulterbreit, volle ROM"

  - name: Bent Over Barbell Row
    order: 2
    sets: 1
    reps: "6-10"
    effort: to_failure
    rest_seconds: 360
    tempo: "40X1"
    notes: "Untergriff oder neutral – Ellenbogen nah am Körper"

  - name: Incline Dumbbell Press
    order: 3
    sets: 1
    reps: "8-12"
    effort: to_failure
    rest_seconds: 420

  - name: Barbell Curl
    order: 4
    sets: 1
    reps: "8-12"
    effort: to_failure
    rest_seconds: 300
    drop_set: true
    notes: "Drop Set: nach Versagen Gewicht um 30% reduzieren, weiter bis Versagen"

  - name: Calf Press
    order: 5
    sets: 1
    reps: "15-20"
    effort: to_failure
    rest_seconds: 240
