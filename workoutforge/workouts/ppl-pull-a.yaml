id: ppl-pull-a
name: PPL – Pull A
goal: Hypertrophie
notes: "Fokus Latissimus + hintere Schulter. RIR 1–2."

exercises:
  - name: Wide-Grip Lat Pulldown
    order: 1
    sets: 4
    reps: "8-12"
    rir: 1
    rest_seconds: 180
    notes: "Voll strecken oben, Peak Contraction unten halten 1s"

  - name: Bent Over Barbell Row
    order: 2
    sets: 4
    reps: "6-10"
    rir: 1
    rest_seconds: 180
    tempo: "30X1"
    notes: "Untergriff für mehr Bizeps-Beteiligung"

  - name: Seated Cable Row
    order: 3
    sets: 3
    reps: "10-14"
    rir: 1
    rest_seconds: 120

  - name: Face Pull
    order: 4
    sets: 3
    reps: "15-20"
    rir: 1
    rest_seconds: 90
    notes: "Hintere Schulter + Außenrotation"

  - name: Barbell Curl
    order: 5
    sets: 3
    reps: "10-12"
    rir: 1
    rest_seconds: 90
