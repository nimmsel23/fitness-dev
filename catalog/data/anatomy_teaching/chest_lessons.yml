name: chest_lessons
description: Anatomy teaching seeds for chest-focused exercises.
lessons:
  - exercise_id: dips_chest
    learning_goal:
      short: Brust vs Trizeps beim Chest Dip unterscheiden.
      detailed: Lern die Brust betonte Dips-Variante über Körperneigung, Schultergürtelkontrolle und sichere Tiefe zu coachen.
    movement_pattern: dip_press
    joint_actions:
      - shoulder_extension
      - elbow_extension
      - scapular depression
      - scapular retraction
    muscle_roles:
      primary:
        - chest
      secondary:
        - arms
      stabilizers:
        - shoulders
        - core
    body_highlighter_regions:
      - chest
      - shoulders
      - upper_arms
      - core
    trainer_explanation:
      simple: Brust-fokussierte Dips brauchen eine leichte Vorneigung, ruhige Schulterblätter und kontrollierte Tiefe.
      technical: Mit Schulterextension, Ellenbogenextension und aktiver Scapula-Stabilität verschiebst du den Fokus zur Brust und hältst das Schulterdumping unter Kontrolle.
      client_friendly: "Brust-fokussierte Dips: Lehn dich leicht vor, halte die Schultern stabil und geh nur so tief, wie du die Bewegung sauber kontrollierst."
    feel_cues:
      - Brust arbeitet in der unteren Position deutlich mit.
      - Trizeps übernimmt mehr, wenn der Oberkörper zu aufrecht wird.
      - Schultergürtel bleibt fest, nicht absacken lassen.
    coaching_cues:
      - Leicht nach vorne lehnen.
      - Schultern unten und stabil halten.
      - Ellenbogen kontrolliert strecken.
      - Nur so tief gehen, wie die Schulter stabil bleibt.
    common_errors:
      - error: Zu aufrechter Oberkörper.
        anatomical_reason: Die Last verschiebt sich stärker Richtung Ellenbogenextension und weg von der horizontalen Brustbelastung.
        correction: Mehr Vorneigung einnehmen und die Brust zum Dip-Bereich führen.
        coaching_cue: Brust leicht nach vorne, nicht senkrecht bleiben.
      - error: Schulterdumping unten.
        anatomical_reason: Der Schultergürtel verliert Spannung, wodurch die Vorderseite der Schulter unnötig belastet wird.
        correction: Scapula aktiv unten und kontrolliert halten, Tiefe reduzieren.
        coaching_cue: Schultern weg von den Ohren, Tiefe nur sauber.
      - error: Zu tiefe Wiederholungen.
        anatomical_reason: Die Schulter wird in eine instabile Endposition gezwungen.
        correction: Nur bis zur kontrollierbaren Tiefe absenken.
        coaching_cue: Saubere Tiefe statt maximale Tiefe.
    variations_teach:
      - chest_dip
      - triceps_dip
      - assisted_dips
    quiz:
      question: Was macht aus einem Dip eher einen Chest Dip?
      answer: Mehr Vorneigung, stabile Schulterblätter und kontrollierte Tiefe verschieben den Fokus zur Brust.
  - exercise_id: pull_up
    learning_goal:
      short: Vertikalen Zug sauber coachen.
      detailed: Lern den Pull-Up über Schulterblattkontrolle, Ellenbogenzug und kontrollierte Tiefe zu erklären.
    movement_pattern: vertical_pull
    joint_actions:
      - shoulder_adduction
      - elbow_flexion
      - scapular depression
    muscle_roles:
      primary:
        - back
      secondary:
        - arms
      stabilizers:
        - core
    body_highlighter_regions:
      - back
      - arms
      - core
    trainer_explanation:
      simple: Der Pull-Up ist ein vertikaler Zug aus Schulterblattkontrolle und Ellenbogenflexion.
      technical: Mit aktiver Scapula-Depression und kontrollierter Schulteradduktion wird der Lat-Zug sauber auf den Rücken übertragen.
      client_friendly: "Zieh dich mit dem Rücken hoch, halte den Rumpf fest und lass die Schultern nicht hochwandern."
    feel_cues:
      - Rücken zieht zuerst.
      - Oberarme arbeiten mit.
      - Schulterblätter bleiben unten.
    coaching_cues:
      - Brust zur Stange.
      - Ellbogen nach unten ziehen.
      - Kontrolliert absenken.
    common_errors:
      - error: Mit Schwung arbeiten.
        anatomical_reason: Die Last wird aus Hüfte und Rumpf erzeugt statt aus dem vertikalen Zug.
        correction: Start aus dem Dead Hang mit ruhigem Zug.
        coaching_cue: Kein Kipping, sauber ziehen.
      - error: Schultern hochziehen.
        anatomical_reason: Die Scapula verliert Depression und der Nacken übernimmt.
        correction: Schulterblätter aktiv nach unten setzen.
        coaching_cue: Hals lang lassen.
    variations_teach:
      - assisted_pull_up
      - chin_up
      - neutral_grip_pull_up
    quiz:
      question: Was ist das wichtigste Körpersignal beim Pull-Up?
      answer: Die Schulterblätter unten halten und den Zug kontrolliert aus dem Rücken starten.
  - exercise_id: barbell_row
    learning_goal:
      short: Horizontalen Zug stabil erklären.
      detailed: Lern das Rudern mit fester Hüfte, stabilem Rumpf und sauberem Ellbogenweg zu coachen.
    movement_pattern: horizontal_pull
    joint_actions:
      - shoulder_extension
      - elbow_flexion
      - scapular retraction
    muscle_roles:
      primary:
        - back
      secondary:
        - arms
      stabilizers:
        - core
    body_highlighter_regions:
      - back
      - arms
      - core
    trainer_explanation:
      simple: Das Rudern fordert Zugkraft im Rücken bei stabiler Rumpfposition.
      technical: Über Schulterextension und Scapula-Retraktion wird der Zug aus dem Rücken organisiert, nicht aus Schwung.
      client_friendly: "Zieh die Stange zum Körper und halt den Oberkörper ruhig."
    feel_cues:
      - Schulterblätter arbeiten zusammen.
      - Rücken bleibt fest.
      - Arme bringen die Last ans Ziel.
    coaching_cues:
      - Rumpf stabil halten.
      - Stange zum Bauch ziehen.
      - Nicht reißen.
    common_errors:
      - error: Rücken rund machen.
        anatomical_reason: Die Wirbelsäule verliert Spannung und die Zugbahn wird unsauber.
        correction: Brust leicht anheben und Hüfte stabilisieren.
        coaching_cue: Rücken lang und fest.
      - error: Zu viel Schwung.
        anatomical_reason: Der Zug wird aus dem Körpermoment statt aus dem Rücken erzeugt.
        correction: Tempo verlangsamen und Pause oben kontrollieren.
        coaching_cue: Kein Wippen.
    variations_teach:
      - pendlay_row
      - chest_supported_row
      - t_bar_row
    quiz:
      question: Was ist das Ziel beim Barbell Row?
      answer: Ein stabiler horizontaler Zug aus Rücken und Armen ohne Schwung.
  - exercise_id: face_pull
    learning_goal:
      short: Rear-Delt- und Schulterbalance coachen.
      detailed: Lern Face Pulls als Haltung, Schulterbalance und rear-delt-lastige Zugbewegung zu erklären.
    movement_pattern: horizontal_pull
    joint_actions:
      - shoulder_abduction
      - external_rotation
      - scapular retraction
    muscle_roles:
      primary:
        - shoulders
      secondary:
        - back
        - arms
      stabilizers:
        - core
    body_highlighter_regions:
      - shoulders
      - upper_back
      - arms
    trainer_explanation:
      simple: Face Pulls stärken die hintere Schulter und helfen bei Schulterbalance.
      technical: Über horizontale Abduktion, Außenrotation und Retraktion werden Rear Delts und obere Rückenmuskeln gezielt angesprochen.
      client_friendly: "Zieh das Seil zu Gesicht und Ellbogen hoch, damit die hintere Schulter arbeiten kann."
    feel_cues:
      - Hintere Schulter brennt zuerst.
      - Oberer Rücken stabilisiert.
      - Nacken bleibt entspannt.
    coaching_cues:
      - Ellbogen außen führen.
      - Nicht in den Nacken ziehen.
      - Schulterblätter kontrolliert bewegen.
    common_errors:
      - error: Zu tief ziehen.
        anatomical_reason: Der Fokus wandert weg von Außenrotation und Rear Delts.
        correction: Zug auf Augen- bis Stirnhöhe halten.
        coaching_cue: Zum Gesicht, nicht zum Bauch.
      - error: Nacken verspannen.
        anatomical_reason: Der obere Trapez übernimmt zu stark.
        correction: Schultern unten lassen und Tempo reduzieren.
        coaching_cue: Nacken locker.
    variations_teach:
      - band_face_pull
      - cable_high_row
      - rear_delt_row
    quiz:
      question: Wofür sind Face Pulls besonders nützlich?
      answer: Für hintere Schulter, obere Rückenbalance und saubere Schulterposition.
  - exercise_id: overhead_press
    learning_goal:
      short: Vertikales Drücken stabil coachen.
      detailed: Lern das Überkopfdrücken mit Rumpfspannung, gerader Stange und sauberer Schulterbewegung zu erklären.
    movement_pattern: vertical_press
    joint_actions:
      - shoulder_flexion
      - elbow_extension
      - scapular upward_rotation
    muscle_roles:
      primary:
        - shoulders
      secondary:
        - arms
      stabilizers:
        - core
        - back
    body_highlighter_regions:
      - shoulders
      - arms
      - core
    trainer_explanation:
      simple: Überkopfdrücken braucht eine gerade Drückbahn und einen festen Rumpf.
      technical: Schulterflexion und Ellenbogenextension werden durch Scapula-Aufwärtsrotation und Rumpfspannung abgesichert.
      client_friendly: "Drück die Stange gerade nach oben und halte den Bauch fest."
    feel_cues:
      - Schultern treiben nach oben.
      - Rumpf bleibt fest.
      - Arme schließen sauber aus.
    coaching_cues:
      - Rippen unten halten.
      - Gerade Linie über Kopf.
      - Nicht ins Hohlkreuz fallen.
    common_errors:
      - error: Hohlkreuz übertreiben.
        anatomical_reason: Die Last wandert aus der Schulter in den unteren Rücken.
        correction: Gesäß und Bauch anspannen, Rippen runter.
        coaching_cue: Bauch fest, Brust nicht rauswerfen.
      - error: Stange vor dem Gesicht verlieren.
        anatomical_reason: Die Kraftlinie wird vor die Schulter verlegt.
        correction: Kopf unter die Stange und vertikale Bahn halten.
        coaching_cue: Gerade nach oben.
    variations_teach:
      - dumbbell_shoulder_press
      - push_press
      - landmine_press
    quiz:
      question: Was verhindert das Hohlkreuz beim Overhead Press am besten?
      answer: Ein fester Rumpf und bewusst unten gehaltene Rippen.
  - exercise_id: lateral_raise
    learning_goal:
      short: Seitliche Schulter isolieren.
      detailed: Lern Seitheben als kontrollierte Abduktion mit kleiner Bahn und sauberem Schultergefühl zu coachen.
    movement_pattern: abduction
    joint_actions:
      - shoulder_abduction
      - scapular control
    muscle_roles:
      primary:
        - shoulders
      secondary: []
      stabilizers:
        - core
    body_highlighter_regions:
      - shoulders
      - upper_body
    trainer_explanation:
      simple: Seitheben trifft vor allem die seitliche Schulter über eine kleine, präzise Hebebewegung.
      technical: Die isolierte Abduktion mit kontrollierter Scapula-Stabilität verschiebt den Fokus zur medialen Deltoidarbeit.
      client_friendly: "Heb die Arme seitlich nur bis Schulterhöhe und ohne Schwung."
    feel_cues:
      - Seitliche Schulter arbeitet gleichmäßig.
      - Nacken bleibt ruhig.
      - Bewegung bleibt klein.
    coaching_cues:
      - Leicht gebeugte Ellbogen.
      - Bis Schulterhöhe.
      - Kein Schwung.
    common_errors:
      - error: Zu hoch ziehen.
        anatomical_reason: Der obere Trapez übernimmt zu stark.
        correction: Bewegung an Schulterhöhe beenden.
        coaching_cue: Nicht über Schulterhöhe.
      - error: Schwung aus dem Körper holen.
        anatomical_reason: Momentum ersetzt die Muskelarbeit.
        correction: Tempo reduzieren und Last senken.
        coaching_cue: Langsam und sauber.
    variations_teach:
      - cable_lateral_raise
      - leaning_lateral_raise
      - machine_lateral_raise
    quiz:
      question: Wo soll das Seitheben enden?
      answer: Etwa auf Schulterhöhe, kontrolliert und ohne Schwung.
  - exercise_id: barbell_curl
    learning_goal:
      short: Bizepscurl sauber erklären.
      detailed: Lern den Langhantelcurl als kontrollierte Ellenbogenflexion mit ruhigem Oberkörper zu coachen.
    movement_pattern: elbow_flexion
    joint_actions:
      - elbow_flexion
    muscle_roles:
      primary:
        - arms
      secondary: []
      stabilizers:
        - core
    body_highlighter_regions:
      - upper_arms
      - forearms
      - core
    trainer_explanation:
      simple: Der Curl trainiert die Ellenbogenbeugung und den Bizeps als Hauptbeweger.
      technical: Durch kontrollierte Ellenbogenflexion ohne Schultervorschub bleibt die Last auf den Armbeugern.
      client_friendly: "Zieh das Gewicht mit den Armen hoch, nicht mit dem Rücken."
    feel_cues:
      - Bizeps spannt in der oberen Phase.
      - Ellbogen bleiben nah am Körper.
      - Unterarme führen die Bewegung.
    coaching_cues:
      - Ellbogen ruhig halten.
      - Kontrolliert hoch und runter.
      - Kein Schwung aus dem Rücken.
    common_errors:
      - error: Schwung aus dem Rücken.
        anatomical_reason: Die Last wird über Rumpfmoment statt Ellenbogenflexion bewegt.
        correction: Gewicht senken und Oberkörper fixieren.
        coaching_cue: Bleib sauber.
      - error: Handgelenke einknicken.
        anatomical_reason: Die Kraftlinie bricht in der Unterarmkette.
        correction: Neutralen Handgelenkswinkel halten.
        coaching_cue: Hand gerade.
    variations_teach:
      - ez_bar_curl
      - dumbbell_curl
      - preacher_curl
    quiz:
      question: Was soll beim Curl möglichst ruhig bleiben?
      answer: Der Oberkörper und die Oberarme.
  - exercise_id: front_squat
    learning_goal:
      short: Aufrechte Kniebeuge coachen.
      detailed: Lern die Front Squat als aufrechte Squat-Variante mit sauberer Rumpfspannung und Quad-Fokus zu erklären.
    movement_pattern: squat
    joint_actions:
      - knee_flexion
      - hip_flexion
      - trunk stabilization
    muscle_roles:
      primary:
        - legs
      secondary:
        - core
      stabilizers:
        - back
    body_highlighter_regions:
      - legs
      - core
      - back
    trainer_explanation:
      simple: Die Front Squat zwingt zu einer aufrechten Position und belastet die Beine stark.
      technical: Durch vordere Lastverlagerung steigen Kniebeugung und Rumpfanforderung, während der Quadrizeps dominiert.
      client_friendly: "Bleib aufrecht, halt die Ellbogen hoch und geh kontrolliert in die Kniebeuge."
    feel_cues:
      - Oberschenkel arbeiten stark.
      - Oberkörper bleibt aufrecht.
      - Core hält die Position.
    coaching_cues:
      - Ellbogen hoch.
      - Brust stolz.
      - Knie sauber verfolgen.
    common_errors:
      - error: Ellbogen fallen lassen.
        anatomical_reason: Die Front-Position verliert Spannung und der Oberkörper kippt nach vorne.
        correction: Ellbogen aktiv hochziehen.
        coaching_cue: Ellbogen hoch, sonst kippt alles.
      - error: Zu stark nach vorne kippen.
        anatomical_reason: Der Rumpf übernimmt zu wenig und die Last wandert nach hinten.
        correction: Core-Spannung und bessere Lastverteilung.
        coaching_cue: Aufrecht bleiben.
    variations_teach:
      - back_squat
      - goblet_squat
      - safety_bar_squat
    quiz:
      question: Was ist das Hauptmerkmal der Front Squat?
      answer: Eine aufrechte Position mit viel Rumpfspannung und starkem Quad-Fokus.
  - exercise_id: romanian_deadlift
    learning_goal:
      short: Hinge sauber erklären.
      detailed: Lern den RDL als Hüftknick mit kontrollierter Hamstring-Dehnung und stabilem Rücken zu coachen.
    movement_pattern: hinge
    joint_actions:
      - hip_flexion
      - hip_extension
      - trunk stabilization
    muscle_roles:
      primary:
        - legs
        - back
      secondary:
        - core
      stabilizers:
        - shoulders
    body_highlighter_regions:
      - legs
      - back
      - core
    trainer_explanation:
      simple: Der Romanian Deadlift ist ein kontrollierter Hüftknick für hintere Kette und Rückenstabilität.
      technical: Durch exzentrische Hüftflexion mit neutraler Wirbelsäule werden Hamstrings und Gluteus unter Spannung gehalten.
      client_friendly: "Schieb die Hüfte nach hinten und behalt den Rücken lang."
    feel_cues:
      - Dehnung hinten in den Oberschenkeln.
      - Hüfte führt die Bewegung.
      - Rücken bleibt fest.
    coaching_cues:
      - Hüfte nach hinten.
      - Knie nur leicht beugen.
      - Dehnung kontrollieren.
    common_errors:
      - error: Knie zu stark beugen.
        anatomical_reason: Der Bewegungsreiz verschiebt sich weg vom Hinge hin zur Kniebeuge.
        correction: Knie weich, aber nicht tief beugen.
        coaching_cue: Hüfte zuerst.
      - error: Rumpf verlieren.
        anatomical_reason: Die Wirbelsäule verliert Neutralität unter Last.
        correction: Brust und Bauch vor dem Zug setzen.
        coaching_cue: Rücken lang.
    variations_teach:
      - dumbbell_rdl
      - single_leg_rdl
      - stiff_leg_deadlift
    quiz:
      question: Was ist der zentrale Bewegungsimpuls im RDL?
      answer: Die Hüfte schiebt nach hinten, nicht die Knie nach vorne.
  - exercise_id: leg_press
    learning_goal:
      short: Maschinen-Kniebeuge erklären.
      detailed: Lern die Beinpresse als quad-lastige Kniebeugevariante mit stabiler Maschine und sauberem Becken zu coachen.
    movement_pattern: squat
    joint_actions:
      - knee_flexion
      - hip_flexion
      - hip_extension
    muscle_roles:
      primary:
        - legs
      secondary:
        - core
      stabilizers:
        - back
    body_highlighter_regions:
      - legs
      - core
      - back
    trainer_explanation:
      simple: Die Beinpresse lässt dich Beine trainieren, ohne viel Balancearbeit.
      technical: Die geführte Knie- und Hüftextension reduziert Stabilitätsanforderungen und erlaubt einen klaren Quad-Fokus.
      client_friendly: "Drück über die Beine, aber lass das Becken stabil auf dem Polster."
    feel_cues:
      - Beine drücken den Schlitten.
      - Becken bleibt ruhig.
      - Tiefe bleibt kontrolliert.
    coaching_cues:
      - Füße stabil.
      - Knie sauber verfolgen.
      - Becken nicht anheben.
    common_errors:
      - error: Becken abheben.
        anatomical_reason: Die Hüfte verliert Position und belastet den unteren Rücken.
        correction: Tiefe verringern und Fußposition anpassen.
        coaching_cue: Becken unten lassen.
      - error: Knie nach innen kollabieren lassen.
        anatomical_reason: Die Abduktoren und Außenrotatoren kontrollieren die Bahn nicht.
        correction: Druck über den ganzen Fuß und Knie nach außen.
        coaching_cue: Knie folgen den Zehen.
    variations_teach:
      - hack_squat
      - single_leg_press
      - high_foot_press
    quiz:
      question: Was ist das wichtigste Sicherheitskriterium an der Beinpresse?
      answer: Das Becken bleibt stabil auf dem Polster.
