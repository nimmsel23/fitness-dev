# Activity → Muskelgruppen Single Source of Truth
#
# Wird von bin/fitness-activity (Python) gelesen. Aktueller JS-Spiegel:
# src/constants/ActivityConstants.js — bei Änderungen hier dort nachziehen
# (perspektivisch: Vite-Plugin oder Build-Step).
#
# Schema:
#   <activity_type>:
#     label: deutsche UI-Bezeichnung
#     emoji: optional
#     muscles: Default-Muskelgruppen wenn keine Variante gewählt
#     variants: optional, {key: {label, muscles}}  — z.B. swimStyle, muscleTarget

running:
  label: Laufen
  emoji: "🏃"
  muscles: [quads, hamstrings, calves, glutes]

cycling:
  label: Radfahren
  emoji: "🚴"
  muscles: [quads, hamstrings, calves, glutes]

swimming:
  label: Schwimmen
  emoji: "🏊"
  muscles: [chest, shoulders, arms, core, quads, hamstrings]  # Default: Brustschwimmen
  variant_field: swimStyle
  variants:
    breast:
      label: Brustschwimmen
      muscles: [chest, shoulders, arms, core, quads, hamstrings]
    back:
      label: Rückenschwimmen
      muscles: [back, shoulders, arms, core, quads]

hiking:
  label: Wandern
  emoji: "🥾"
  muscles: [quads, hamstrings, calves, glutes, core]

walking:
  label: Spazieren
  emoji: "🚶"
  muscles: [quads, calves, glutes]

rowing:
  label: Rudern
  emoji: "🚣"
  muscles: [back, shoulders, arms, quads, hamstrings, core]

yoga:
  label: Yoga
  emoji: "🧘"
  muscles: [core, shoulders, back]

stretching:
  label: Stretching
  emoji: "🤸"
  muscles: [core, back, hamstrings]

climbing:
  label: Klettern
  emoji: "🧗"
  muscles: [back, shoulders, arms, core, quads]

hiit:
  label: HIIT
  emoji: "⚡"
  muscles: [core, quads, shoulders]
  variant_field: muscleTarget
  variants:
    core:
      label: Core
      muscles: [core]
    legs:
      label: Beine
      muscles: [quads, hamstrings, glutes, calves]
    full:
      label: Full Body
      muscles: [chest, back, shoulders, arms, core, quads, hamstrings, glutes]
