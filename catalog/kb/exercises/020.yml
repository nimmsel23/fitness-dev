name: '020'
description: Expert details for Pull Up
exercises:
- exercise_id: '020'
  id: '020'
  wger_id: 821
  german: Klimmzug im Obergriff

  category: back
  type: compound
  movement_pattern: vertical_pull
  equipment:
  - pull_up_bar
  primary_muscles:
  - latissimus_dorsi
  - trapezius_lower
  secondary_muscles:
  - biceps_brachii
  - brachialis
  - brachioradialis
  - teres_major
  stabilizers:
  - core
  - pectoralis_major
  variations:
  - assisted_pull_up
  coaching_notes:
  - Brust zur Stange ziehen, nicht nur das Kinn.
  - Kontrolliert absenken und volle Dehnung ausnutzen.
  - Schulterblätter in der untersten Position aktiv nach unten ziehen (Scapula 
    Pull).
  common_errors:
  - Mit Schwung aus den Beinen arbeiten (Kipping).
  - Schultern zu den Ohren ziehen (mangelnde Scapula-Kontrolle).
  tags:
  - back
  - pull
  aliases:
  - klimmzug obergriff
  - obergriff klimmzug
  wger_muscle_ids:
    primary:
    - 12
    secondary:
    - 1
    - 9
