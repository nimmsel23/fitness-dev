name: inbox_inverted_rows
description: AI generated base entry for Inverted Rows
exercises:
- exercise_id: inverted_rows
  id: inverted_rows
  name: Inverted Rows
  display_name: Invertiertes Rudern
  german: Invertiertes Rudern
  category: back
  type: compound
  movement_pattern: horizontal_pull
  equipment:
  - bodyweight
  - barbell
  primary_muscles:
  - latissimus_dorsi
  - rhomboids
  - trapezius
  - deltoid_posterior
  secondary_muscles:
  - biceps_brachii
  - forearm_flexors
  - erector_spinae
  - abdominals
  coaching_notes:
  - Halten Sie Ihren Körper von den Fersen bis zum Kopf in einer geraden Linie. Vermeiden
    Sie ein Durchhängen der Hüften oder ein Überstrecken des unteren Rückens.
  - Ziehen Sie Ihre Brust zur Stange/zum Griff, indem Sie die Schulterblätter aktiv
    zusammenziehen. Konzentrieren Sie sich auf das Ziehen mit den Rückenmuskeln, nicht
    nur mit den Armen.
  - Führen Sie die Bewegung kontrolliert aus, sowohl beim Hochziehen als auch beim
    langsamen und kontrollierten Ablassen in die Ausgangsposition.
  - 'Passen Sie den Schwierigkeitsgrad an, indem Sie die Fußposition variieren: Je
    weiter die Füße unter dem Gerät stehen (körpernaher Stand), desto einfacher; je
    weiter die Füße nach vorne gestellt werden, desto schwieriger wird die Übung.'
  common_errors:
  - Das Durchhängen der Hüften oder ein starkes Hohlkreuz, wodurch die Körperspannung
    verloren geht.
  - Unvollständige Bewegungsausführung, d.h. nicht die volle Strecke nach oben ziehen
    oder sich nicht vollständig ablassen.
  - Einsatz von Schwung oder ruckartigen Bewegungen, anstatt die Muskeln kontrolliert
    arbeiten zu lassen.
  - Die Ellbogen zu weit vom Körper abspreizen, was die Schultern unnötig belasten
    kann. Halten Sie die Ellbogen näher am Körper.
