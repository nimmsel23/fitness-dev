name: '604'
description: Expert details for Plank
exercises:
- exercise_id: '604'
  id: '604'
  german: Unterarmstütz
  category: core
  type: isometric
  movement_pattern: anti_extension
  equipment:
  - bodyweight
  primary_muscles:
  - transvere_abdominis
  - rectus_abdominis
  secondary_muscles:
  - obliques
  - quadriceps
  - serratus_anterior
  stabilizers:
  - anterior_deltoid
  - pectoralis_major
  variations:
  - high_plank
  coaching_notes:
  - Bilden Sie eine gerade Linie von den Fersen bis zum Kopf.
  - Den Rumpf und das Gesäß aktiv anspannen, um die Wirbelsäule zu 
    stabilisieren.
  - Atmen Sie ruhig und gleichmäßig weiter.
  common_errors:
  - Die Hüfte durchhängen lassen (Hohlkreuz).
  - Die Schultern zu den Ohren hochziehen.
  - Das Becken zu weit nach oben schieben.
  tags:
  - core
  - stability
  aliases:
  - unterarmstütz
