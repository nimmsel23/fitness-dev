name: '601'
description: Expert details for Hanging Leg Raise
exercises:
- exercise_id: '601'
  id: '601'
  german: Hängendes Beinheben
  category: core
  type: isolation
  movement_pattern: trunk_flexion
  equipment:
  - pull_up_bar
  primary_muscles:
  - rectus_abdominis
  secondary_muscles:
  - obliques
  - iliopsoas
  stabilizers:
  - latissimus_dorsi
  - forearms
  variations:
  - knee_raise
  coaching_notes:
  - Das Becken kontrolliert nach vorne oben kippen (Posterior Pelvic Tilt).
  - Vermeiden Sie jegliches Schwingen des Oberkörpers oder der Beine.
  - Atmen Sie bei der Aufwärtsbewegung bewusst aus.
  common_errors:
  - Mit Schwung aus den Beinen hochziehen (mangelnde Bauchaktivierung).
  - Den unteren Rücken im Hohlkreuz lassen.
