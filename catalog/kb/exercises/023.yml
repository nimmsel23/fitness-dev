name: '023'
description: Expert details for Dumbbell Shoulder Press
exercises:
- exercise_id: '023'
  id: '023'
  german: Kurzhantel-Schulterdrücken
  category: shoulders
  type: compound
  movement_pattern: vertical_press
  equipment:
  - dumbbells
  primary_muscles:
  - anterior_deltoid
  - lateral_deltoid
  secondary_muscles:
  - triceps_brachii
  - trapezius_upper
  stabilizers:
  - core
  variations:
  - overhead_press
  coaching_notes:
  - Neutralen oder leicht ausgestellten Griff stabil halten.
  - Saubere Bahn nach oben, ohne die Hanteln oben zusammenzuschlagen.
  - Volle ROM ausnutzen (Hanteln bis auf Ohrenhöhe absenken).
  common_errors:
  - Zu weit nach außen ausweichen mit den Ellbogen (Schulterstress).
  - Unterer Rücken kippt ab (Hohlkreuz).
