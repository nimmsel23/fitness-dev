name: '022'
description: Expert details for Overhead Press
exercises:
- exercise_id: '022'
  id: '022'
  german: Überkopfdrücken
  category: shoulders
  type: compound
  movement_pattern: vertical_press
  equipment:
  - barbell
  primary_muscles:
  - anterior_deltoid
  - lateral_deltoid
  secondary_muscles:
  - triceps_brachii
  - trapezius_upper
  - pectoralis_major_clavicular_head
  stabilizers:
  - core
  - erector_spinae
  variations:
  - dumbbell_shoulder_press
  coaching_notes:
  - Rippen unten halten, kein übermäßiges Hohlkreuz.
  - Hantelstange in einer geraden Linie über den Kopf drücken.
  - Volle Streckung und aktives "Einrasten" der Schultern am obersten Punkt.
  common_errors:
  - Hohlkreuz übertreiben (Rückenbelastung).
  - Stange zu weit vor dem Gesicht führen (Hebelarm).
  tags:
  - shoulders
  - press
  wger_muscle_ids:
    primary:
    - 2
    secondary:
    - 5
    - 9
