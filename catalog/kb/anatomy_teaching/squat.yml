name: squat_lesson
description: Anatomy teaching seed for squat.
lessons:
- exercise_id: back_squat
  title: Kniebeuge — Knie, Hüfte und Beinachse
  region: legs
  learning_goal:
    short: Kniebeuge als kombiniertes Knie-Hüft-Muster verstehen, nicht als reine
      Beinübung.
    detailed: Lern wie Quadrizeps, Gluteus maximus und Gluteus medius zusammenarbeiten
      und warum Dorsalflexion und Beinachse entscheidend sind.
  movement_pattern:
    primary: bilateral_squat
    secondary:
    - knee_extension
    - hip_extension
    - ankle_dorsiflexion
  joint_actions:
    hip:
      eccentric:
      - flexion_control
      concentric:
      - extension
      stabilization:
      - pelvis_control
    knee:
      eccentric:
      - flexion_control
      concentric:
      - extension
      stabilization:
      - valgus_prevention
    ankle:
      eccentric:
      - dorsiflexion
      concentric:
      - plantar_flexion_partial
      stabilization:
      - arch_support
    trunk:
      stabilization:
      - anti_flexion
      - bracing
  muscle_roles:
    prime_movers:
    - thigh_front
    - glutes
    synergists:
    - thigh_back
    - calves
    stabilizers:
    - core
    - glutes
  body_highlighter_regions:
    primary:
    - thigh_front
    - glutes
    secondary:
    - thigh_back
    light:
    - calves
    - core
  trainer_explanation:
    simple: Die Kniebeuge ist eine kombinierte Knie- und Hüftbewegung — Quadrizeps
      und Gluteus maximus arbeiten gleichzeitig.
    technical: Exzentrisch kontrollieren Quadrizeps (Knie) und Gluteus maximus + Hamstrings
      (Hüfte) das Absinken. Konzentrisch strecken beide Gelenke gleichzeitig. Gluteus
      medius stabilisiert das Becken lateral gegen Knie-Valgus.
    client_friendly: Die Kniebeuge ist nicht nur Beine — der Popo arbeitet genauso.
  feel_cues:
  - Gesäß sinkt kontrolliert nach hinten/unten, nicht nur nach unten.
  - Knie bleiben über den Zehen, kein Einknicken nach innen.
  - Beim Hochkommen Boden wegdrücken — Gluteus maximus spüren.
  - Rumpf bleibt aufrecht, keine Vorneige aus der Hüfte.
  coaching_cues:
  - Tief einatmen, Bauchpresse aufbauen vor dem Absenken.
  - Knie aktiv Richtung kleiner Zeh führen (Gluteus medius aktivieren).
  - Mindesttiefe Oberschenkel parallel — tiefer wenn Mobilität erlaubt.
  common_errors:
  - error: Knie fallen nach innen (Knee Valgus).
    anatomical_reason: Gluteus medius zu schwach für Hüftabduktion/-außenrotation.
      Femur innenrotiert, Tibia folgt. Oft verstärkt durch Fußpronation.
    correction: Knie aktiv auseinander drücken. Gluteus medius vor dem Satz aktivieren.
    coaching_cue: Knie nach außen über kleinen Zeh drücken.
  - error: Stark nach vorne kippender Oberkörper.
    anatomical_reason: Eingeschränkte Dorsalflexion im Sprunggelenk oder mangelnde
      Hüftmobilität — der Rumpf kompensiert. Bei Low Bar anatomisch normal und gewollt.
    correction: Dorsalflexion testen. Bei High Bar Brust hochhalten, Rückenstrecker
      aktivieren.
    coaching_cue: Brust hoch und offen halten.
  variations_teach:
  - variation: Weiter Stand
    lesson: Mehr Hüftbeugung, höherer Gluteus/Adduktoren-Anteil. Weniger Quadrizeps-Dominanz.
  - variation: Enger Stand
    lesson: Quadrizeps-Dominanz steigt, weniger Hüftbeugung nötig.
  - variation: Erhöhte Ferse
    lesson: Kompensiert mangelnde Dorsalflexion. Mehr Quadrizeps, weniger Hüftbeugungsanforderung.
  quiz:
  - question: Warum ist die Kniebeuge eine Hüft- UND Knieübung?
    answer: Weil Quadrizeps (Kniestreckung) und Gluteus maximus (Hüftstreckung) gleichzeitig
      konzentrisch arbeiten. Wer nur Quadrizeps will, nimmt Beinpresse. Die Kniebeuge
      verbindet beide Muster unter axialer Last.
  - question: Was passiert anatomisch wenn die Knie beim Aufstehen nach innen fallen?
    answer: 'Femur innenrotiert, Tibia folgt, das Patellofemoralgelenk wird ungünstig
      belastet. Ursache: Gluteus medius zu schwach oder Fußpronation zieht die Beinachse
      nach innen.'
- exercise_id: squat
  simple_explanation: 'Die Kniebeuge ist das komplexeste Bewegungsmuster im Training.
    Quadrizeps streckt das Knie, Gluteus maximus streckt die Hüfte, Rückenstrecker
    halten den Rumpf aufrecht, und fast jeder Muskel der Beine stabilisiert gleichzeitig.
    Die Kniebeuge zeigt dir Hüft-, Knie- und Sprunggelenkmechanik in einer einzigen
    Bewegung.

    '
  detailed_explanation: 'Exzentrisch (abwärts): Hüfte, Knie und Sprunggelenk flektieren
    kontrolliert gleichzeitig. Der Quadrizeps kontrolliert Kniebeugung, Gluteus maximus
    und Hamstrings kontrollieren die Hüftbeugung, die Wadenmuskulatur kontrolliert
    Dorsalflexion im Sprunggelenk. Konzentrisch (aufwärts): Gluteus maximus und Quadrizeps
    arbeiten simultan. Gluteus max ist der primäre Hüftstrecker, Quadrizeps der primäre
    Kniestrecker. Die Hamstrings wirken als Synergisten zur Hüftstreckung. Core und
    Rückenstrecker halten Rumpfstabilität unter axialer Last. Der Gluteus medius stabilisiert
    das Becken lateral gegen Einknicken.

    '
  joint_actions:
    hip:
      eccentric:
      - flexion_control
      concentric:
      - extension
    knee:
      eccentric:
      - flexion_control
      concentric:
      - extension
    ankle:
      eccentric:
      - dorsiflexion
      concentric:
      - plantar_flexion_partial
    lumbar_spine:
      static:
      - neutral_maintenance
      - extension_stabilization
  feel_cues:
  - Gesäß sinkt in der Abwärtsbewegung kontrolliert nach hinten/unten.
  - Knie bleiben über Zehen, nicht dahinter einknicken.
  - Beim Hochkommen Boden wegdrücken — Gluteus maximus spüren.
  - Rücken bleibt aufrecht, keine Vorbeuge aus dem Rumpf.
  - Gluteus medius hält Knie aktiv auseinander.
  coaching_cues:
    setup:
    - Füße schulterbreit bis etwas breiter, Zehen leicht auswärts (15–30°).
    - Stange auf mittlerem Trapezius (High Bar) oder Deltoid-Rücken (Low Bar).
    - Tief einatmen in Bauch + Rücken, Bauchpresse aufbauen (Valsalva kontrolliert).
    execution:
    - Hüfte und Knie gleichzeitig beugen — nicht zuerst Knie.
    - Oberkörper der Stange folgen lassen (leichte Vorneigung natürlich).
    - Knie über Zehen führen, nicht nach innen drücken lassen.
    - 'Mindest-Tiefe: Oberschenkel parallel. Ideal: darunter wenn Mobilität vorhanden.'
  quiz_prompts:
  - question: Warum ist die Kniebeuge eine Knie- UND Hüftübung?
    answer: 'Weil Quadrizeps (Kniestreckung) und Gluteus maximus (Hüftstreckung) gleichzeitig
      konzentrisch arbeiten. Wer nur den Quadrizeps trainieren will, nimmt eher Beinpresse
      oder Hackenschmidt. Die Kniebeuge ist ein Kombinationsmuster aus Kniestreckung
      und Hüftstreckung unter axialer Last.

      '
  - question: Warum fühlen manche die Kniebeuge mehr im Rücken als in den Beinen?
    answer: 'Häufig liegt ein hohes Maß an Vorlage vor (stark nach vorne geneigter
      Oberkörper). Das erhöht das Drehmoment auf die Lendenwirbelsäule und die Rückenstrecker
      müssen kompensieren. Ursache ist meist Sprunggelenk-Dorsalflexionsmangel oder
      Hüftmobilitätsdefizit.

      '
  - question: Was passiert anatomisch, wenn die Knie beim Aufstehen nach innen fallen?
    answer: 'Femur innenrotiert, Tibia folgt, das Patellofemoralgelenk wird in einer
      ungünstigen Position belastet. Ursache: Gluteus medius zu schwach für Hüftabduktion/-außenrotation,
      oder Fußpronation zieht die gesamte Beinachse nach innen. Lehrt die Funktion
      des Gluteus medius als Becken-/Beinachsen-Stabilisator.

      '
  common_errors_explained:
    knee_valgus:
      description: Knie fallen beim Absenken oder Hochkommen nach innen.
      anatomical_reason: 'Kombiniertes Versagen von Gluteus medius (Hüftabduktion/-außenrotation)
        und Fuß-/Sprunggelenk-Stabilität. Das Femur innenrotiert, die Tibia folgt
        — klassische Beinachsen-Instabilität. Oft verstärkt durch schwache Hüftaußenrotatoren
        oder eingeschränkte Dorsalflexion (Kompensation über Pronation und Knieeinknicken).

        '
      correction: Knie aktiv auseinander drücken. Gluteus medius aktivieren.
      teaches:
      - gluteus_medius_function
      - knee_valgus_biomechanics
      - foot_arch_and_knee_chain
    forward_lean:
      description: Oberkörper kippt stark nach vorne beim Absenken.
      anatomical_reason: 'Entweder mangelnde Hüftmobilität (Hüfte kann nicht genug
        flektieren ohne Rücken-Kompensation), eingeschränkte Dorsalflexion im Sprunggelenk,
        oder Schwäche der Rückenstrecker unter Last. Bei Low Bar ist mehr Vorneigung
        anatomisch beabsichtigt und korrekt.

        '
      correction: 'Dorsalflexion testen. Bei High Bar: Brust hoch, Rückenstrecker
        aktivieren.'
      teaches:
      - ankle_dorsiflexion_importance
      - hip_mobility_and_squat_depth
      - torso_angle_mechanics
    butt_wink:
      description: Becken kippt am unteren Ende der Bewegung nach hinten (posteriore
        Pelvis-Kippung).
      anatomical_reason: 'Die Hüftflexion überschreitet die verfügbare Hüftmobilität
        oder Hüftbeuger/Hüftkonstruktion. Der Rücken muss kompensieren (lumbare Flexion).
        Leichtes Butt Wink ist anatomisch normal und klinisch irrelevant. Starkes
        Wink unter Last problematisch.

        '
      correction: Tiefe reduzieren bis kurz über Wink. Hüftmobilität verbessern.
      teaches:
      - hip_anatomy_variability
      - lumbar_flexion_under_load
      - individual_hip_structure
