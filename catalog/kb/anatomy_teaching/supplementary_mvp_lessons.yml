lessons:
  - exercise_id: ab_wheel
    title: "Ab Wheel - Anti-Extension verstehen"
    region: core
    learning_goal:
      short: "Der Trainer lernt, wie Anti-Extension den Rumpf stabilisiert."
      detailed: "Das Ab Wheel zeigt, wie Core, Schultergürtel und Rücken gemeinsam ein Durchhängen verhindern."
    movement_pattern:
      primary: anti_extension
      secondary:
        - shoulder_flexion_control
    joint_actions:
      shoulder:
        eccentric:
          - flexion_control
        concentric:
          - flexion_assist
        stabilization:
          - humeral_head_control
    muscle_roles:
      prime_movers:
        - core
      synergists:
        - shoulders
      stabilizers:
        - back
    body_highlighter_regions:
      primary:
        - abdomen_front
      secondary:
        - shoulders_front
      light:
        - lower_back
    trainer_explanation:
      simple: "Der Rumpf hält die Linie, während die Arme nach vorne rollen."
      technical: "Anti-Extension verlangt isometrische Rumpfspannung gegen Lendenwirbelsäulen-Extension."
      client_friendly: "Halte den Bauch fest, damit der Rücken nicht ins Hohlkreuz fällt."
    feel_cues:
      - "Bauchspannung vorne."
      - "Schultern arbeiten ruhig nach vorne."
    coaching_cues:
      - "Rippen unten."
      - "Nur so weit rollen, wie du stabil bleibst."
      - "Becken nicht kippen lassen."
    common_errors:
      - error: "Hohlkreuz durchdrücken."
        anatomical_reason: "Die Rumpfspannung reicht nicht aus, um die Extension zu kontrollieren."
        correction: "Bewegungsradius verkleinern und Spannung vor dem Rollen aufbauen."
        coaching_cue: "Rippen runter, Bauch fest."
    variations_teach:
      - variation: "Knee rollout"
        lesson: "Die kürzere Hebellänge erleichtert die Anti-Extension."
    quiz:
      - question: "Was ist die Hauptlektion des Ab Wheel?"
        answer: "Der Rumpf muss Extension verhindern und die Linie stabil halten."

  - exercise_id: barbell_curl
    title: "Barbell Curl - Ellenbogenflexion sauber lernen"
    region: arms
    learning_goal:
      short: "Der Trainer erkennt, wie der Bizeps den Unterarm beugt."
      detailed: "Die Übung zeigt, wie Oberarmstabilität und Ellenbogenflexion zusammenhängen."
    movement_pattern:
      primary: elbow_flexion
      secondary:
        - shoulder_stability
    joint_actions:
      elbow:
        eccentric:
          - extension_control
        concentric:
          - flexion
        stabilization:
          - alignment_control
    muscle_roles:
      prime_movers:
        - arms
      synergists:
        - shoulders
      stabilizers:
        - core
    body_highlighter_regions:
      primary:
        - upper_arm_front
      secondary:
        - forearms
      light:
        - abdomen_front
    trainer_explanation:
      simple: "Der Oberarm bleibt ruhig, der Unterarm beugt sich nach oben."
      technical: "Die Hauptarbeit ist Ellenbogenflexion bei kontrollierter Schulterstabilität."
      client_friendly: "Du sollst den Zug vorne am Oberarm spüren, ohne zu schwingen."
    feel_cues:
      - "Spannung vorne am Oberarm."
      - "Unterarm bewegt sich sauber."
    coaching_cues:
      - "Ellbogen ruhig."
      - "Nicht schwingen."
      - "Langsam ablassen."
    common_errors:
      - error: "Schwung aus dem Rücken."
        anatomical_reason: "Die Hüfte ersetzt die fehlende Ellenbogenkraft."
        correction: "Gewicht reduzieren und Rumpf fixieren."
        coaching_cue: "Nur der Unterarm arbeitet."
    variations_teach:
      - variation: "EZ-bar curl"
        lesson: "Die Griffposition verändert den Komfort im Ellenbogen."
    quiz:
      - question: "Was ist das Kernprinzip beim Barbell Curl?"
        answer: "Ellenbogenflexion ohne Schwung aus dem Oberkörper."

  - exercise_id: bulgarian_split_squat
    title: "Bulgarian Split Squat - Einseitige Beinführung"
    region: legs
    learning_goal:
      short: "Der Trainer lernt Einbein-Stabilität und Beinachse."
      detailed: "Die Übung verbindet Kniekontrolle, Hüftstreckung und Beckenstabilität."
    movement_pattern:
      primary: unilateral_squat
      secondary:
        - balance_control
    joint_actions:
      hip:
        eccentric:
          - flexion_control
        concentric:
          - extension
        stabilization:
          - pelvic_leveling
      knee:
        eccentric:
          - flexion_control
        concentric:
          - extension
        stabilization:
          - valgus_control
    muscle_roles:
      prime_movers:
        - legs
      synergists:
        - core
      stabilizers:
        - back
    body_highlighter_regions:
      primary:
        - thigh_front
      secondary:
        - glutes
      light:
        - lower_back
    trainer_explanation:
      simple: "Ein Bein arbeitet, das andere balanciert mit."
      technical: "Die Übung fordert hohe einseitige Hüft- und Kniekontrolle."
      client_friendly: "Du trainierst ein Bein, während der Körper die Balance hält."
    feel_cues:
      - "Druck im vorderen Bein."
      - "Becken bleibt gerade."
    coaching_cues:
      - "Langsam absenken."
      - "Knie sauber führen."
      - "Rumpf aufrecht."
    common_errors:
      - error: "Knie kippt nach innen."
        anatomical_reason: "Hüfte und Fuß kontrollieren die Beinachse nicht sauber."
        correction: "Stand korrigieren und Hüfte aktiv nach außen stabilisieren."
        coaching_cue: "Knie über dem Fuß halten."
    variations_teach:
      - variation: "Split squat"
        lesson: "Die kürzere Variante reduziert die Balanceanforderung."
    quiz:
      - question: "Was ist die Hauptlektion beim Bulgarian Split Squat?"
        answer: "Ein Bein trägt Last, während Hüfte und Knie stabil bleiben."

