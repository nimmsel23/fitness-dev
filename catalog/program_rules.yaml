Der Agent kann dann später automatisiert sagen:

```text
"Ich kenne barbell_bench_press aus deiner YAML.
Ich suche in wger nach passenden Übungen.
Wenn exakter Match schlecht ist, erstelle ich/verwende ich eine Custom Exercise oder exportiere es separat."
```

## Wichtiger Punkt

Die **wger Exercise DB** ist dann nicht mehr dein Gehirn. Sie ist nur noch eine mögliche Datenquelle.

Dein echtes Gehirn ist:

```text
exercise_library/*.yml
program_rules.yml
aliases.yml
wger_mapping.yml
training_history.json/sqlite
```

## Beste Lösung für deine App

Ich würde es so bauen:

```text
~/.fitness-agent/
├── exercises/
│   ├── chest.yml
│   ├── back.yml
│   ├── shoulders.yml
│   ├── arms.yml
│   ├── legs.yml
│   └── core.yml
├── rules/
│   ├── program_rules.yml
│   ├── progression_rules.yml
│   └── safety_rules.yml
├── maps/
│   ├── aliases.yml
│   └── wger_mapping.yml
├── state/
│   ├── training_history.sqlite
│   └── last_generated_plan.yml
└── exports/
    ├── obsidian/
    ├── wger/
    └── json/
```

## Fazit

Ja: **dein lokaler Agent kann wger sehr gut überbrücken.**

Die ideale Rolle wäre:

```text
YAMLs = bessere Exercise Intelligence
Agent = Coach / Translator / Planner
wger = lokales Tracking-System
Obsidian = Wissensbasis und Langzeitdokumentation
```

Das ist sogar stärker als nur wger allein, weil du deine eigene Logik für PPL, Übungsauswahl, Muskelgruppen, Coachingpoints, Progression und Obsidian-Export kontrollierst.

