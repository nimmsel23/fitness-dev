      core:
        choose_from:
          - hanging_leg_raise
          - cable_crunch
          - ab_wheel
          - plank
          - pallof_press
          - side_plank
        sets: 2
        reps: "8-20"
        rpe: "7-9"

  upper_day:
    label_de: "Upper Body Day"
    description: "Oberkörper komplett: Brust, Rücken, Schultern, Arme."
    allowed_categories:
      - chest
      - back
      - shoulders
      - arms
    required_patterns:
      - horizontal_push
      - vertical_pull
      - horizontal_pull
    optional_patterns:
      - vertical_push
      - shoulder_abduction
      - elbow_flexion
      - elbow_extension
    exercise_order:
      - chest_press
      - vertical_pull
      - horizontal_pull
      - shoulder
      - biceps_optional
      - triceps_optional
    slots:
      chest_press:
        choose_from:
