    front_squat:
      custom_id: front_squat
      wger_match:
        status: "needs_lookup"
        wger_id: null
        confidence: null
      fallback_name: "Frontkniebeuge"
      export_as_custom_exercise: true

    cable_fly:
      custom_id: cable_fly
      wger_match:
        status: "needs_lookup"
