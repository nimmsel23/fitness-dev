Perfekt. Dann bauen wir jetzt die **Regel-Datei**, damit dein lokaler Agent aus den Körperregion-YAMLs sinnvolle Workouts generieren kann.

## `program_rules.yml`

```yaml
program_rules:
  version: "0.1.0"
  language: "de"
  purpose: "Rules for generating strength and hypertrophy workouts from the exercise library."

training_goals:
  hypertrophy:
    description: "Muskelaufbau mit moderater bis hoher Wiederholungszahl und kontrollierter Technik."
    default_rep_ranges:
      compound: "6-10"
      machine_compound: "8-12"
      isolation: "10-20"
      core: "8-20"
    default_sets:
      compound: 3
      machine_compound: 3
      isolation: 2
      core: 2
    default_rpe:
      compound: "7-9"
      machine_compound: "8-9"
      isolation: "8-10"
      core: "7-9"
    rest_seconds:
      compound: 120
      machine_compound: 90
      isolation: 60
      core: 45

  strength:
    description: "Kraftaufbau mit höherer Last, längeren Pausen und niedrigerer Wiederholungszahl."
    default_rep_ranges:
      compound: "3-6"
      machine_compound: "5-8"
      isolation: "8-15"
      core: "8-15"
    default_sets:
      compound: 4
      machine_compound: 3
      isolation: 2
      core: 2
    default_rpe:
      compound: "6-8"
      machine_compound: "7-8"
      isolation: "7-9"
      core: "7-8"
    rest_seconds:
      compound: 180
      machine_compound: 120
      isolation: 60
      core: 60

  strength_hypertrophy:
    description: "Mischform aus Kraft und Muskelaufbau."
    default_rep_ranges:
      compound: "5-8"
      machine_compound: "8-12"
      isolation: "10-15"
      core: "8-15"
    default_sets:
      compound: 3
      machine_compound: 3
      isolation: 2
      core: 2
    default_rpe:
      compound: "7-8"
      machine_compound: "8-9"
      isolation: "8-9"
      core: "7-9"
    rest_seconds:
      compound: 150
      machine_compound: 90
      isolation: 60
      core: 45

workout_templates:
  push_day:
    label_de: "Push Day"
    description: "Brust, Schulter, Trizeps."
    allowed_categories:
      - chest
      - shoulders
      - arms
    allowed_sections:
      - triceps
    required_patterns:
      - horizontal_push
      - vertical_push
      - elbow_extension
    optional_patterns:
      - incline_push
      - horizontal_adduction
      - shoulder_abduction
      - scapular_retraction_external_rotation
    exercise_order:
      - main_chest_press
      - secondary_press
      - shoulder_press_or_raise
      - chest_isolation
      - triceps_isolation
      - shoulder_health_optional
    slots:
      main_chest_press:
        choose_from:
          - barbell_bench_press
          - dumbbell_bench_press
          - incline_dumbbell_press
          - dips_chest
        sets: 3
        reps: "5-10"
        rpe: "7-9"

      secondary_press:
        choose_from:
          - incline_dumbbell_press
          - dumbbell_bench_press
          - machine_chest_press
          - dips_chest
          - close_grip_bench_press
        sets: 2
        reps: "8-12"
        rpe: "8-9"

      shoulder_press_or_raise:
        choose_from:
          - overhead_press
          - dumbbell_shoulder_press
          - lateral_raise
        sets: 2
        reps: "8-15"
        rpe: "7-9"

      chest_isolation:
        choose_from:
          - cable_fly
          - pec_deck
        sets: 2
        reps: "10-20"
        rpe: "8-10"

      triceps_isolation:
        choose_from:
          - overhead_triceps_extension
          - cable_pushdown
          - skull_crusher
        sets: 2
        reps: "10-15"
        rpe: "8-9"

      shoulder_health_optional:
        choose_from:
          - face_pull
          - rear_delt_fly
        sets: 1
        reps: "15-25"
        rpe: "6-8"
        optional: true

  pull_day:
    label_de: "Pull Day"
    description: "Rücken, hintere Schulter, Bizeps."
    allowed_categories:
      - back
      - shoulders
      - arms
    allowed_sections:
      - biceps
    required_patterns:
      - vertical_pull
      - horizontal_pull
      - elbow_flexion
    optional_patterns:
      - horizontal_abduction
      - scapular_retraction_external_rotation
    exercise_order:
      - main_vertical_pull
      - main_horizontal_pull
      - secondary_row_or_pulldown
      - rear_delt
      - biceps_main
      - biceps_secondary_optional
    slots:
      main_vertical_pull:
        choose_from:
          - pull_up
          - chin_up
          - lat_pulldown
        sets: 3
        reps: "5-10"
        rpe: "7-9"

      main_horizontal_pull:
        choose_from:
          - barbell_row
          - chest_supported_row
          - t_bar_row
        sets: 3
        reps: "6-12"
        rpe: "7-9"

      secondary_row_or_pulldown:
        choose_from:
          - lat_pulldown
          - chest_supported_row
          - t_bar_row
        sets: 2
        reps: "8-12"
        rpe: "8-9"

      rear_delt:
        choose_from:
          - rear_delt_fly
          - face_pull
        sets: 2
        reps: "12-25"
        rpe: "8-9"

      biceps_main:
        choose_from:
          - barbell_curl
          - incline_dumbbell_curl
          - preacher_curl
        sets: 2
        reps: "8-15"
        rpe: "8-9"

      biceps_secondary_optional:
        choose_from:
          - hammer_curl
          - cable_curl
        sets: 1
        reps: "10-15"
        rpe: "8-9"
        optional: true

  legs_day:
    label_de: "Leg Day"
    description: "Quads, Hamstrings, Glutes, Waden, Core."
    allowed_categories:
      - legs
      - core
    required_patterns:
      - squat
      - hinge
      - knee_flexion
      - plantar_flexion
    optional_patterns:
      - unilateral_squat
      - knee_extension
      - hip_extension
      - anti_extension
      - anti_rotation
    exercise_order:
      - main_squat
      - main_hinge
      - unilateral_or_machine
      - hamstring_isolation
      - quad_isolation_optional
      - calves
      - core
    slots:
      main_squat:
        choose_from:
          - back_squat
          - front_squat
          - leg_press
        sets: 3
        reps: "5-10"
        rpe: "7-9"

      main_hinge:
        choose_from:
          - deadlift
          - romanian_deadlift
        sets: 3
        reps: "5-10"
        rpe: "7-9"

      unilateral_or_machine:
        choose_from:
          - bulgarian_split_squat
          - lunge
          - leg_press
          - hip_thrust
        sets: 2
        reps: "8-12"
        rpe: "8-9"

      hamstring_isolation:
        choose_from:
          - leg_curl
        sets: 2
        reps: "10-15"
        rpe: "8-9"

      quad_isolation_optional:
        choose_from:
