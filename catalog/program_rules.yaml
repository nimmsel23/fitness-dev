      - day: 2
        template: lower_day
      - day: 3
        template: upper_day
      - day: 4
        template: lower_day
    rest_guidance:
      - "Nicht zwingend 4 Tage hintereinander."
      - "Sinnvoll: Upper, Lower, Rest, Upper, Lower."

  ppl_6_day:
    label_de: "Push Pull Legs 6x/Woche"
    days:
      - day: 1
        template: push_day
      - day: 2
        template: pull_day
      - day: 3
        template: legs_day
      - day: 4
        template: push_day
      - day: 5
        template: pull_day
      - day: 6
        template: legs_day
    rest_guidance:
      - "Nur sinnvoll bei guter Regeneration."
      - "Volumen pro Einheit moderat halten."
      - "Mindestens 1 kompletter Ruhetag pro Woche."

selection_rules:
  general:
    - "Prefer compound exercises early in the workout."
    - "Use isolation exercises after main compound work."
    - "Avoid too many overlapping high-fatigue exercises in one session."
    - "Do not select deadlift and back_squat as maximal-effort lifts in the same session unless explicitly requested."
    - "Prefer chest_supported_row over barbell_row if lower back fatigue is high."
    - "Prefer machine or cable isolation if the user reports joint discomfort."

  push_day:
    - "Select at least one chest press."
    - "Select at least one triceps isolation."
    - "Select lateral_raise unless overhead volume is already high."
    - "If dips_chest is selected, reduce additional triceps volume slightly."

  pull_day:
    - "Select one vertical pull and one horizontal pull."
    - "Include rear_delt_fly or face_pull for shoulder balance."
    - "If chin_up is selected, reduce direct biceps volume slightly."

  legs_day:
    - "Select one squat pattern and one hinge pattern."
    - "Include leg_curl if hamstring hypertrophy is a goal."
    - "Include calf_raise unless session length is very limited."
    - "Use unilateral work for balance and functional carryover."

  core:
    - "Do not overload spinal flexion if lower back is irritated."
    - "Use pallof_press or side_plank for stability-focused sessions."
    - "Use cable_crunch for progressive abdominal hypertrophy."
    - "Use ab_wheel only if anti-extension control is sufficient."

fatigue_management:
  high_fatigue_exercises:
    - deadlift
    - back_squat
    - front_squat
    - barbell_row
    - weighted_dips
    - weighted_pull_up
    - overhead_press

  moderate_fatigue_exercises:
    - romanian_deadlift
    - leg_press
    - bulgarian_split_squat
    - dumbbell_bench_press
    - incline_dumbbell_press
    - chest_supported_row
    - t_bar_row

  low_fatigue_exercises:
    - cable_fly
    - pec_deck
    - lateral_raise
    - rear_delt_fly
    - face_pull
    - cable_pushdown
    - cable_curl
    - leg_extension
    - leg_curl
    - calf_raise
    - pallof_press

progression_rules:
  double_progression:
    description: "Increase reps first, then load."
    rule:
      - "Choose a rep range, e.g. 8-12."
      - "Keep the same weight until all sets reach the top of the rep range."
      - "Then increase load slightly and return to the lower end of the range."

  load_increment_guidance:
    upper_body:
      dumbbells: "1-2 kg per dumbbell when possible"
      barbell: "2.5-5 kg total"
      cable_machine: "smallest available increment"
    lower_body:
      barbell: "2.5-10 kg total depending on exercise"
      machines: "smallest sensible increment"
    isolation:
      rule: "Prefer reps and control before load jumps."

  deload:
    trigger_examples:
      - "Performance drops across multiple sessions."
      - "Joint pain increases."
      - "Sleep and recovery are poor."
      - "Motivation and energy are unusually low."
    default_action:
      - "Reduce sets by 30-50% for one week."
      - "Keep technique sharp."
      - "Avoid failure training."

safety_rules:
  general:
    - "Pain is not the same as effort."
    - "Sharp pain means stop or modify the exercise."
    - "Technique quality overrides load."
    - "Warm up before heavy compounds."
    - "Do not prescribe true failure on high-risk compounds by default."

  shoulder_sensitive:
    prefer:
      - dumbbell_bench_press
      - machine_chest_press
      - cable_fly
      - landmine_press
      - face_pull
    avoid_or_modify:
      - deep_dips
      - very_wide_grip_bench_press
      - behind_neck_pulldown
      - upright_row

  lower_back_sensitive:
    prefer:
      - chest_supported_row
      - leg_press
      - hip_thrust
      - leg_curl
      - split_squat
    avoid_or_modify:
      - heavy_deadlift
      - heavy_barbell_row
      - good_morning
      - very_fatigued_back_squat

output_format:
  workout:
    fields:
      - day_name
      - template
      - goal
      - exercises
      - notes

  exercise_output:
    fields:
      - order
      - exercise_id
      - name
      - sets
      - reps
      - rpe
      - rest_seconds
      - notes

example_generated_workout:
  day_name: "Push Day"
  template: push_day
  goal: hypertrophy
  exercises:
    - order: 1
      exercise_id: incline_dumbbell_press
      name: "Schrägbankdrücken mit Kurzhanteln"
      sets: 3
      reps: "6-10"
      rpe: "8"
      rest_seconds: 120
      notes: "Oberer Brustfokus."
    - order: 2
      exercise_id: dips_chest
      name: "Brust-Dips"
      sets: 2
      reps: "8-12"
      rpe: "8"
      rest_seconds: 120
      notes: "Leichte Vorneigung."
    - order: 3
      exercise_id: lateral_raise
      name: "Seitheben"
      sets: 2
      reps: "12-20"
      rpe: "9"
      rest_seconds: 60
      notes: "Kontrolliert, kein Schwung."
    - order: 4
      exercise_id: cable_fly
      name: "Kabelzug-Fliegende"
      sets: 2
      reps: "12-20"
      rpe: "9"
      rest_seconds: 60
      notes: "Konstante Spannung."
    - order: 5
      exercise_id: overhead_triceps_extension
      name: "Überkopf-Trizepsstrecken"
      sets: 2
      reps: "10-15"
      rpe: "8-9"
      rest_seconds: 60
      notes: "Langer Trizepskopf."
```

Und für deine App würde ich zusätzlich noch eine **Alias-Datei** machen, damit freie Texte wie `"bench"`, `"bankdrücken"`, `"db incline"` usw. sauber auf IDs gemappt werden.

