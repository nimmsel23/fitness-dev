    rest_guidance:
      - "Mindestens 1 Ruhetag nach Bedarf."
      - "Ideal bei 3 Trainingstagen pro Woche."

  upper_lower_4_day:
    label_de: "Upper Lower 4x/Woche"
    days:
      - day: 1
