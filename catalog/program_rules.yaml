Damit hast du jetzt drei Ebenen:

```text
1. exercise YAMLs      = Wissen pro Körperregion
2. program_rules.yml  = Logik für Workout-Erstellung
3. aliases.yml        = Textinput → Exercise-ID
```

funny thing is, dass wger local als docker-app läuft, aber mit exercise db bin ich dennoch nicht ganz zufrieden. ich denke der lokale agent wird eine lösung finden wie man das mit deinen yamls überbrücken und für die fitness app nutzen kann, ja?

Ja, absolut. **wger muss nicht perfekt sein**, damit es nützlich ist. Der sauberste Ansatz wäre:

**wger = lokales Tracking-/UI-/Datenbank-System**
**deine YAMLs = eigene Coach-/Semantik-/Programmierlogik darüber**

wger ist dafür grundsätzlich geeignet, weil es self-hostable ist, Workout-/Fitnessdaten verwaltet und eine REST API für Integrationen anbietet. Die offizielle Doku beschreibt es explizit als Open-Source-Webapp für Workouts, Gewicht, Ernährung und einfache Gym-Verwaltung mit REST API; das GitHub-README nennt außerdem Custom Workout Routines, Exercise Wiki, Self-Hosting via Docker und API-Integrationen. ([wger.readthedocs.io][1])

Der lokale Agent könnte also so arbeiten:

```text
User/App Input
   ↓
aliases.yml
   ↓
eigene exercise YAMLs
   ↓
program_rules.yml
   ↓
Workout-Generator / Coach Logic
   ↓
wger API / lokale wger DB / Export
```

Das heißt: **nicht wger Exercise DB blind vertrauen**, sondern wger eher als Speicher, Kalender, Logger und Oberfläche nutzen.

## Sinnvolle Architektur

```yaml
fitness_app_bridge:
  sources:
    custom_yaml_library:
      role: "semantic_source_of_truth"
      contains:
        - exercise_names
        - german_names
        - muscles
        - movement_patterns
        - variations
        - coaching_notes
        - common_errors
        - tags
        - program_rules

    wger_local:
      role: "tracking_and_storage_backend"
      contains:
        - workouts
        - routines
        - logs
        - sets
        - reps
        - weights
        - bodyweight
        - nutrition_optional

  agent_roles:
    resolver:
      input: "free text exercise name"
      uses:
        - aliases.yml
      output: "canonical_exercise_id"

    mapper:
      input: "canonical_exercise_id"
      uses:
        - custom YAMLs
        - wger exercise list/API
      output:
        - "custom_exercise_id"
        - "wger_exercise_id if available"
        - "mapping_confidence"

    planner:
      input:
        - "goal"
        - "available days"
        - "equipment"
        - "injury constraints"
      uses:
        - program_rules.yml
        - regional exercise YAMLs
      output: "planned workout"

    exporter:
      input: "planned workout"
      output:
        - "wger routine"
        - "markdown note"
        - "json export"
        - "yaml export"

    logger:
      input: "completed workout"
      output:
        - "wger log entry"
        - "local history"
        - "progression recommendation"
```

## Der Trick: Mapping statt Ersetzen

Du brauchst nicht zwingend alle Übungen in wger perfekt pflegen. Du kannst eine Mapping-Datei dazwischenlegen:

## `wger_mapping.yml`

```yaml
wger_mapping:
  version: "0.1.0"

  exercises:
    barbell_bench_press:
      custom_id: barbell_bench_press
      wger_match:
        status: "needs_lookup"
        wger_id: null
        confidence: null
      fallback_name: "Langhantel-Bankdrücken"
      export_as_custom_exercise: true

    incline_dumbbell_press:
      custom_id: incline_dumbbell_press
      wger_match:
        status: "needs_lookup"
        wger_id: null
        confidence: null
      fallback_name: "Schrägbankdrücken mit Kurzhanteln"
      export_as_custom_exercise: true

    pull_up:
      custom_id: pull_up
      wger_match:
        status: "needs_lookup"
        wger_id: null
        confidence: null
      fallback_name: "Klimmzug im Obergriff"
      export_as_custom_exercise: true

    chin_up:
      custom_id: chin_up
      wger_match:
        status: "needs_lookup"
        wger_id: null
        confidence: null
      fallback_name: "Klimmzug im Untergriff"
      export_as_custom_exercise: true

    deadlift:
      custom_id: deadlift
      wger_match:
        status: "needs_lookup"
